<!DOCTYPE html>
<html lang="uk">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Статистика · проєкти ClayArena</title>
<!-- ClayArena · PRIVATE statistics dashboard (Apps Script HtmlService template, served by doGet() in Code.gs to the owner only).
     Data: DATA below (aggregates from the sheet "hits", built by aggregate_() in Code.gs); the period switcher and "Оновити" call
     getStats(days) through google.script.run. Every text that came from visitors (paths, referrers, event values) is escaped
     before it is shown (esc()). No external libraries, no external requests. UI language: Ukrainian. -->
<style>
:root{color-scheme:dark;--bg:#030712;--surface:#0B1120;--surface2:#111827;--line:rgba(255,255,255,.09);--grid:rgba(255,255,255,.07);
  --text:#F9FAFB;--text2:#D1D5DB;--muted:#9CA3AF;--accent:#34D399;--views:#0EA371;--visits:#8B5CF6;--track:rgba(255,255,255,.06);--warn:#FBBF24;--bad:#F87171}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
h1 b{background:linear-gradient(90deg,#34D399,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0}
.note{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:3px 10px;border:1px solid rgba(52,211,153,.35);border-radius:999px;color:var(--accent);font-size:12.5px;background:rgba(52,211,153,.08)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button,.btn{font:inherit;color:var(--text2);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:rgba(52,211,153,.16);color:var(--accent);font-weight:700}
.seg button:hover,.btn:hover{color:#fff}
.btn{border:1px solid var(--line);background:var(--surface)}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{color:var(--muted);font-size:12.5px;min-height:18px}
.status.err{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{color:var(--muted);font-size:12.5px}
.tile .v{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .h{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700}
.card h2 small{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.wide{grid-column:1/-1}
h3.sec{font-size:17px;margin:26px 0 0;font-weight:800}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--text2);font-size:12.5px;margin:-4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:3px;width:14px;border-radius:2px;vertical-align:2px}
#chart{position:relative;width:100%}
#chart svg{display:block;width:100%;overflow:visible}
#chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:10;pointer-events:none;background:#000;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text);box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:260px}
.tip b{display:block;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
ol.bars{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.bars li{display:grid;grid-template-columns:minmax(0,42%) minmax(40px,1fr) auto;gap:10px;align-items:center}
.lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.lab small{color:var(--muted)}
.track{height:10px;background:var(--track);border-radius:0 4px 4px 0;overflow:hidden}
.fill{display:block;height:100%;background:var(--views);border-radius:0 4px 4px 0;min-width:2px}
.val{font-variant-numeric:tabular-nums;color:var(--text);text-align:right;min-width:36px}
.val small{color:var(--muted);margin-left:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12.5px}
th:first-child,td:first-child{text-align:left;white-space:normal;word-break:break-all}
td.path{max-width:520px}
td .mini{display:inline-block;height:6px;background:var(--views);border-radius:0 3px 3px 0;vertical-align:middle;margin-right:8px}
.tblwrap{overflow-x:auto}
.empty{color:var(--muted);margin:4px 0}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.kpis div{min-width:90px}.kpis b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpis span{color:var(--muted);font-size:12.5px}
details{margin-top:8px;color:var(--text2)}
summary{cursor:pointer;color:var(--muted);font-size:12.5px}
footer{color:var(--muted);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
footer p{margin:4px 0}
.warn{color:var(--warn)}
@media (max-width:600px){h1{font-size:19px}.tile .v{font-size:24px}ol.bars li{grid-template-columns:minmax(0,48%) minmax(30px,1fr) auto}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Статистика · <b>проєкти ClayArena</b></h1>
      <p class="sub" id="period">—</p>
      <span class="note">🔒 Анонімна статистика: без cookies і IP</span>
    </div>
    <div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Період" id="seg">
          <button type="button" data-days="1">1 день</button><button type="button" data-days="7">7 днів</button><button type="button" data-days="30">30 днів</button><button type="button" data-days="90">90 днів</button>
        </div>
        <button type="button" class="btn" id="reload">↻ Оновити</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>
<div class="tip" id="tip" hidden></div>
<script>var DATA = <?!= payload ?>;</script>
<script>
(function () {
  "use strict";
  /* ---------- names (Ukrainian) ---------- */
  var SECTIONS = { learn: "Академія", glossary: "Глосарій", rules: "Правила FITASC", trainer: "Тренажер правил", tours: "Тури ClayAway",
    spec: "ТЗ проєктів", home: "Головна", other: "Інше" };
  var DEVICES = { phone: "Телефон", tablet: "Планшет", desktop: "Комп’ютер" };
  var LANGS = { en: "англійська", uk: "українська", de: "німецька", fr: "французька", it: "італійська", cs: "чеська", pl: "польська",
    pt: "португальська", hu: "угорська", fi: "фінська", lt: "литовська", sk: "словацька", es: "іспанська", nl: "нідерландська",
    sv: "шведська", da: "данська", nb: "норвезька", no: "норвезька", nn: "норвезька", sl: "словенська", hr: "хорватська", sr: "сербська",
    bs: "боснійська", ro: "румунська", bg: "болгарська", el: "грецька", tr: "турецька", lv: "латиська", et: "естонська", ga: "ірландська",
    mt: "мальтійська", is: "ісландська", sq: "албанська", mk: "македонська", ka: "грузинська", hy: "вірменська", az: "азербайджанська",
    kk: "казахська", be: "білоруська", ja: "японська", zh: "китайська", ko: "корейська", ar: "арабська", he: "іврит", hi: "гінді",
    id: "індонезійська", vi: "в’єтнамська", th: "тайська", ca: "каталонська", eu: "баскська", gl: "галісійська", cy: "валлійська" };
  var ROUTES = { beginner: "Новачок", "first-competition": "Перші змагання", interpreter: "Перекладач", "junior-parent": "Батьки юніора",
    "new-coach": "Тренер-початківець", organiser: "Організатор", fan: "Вболівальник і родина" };
  var GAMES = { "lead-lab": "Лабораторія виносу", "name-the-flight": "Назви траєкторію", "translate-the-coach": "Зрозумійте / перекладіть тренера",
    "referees-call": "Рішення судді", "term-cards": "Картки термінів", phrasebook: "Розмовник", "rules-exam": "Іспит з правил", routine: "Мій ритуал" };
  var METHODS = { maintained: "Постійний винос", swing: "Протяжка", pullaway: "Вихід з мішені", ambush: "Стрільба в точку" };
  var DISC = { sporting: "Sporting™", compak: "Compak® Sporting", both: "Обидві дисципліни" };
  var MODES = { quick: "швидкий тест", short: "короткий тест", exam: "іспит", mistakes: "мої помилки" };
  var OTHER_EVENTS = {};

  /* ---------- helpers ---------- */
  var nf = new Intl.NumberFormat("uk-UA");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function n(x) { return x == null ? "—" : nf.format(x); }
  function pct(x) { return x == null ? "—" : nf.format(x) + " %"; }
  function dur(s) { if (s == null) return "—"; s = Math.round(s); if (s < 60) return s + " с"; var m = Math.floor(s / 60), r = s % 60; return m + " хв " + (r < 10 ? "0" : "") + r + " с"; }
  function lang(code) { if (!code || code === "?") return "невідомо"; var p = String(code).split("-")[0].toLowerCase(); return (LANGS[p] ? LANGS[p] + " " : "") + "(" + code + ")"; }
  function named(map) { return function (k) { return k === "?" || k === "" ? "невідомо" : map[k] ? map[k] + " <small>" + esc(k) + "</small>" : esc(k); }; }
  function path(p) { var s = String(p); try { s = decodeURI(s); } catch (e) {} return s; }
  function bucketLabel(k, hourly) { if (hourly) return k.slice(11, 13) + ":00"; return k.slice(8, 10) + "." + k.slice(5, 7); }
  function bucketLong(k, hourly) { return hourly ? k.slice(8, 10) + "." + k.slice(5, 7) + " " + k.slice(11, 13) + ":00" : k.slice(8, 10) + "." + k.slice(5, 7) + "." + k.slice(0, 4); }
  var $ = function (id) { return document.getElementById(id); };

  /* Bar list: rows [key, value, extra?]; label(key) returns HTML (already escaped); single series, so no legend. */
  function bars(rows, label, opts) {
    opts = opts || {};
    if (!rows || !rows.length) return '<p class="empty">Немає даних за цей період.</p>';
    var max = Math.max.apply(null, rows.map(function (r) { return r[1]; })) || 1;
    return '<ol class="bars">' + rows.map(function (r) {
      var lab = label ? label(r[0]) : esc(r[0]), extra = opts.extra ? opts.extra(r) : "";
      return '<li><span class="lab" title="' + esc(String(lab).replace(/<[^>]+>/g, "")) + '">' + lab + '</span><span class="track"><span class="fill" style="width:' +
        Math.max(1, Math.round(r[1] / max * 100)) + '%"></span></span><span class="val">' + n(r[1]) + extra + "</span></li>";
    }).join("") + "</ol>";
  }
  function table(head, rows, cells) {
    if (!rows || !rows.length) return '<p class="empty">Немає даних за цей період.</p>';
    return '<div class="tblwrap"><table><thead><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") + "</tr></thead><tbody>" +
      rows.map(function (r) { return "<tr>" + cells(r).map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
  }
  function card(title, body, opts) { opts = opts || {}; return '<section class="card' + (opts.wide ? " wide" : "") + '"><h2>' + title + (opts.small ? " <small>" + opts.small + "</small>" : "") + "</h2>" + body + "</section>"; }
  function kpis(list) { return '<div class="kpis">' + list.map(function (k) { return "<div><b>" + k[1] + "</b><span>" + k[0] + "</span></div>"; }).join("") + "</div>"; }

  /* ---------- chart: views (columns) and visits (line) per day or hour ---------- */
  function niceMax(v) { if (v <= 4) return 4; var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
  function drawChart() {
    var box = $("chart"); if (!box) return;
    var S = DATA.series || [], hourly = DATA.hourly, W = Math.max(280, box.clientWidth || 600), H = W < 500 ? 200 : 240;
    var L = 40, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B, nB = S.length || 1, band = pw / nB;
    var top = niceMax(Math.max(1, Math.max.apply(null, S.map(function (b) { return b.v; }).concat([1])))), y = function (v) { return T + ph - v / top * ph; };
    var bw = Math.max(2, Math.min(24, band * 0.62)), out = ['<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Перегляди і відвідування">'];
    for (var g = 0; g <= 4; g++) { var gv = top / 4 * g, gy = Math.round(y(gv)) + .5;
      out.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="' + (g ? "rgba(255,255,255,.07)" : "rgba(255,255,255,.2)") + '" stroke-width="1"/>');
      out.push('<text x="' + (L - 6) + '" y="' + (gy + 4) + '" text-anchor="end">' + nf.format(Math.round(gv * 10) / 10) + "</text>"); }
    var every = Math.max(1, Math.ceil(nB / Math.max(1, Math.floor(pw / 46))));
    S.forEach(function (b, i) {
      var cx = L + band * i + band / 2, h = b.v / top * ph, x = cx - bw / 2, yb = T + ph;
      out.push('<rect class="hit" data-i="' + i + '" x="' + (L + band * i) + '" y="' + T + '" width="' + band + '" height="' + ph + '" fill="transparent"/>');
      if (h > 0) { var r = Math.min(4, h, bw / 2), yt = yb - h;
        out.push('<path pointer-events="none" fill="var(--views)" d="M' + x + "," + yb + "V" + (yt + r) + "Q" + x + "," + yt + " " + (x + r) + "," + yt + "H" + (x + bw - r) + "Q" + (x + bw) + "," + yt + " " + (x + bw) + "," + (yt + r) + "V" + yb + 'Z"/>'); }
      if (i % every === 0) out.push('<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + bucketLabel(b.k, hourly) + "</text>");
    });
    if (S.length) {
      var pts = S.map(function (b, i) { return (L + band * i + band / 2).toFixed(1) + "," + y(b.e).toFixed(1); });
      out.push('<polyline pointer-events="none" fill="none" stroke="var(--visits)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + pts.join(" ") + '"/>');
      if (S.length <= 31) S.forEach(function (b, i) { out.push('<circle pointer-events="none" cx="' + (L + band * i + band / 2).toFixed(1) + '" cy="' + y(b.e).toFixed(1) + '" r="4" fill="var(--visits)" stroke="var(--surface)" stroke-width="2"/>'); });
    }
    out.push('<rect id="hl" pointer-events="none" x="0" y="' + T + '" width="' + band + '" height="' + ph + '" fill="rgba(255,255,255,.05)" visibility="hidden"/></svg>');
    box.innerHTML = out.join("");
    var tip = $("tip"), hl = box.querySelector("#hl");
    box.querySelectorAll("rect.hit").forEach(function (r) {
      var show = function (ev) { var b = S[+r.getAttribute("data-i")];
        tip.innerHTML = "<b>" + bucketLong(b.k, hourly) + '</b><i style="background:var(--views)"></i>Перегляди: ' + n(b.v) + '<br><i style="background:var(--visits)"></i>Відвідування: ' + n(b.e);
        tip.hidden = false; var x = ev.clientX + 14, yy = ev.clientY + 14;
        if (x + 220 > window.innerWidth) x = ev.clientX - 230; tip.style.left = x + "px"; tip.style.top = yy + "px";
        hl.setAttribute("x", r.getAttribute("x")); hl.setAttribute("visibility", "visible"); };
      r.addEventListener("pointermove", show); r.addEventListener("pointerdown", show);
      r.addEventListener("pointerleave", function () { tip.hidden = true; hl.setAttribute("visibility", "hidden"); });
    });
  }

  /* ---------- page ---------- */
  function render() {
    var D = DATA, T = D.totals || {}, E = D.events || {}, hourly = D.hourly, S = D.series || [];
    document.querySelectorAll("#seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-days") === D.days)); });
    $("period").textContent = (hourly ? "Останні 24 години" : D.days + " днів: " + (S.length ? bucketLong(S[0].k) + " – " + bucketLong(S[S.length - 1].k) : "")) + " · час: " + D.tz;
    var h = [];
    h.push('<div class="tiles">' + [
      ["Перегляди сторінок", n(T.views), "усі відкриті сторінки"],
      ["Відвідування (≈)", n(T.visits), "прийшли з іншого сайту або напряму"],
      ["Середній час на сторінці", dur(T.avgSec), "лише поки вкладка видима"],
      ["Середня прокрутка", pct(T.avgScroll), "наскільки глибоко читають"],
      ["Події", n(T.events), "дії в Академії, тренажері, глосарії"]
    ].map(function (t) { return '<div class="tile"><div class="k">' + t[0] + '</div><div class="v">' + t[1] + '</div><div class="h">' + t[2] + "</div></div>"; }).join("") + "</div>");
    h.push(card(hourly ? "Перегляди і відвідування по годинах" : "Перегляди і відвідування по днях",
      '<div class="legend"><span><i style="background:var(--views)"></i>Перегляди</span><span><i class="line" style="background:var(--visits)"></i>Відвідування</span></div><div id="chart"></div>' +
      "<details><summary>Таблиця</summary>" + table([hourly ? "Година" : "День", "Перегляди", "Відвідування"], S.slice().reverse(), function (b) { return [bucketLong(b.k, hourly), n(b.v), n(b.e)]; }) + "</details>", { wide: true }));
    var maxP = (D.pages || []).reduce(function (m, p) { return Math.max(m, p[1]); }, 1);
    h.push('<div class="grid">' + card("Сторінки", table(["Сторінка", "Перегляди", "Входи", "Сер. час"], D.pages, function (p) {
      return ['<span title="' + esc(path(p[0])) + '">' + esc(path(p[0])) + "</span>", '<span class="mini" style="width:' + Math.max(2, Math.round(p[1] / maxP * 60)) + 'px"></span>' + n(p[1]), n(p[2]), dur(p[3])]; }),
      { wide: true, small: D.pagesTotal > (D.pages || []).length ? "топ " + (D.pages || []).length + " з " + n(D.pagesTotal) : "" }) +
      card("Розділи", bars(D.sections, named(SECTIONS), { extra: function (r) { return r[2] != null ? "<small>" + dur(r[2]) + "</small>" : ""; } })) +
      card("Пристрої", bars(D.devices, named(DEVICES))) +
      card("Мови сторінок", bars(D.langs, function (k) { return esc(lang(k)); })) +
      card("Мови браузера", bars(D.blangs, function (k) { return esc(lang(k)); })) +
      card("Регіони", bars(D.regions, function (k) { return k === "?" ? "невідомо" : esc(k); }), { small: "за часовим поясом браузера, приблизно" }) +
      card("Джерела переходів", bars(D.refs, function (k) { return k ? esc(k) : "<i>напряму / без джерела</i>"; }), { small: "лише входи на сайт" }) + "</div>");

    h.push('<h3 class="sec">Події</h3><div class="grid">' +
      card("Маршрути Академії", bars(E.route, named(ROUTES)), { small: "обрано" }) +
      card("Уроки", kpis([["завершено вперше", n(E.lessonN)], ["тестів уроків пройдено", n(E.quiz && E.quiz.n)], ["правильних відповідей", pct(E.quiz && E.quiz.pct)]]) + bars(E.lesson, null), { small: "топ завершених" }) +
      card("Ігри практики", table(["Гра", "Запуски", "Раунди", "Сер. результат"], E.games, function (g) { return [named(GAMES)(g[0]), n(g[1]), n(g[2]), pct(g[3])]; })) +
      card("Іспити маршрутів", table(["Маршрут", "Спроби", "Складено", "Сер. бал"], E.exams, function (x) { return [named(ROUTES)(x[0]), n(x[1]), n(x[2]), pct(x[3])]; })) +
      card("Сертифікати й значки", bars(E.cert, named(ROUTES)), { small: "видано" }) +
      card("Тренажер правил", table(["Дисципліна · режим", "Тестів", "Сер. %", "≥ 80 %"], E.trainer, function (x) {
        var p = String(x[0]).split(" · "); return [(DISC[p[0]] || esc(p[0])) + " · " + (MODES[p[1]] || esc(p[1] || "")), n(x[1]), pct(x[2]), n(x[3])]; })) +
      card("Лабораторія виносу", table(["Метод", "Спроб", "Влучань", "Позаду", "Попереду", "Без пострілу"], E.lead, function (x) {
        return [named(METHODS)(x[0]), n(x[1]), x[1] ? pct(Math.round(x[2] / x[1] * 100)) : "—", n(x[3]), n(x[4]), n(x[5])]; }), { small: "«Ваша черга»" }) +
      card("Вимова 🔊", kpis([["натискань", n(E.speakN)]]) + bars(E.speak, null), { small: "топ термінів і фраз" }) +
      card("Зміна мови", bars(E.lang, function (k) { return esc(lang(k)); }) + (E.langSec && E.langSec.length ? "<details><summary>За розділами</summary>" + bars(E.langSec, named(SECTIONS)) + "</details>" : ""), { small: "на яку мову перемкнули" }) +
      card("Фільтр дисципліни", bars(E.disc, named(DISC))) +
      (E.other && E.other.length ? card("Інші події", bars(E.other, named(OTHER_EVENTS))) : "") + "</div>");
    $("app").innerHTML = h.join("");
    $("foot").innerHTML = "<p>Анонімна статистика: без cookies, без IP-адрес, без ідентифікаторів; кожен запис окремий. Дані — у вашій таблиці Google (аркуш «hits»). Посилання на цю сторінку ніде не публікується.</p>" +
      "<p>Прочитано рядків: " + n(D.scanned) + " · у періоді: " + n(D.rows) + " · сформовано: " + esc(new Date().toLocaleString("uk-UA")) + "</p>" +
      (D.capped ? '<p class="warn">Прочитано лише останні 200 000 рядків: старіші записи цього періоду не враховано. Видаліть старі дані (README, «Як видалити дані»).</p>' : "") +
      "<p>Parcours de Chasse – Sporting™ і Compak® Sporting — торговельні марки FITASC.</p>";
    drawChart();
  }

  /* ---------- period switcher, refresh ---------- */
  var busy = false;
  function status(msg, err) { var s = $("status"); s.textContent = msg || ""; s.className = "status" + (err ? " err" : ""); }
  function load(days) {
    if (busy) return;
    if (!(window.google && google.script && google.script.run)) { status("Оновлення працює лише на сторінці Apps Script.", true); return; }
    busy = true; status("Завантаження…");
    google.script.run.withSuccessHandler(function (d) {
      busy = false; DATA = d; render(); status("");
      try { google.script.history.replace(null, { days: String(days) }); } catch (e) {}
    }).withFailureHandler(function (e) { busy = false; status("Не вдалося завантажити: " + (e && e.message ? e.message : "помилка"), true); }).getStats(days);
  }
  document.querySelectorAll("#seg button").forEach(function (b) { b.addEventListener("click", function () { load(+b.getAttribute("data-days")); }); });
  $("reload").addEventListener("click", function () { load(DATA.days); });
  var rt = 0; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(drawChart, 150); });
  render();
})();
</script>
</body>
</html>
