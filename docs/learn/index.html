<h1>Академія ClayArena</h1>
<p>Одна академія для всіх, хто стріляє або допомагає стрільцям: новачків, стрільців перед першими змаганнями, перекладачів, батьків юніорів, тренерів-початківців, організаторів і вболівальників. Короткі уроки Parcours de Chasse – Sporting™ і Compak® Sporting: безпека й етикет, рушниця, чоки й патрони, мішені й траєкторії, техніка й винос, тренування, психологія, правила FITASC простими словами, змагання, подорожі, мова стенду. Терміни — англійською, як їх кажуть на стенді, з поясненням українською.</p>
<p>Інтерактивна частина (маршрути з етапами, тести, практика, значки й сертифікати) працює з увімкненим JavaScript. Прогрес зберігається лише на цьому пристрої.</p>
<h2>Хто ви? Маршрути</h2>
<ul>
  <li><a href="routes/beginner/">Новачок</a> — для того, хто ще не стріляв.</li>
  <li><a href="routes/first-competition/">Перші змагання</a> — для стрільця після кількох занять.</li>
  <li><a href="routes/interpreter/">Перекладач</a> — для перекладачів на стенді; замінює Академію перекладача.</li>
  <li><a href="routes/junior-parent/">Батьки юніора</a> — для батьків, чия дитина хоче стріляти.</li>
  <li><a href="routes/new-coach/">Тренер-початківець</a> — для того, хто починає тренувати інших.</li>
  <li><a href="routes/organiser/">Організатор</a> — для організаторів клубних турнірів і поїздок.</li>
  <li><a href="routes/fan/">Вболівальник і родина</a> — для вболівальників, родини й друзів стрільців.</li>
</ul>
