<style>
:root{
  color-scheme:dark;
  --bg:#030712; --surface:rgba(255,255,255,.04); --surface2:#0B1120; --line:rgba(255,255,255,.1);
  --ink:#F3F4F6; --soft:#D1D5DB; --muted:#9CA3AF;
  --em:#34D399; --em-soft:rgba(16,185,129,.15); --primary:#059669; --cyan:#22D3EE;
  --clay:#FB923C; --clay-soft:rgba(251,146,60,.14); --red:#F87171; --red-soft:rgba(248,113,113,.14);
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--body)}
a{color:var(--em)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(3,7,18,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:9px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.logo{display:inline-block;background:#000;border-radius:8px;padding:2px 11px;font-weight:700;font-size:17px;box-shadow:0 0 16px rgba(52,211,153,.25);text-decoration:none}
.logo b{background:linear-gradient(90deg,#34D399,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.svc{font-weight:700;background:none;border:0;padding:0;text-align:left}.svc small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.prog .bar{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--cyan))}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;font-weight:600}
main{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:22px 80px;min-width:0}
h1,h2,h3{letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:6px 0 10px}
h2{font-size:21px;margin:26px 0 10px}
h3{font-size:17px;margin:0 0 4px}
p{margin:0 0 12px;max-width:70ch}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--em)}
.hero{padding:24px;border-radius:16px;background:radial-gradient(120% 140% at 0% 0%,rgba(6,78,59,.55),transparent 60%),var(--surface2);border:1px solid var(--line);margin-bottom:22px}
.hero p{color:var(--soft);font-size:17px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.on{background:var(--em-soft);border-color:rgba(52,211,153,.5);color:var(--em);font-weight:600}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mod{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start;transition:border-color .15s}
.mod:hover{border-color:rgba(52,211,153,.5)}
.mod .n{font-size:12.5px;font-weight:700;color:var(--clay)}
.mod p{font-size:14px;color:var(--soft);margin:0}
.mod .pb{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.mod .pb i{display:block;height:100%;background:var(--em)}
.mod .meta{font-size:12px;color:var(--muted)}
.mod.soon{opacity:.5;cursor:default}
.lessons{display:grid;gap:8px;margin-top:12px}
.les{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.les:hover{border-color:rgba(52,211,153,.5)}
.les .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;color:var(--muted)}
.les.done .ck{background:var(--em);border-color:var(--em);color:#022C22;font-weight:800}
.les b{display:block}.les span{font-size:13px;color:var(--muted)}
article.lesson{max-width:760px}
article.lesson p{font-size:17px;color:var(--soft);line-height:1.75}
.kp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:16px 0}
.kp ul{margin:6px 0 0;padding-left:20px;color:var(--soft)}.kp li::marker{color:var(--em)}
.dyk{background:var(--clay-soft);border-radius:14px;padding:14px 18px;margin:16px 0;color:#FED7AA}
.dyk b{color:var(--clay)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips a,.chips button{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--em);text-decoration:none}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.q h3{font-size:16.5px;font-weight:600;line-height:1.45;margin:0 0 10px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:10px 12px;font-size:15px}
.opts button:hover:not([disabled]){border-color:rgba(52,211,153,.5)}
.opts button.right{border-color:var(--em);background:var(--em-soft)}
.opts button.wrong{border-color:var(--red);background:var(--red-soft)}
.explain{margin-top:10px;border-left:3px solid var(--em);padding-left:12px;color:var(--soft);font-size:14.5px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.pop{background:var(--surface2);border:1px solid rgba(52,211,153,.4);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14.5px;color:var(--soft)}
.src-list{padding-left:20px;color:var(--soft);font-size:14.5px}.src-list li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#030712;font-weight:700;padding:8px 16px;border-radius:999px;z-index:40}
footer{margin-top:48px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="../shared/nav.js" defer></script>
</head>

<script>
/* =====================================================================================================
   ClayArena Academy — clay shooting from zero (part of ClayArena; project, to be rebuilt by the dev team).
   Audience: beginners, parents of juniors, friends of shooters, spectators. Separate from Vika's Academy.
   Data: docs/learn/data/<module>.js push modules into window.LEARN (format: data/SCHEMA.md).
   Uses: ClayArena glossary (docs/glossary/data/glossary.js) for term chips → /glossary/<id>/ pages,
         rules guide data (docs/rules/data/*.js) for "Where this is in the rules" → static rules pages.
   Routing: hash #<module> or #<lesson-id> (deep links, also used by the static SEO lesson pages).
   Progress: localStorage "clayarena-learn" {done:{lessonId:quizScore}, lang}; in ClayArena → user profile + badges.
   ===================================================================================================== */
const MODS=(window.LEARN||[]).slice().sort((a,b)=>a.order-b.order);
const PLAN=[["intro",1,"Знайомство зі спортом","Meet the sport"],["safety",2,"Безпека і етикет","Safety and etiquette"],["gun",3,"Рушниця","The shotgun"],["chokes",4,"Чоки","Chokes"],["cartridges",5,"Патрони і дріб","Cartridges and shot"],["targets",6,"Мішені і траєкторії","Targets and trajectories"],["technique",7,"Перші кроки в техніці","First steps in technique"],["competitions",8,"Змагання","Competitions"],["rules",9,"Правила простими словами","Rules in plain words"],["culture",10,"Культура спорту","Culture of the sport"],["clayarena",11,"ClayArena для стрільця","ClayArena for shooters"],["gear",12,"Спорядження стрільця","Shooter's gear"],["training",13,"Як тренуватися","How to train"],["juniors",14,"Юніори і батьки","Juniors and parents"],["travel",15,"Подорожі на змагання","Travelling to competitions"],["mind",16,"Голова і тіло","Mind and body"],["health",17,"Здоровʼя стрільця","Shooter's health"],["women",18,"Жінки у стрільбі","Women in shooting"],["budget",19,"Скільки коштує почати","What it costs to start"],["history",20,"Історія спорту","History of the sport"],["watching",21,"Як дивитися стрільбу","How to watch clay shooting"],["nextstep",22,"Наступний крок","The next step"]];
const GL=Object.fromEntries(((window.GLOSSARY||{}).terms||[]).map(t=>[t.id,t]));
const RULEITEM={}; (window.RULES||[]).forEach(b=>b.sections.forEach(s=>s.items.forEach(it=>RULEITEM[b.key+":"+it.id]=Object.assign({book:b.key,url:b.source.url},it))));
/* Badges: earned by finishing modules (all lessons with the quiz done). */
const BADGES=[["first","Перший урок","First lesson",p=>Object.keys(p.done).length>=1],["safe","Безпечний стрілець","Safe shooter",p=>modDone("safety")],["gear","Знаю спорядження","Knows the gear",p=>["gun","chokes","cartridges"].every(modDone)],["ready","Готовий до змагань","Ready to compete",p=>["competitions","rules"].every(modDone)],["all","Випускник Академії","Academy graduate",p=>MODS.length>0&&MODS.every(m=>modDone(m.module))]];
const T={uk:{svc:"Академія ClayArena",svcS:"стендова стрільба з нуля",h1:"Стендова стрільба з нуля",lead:"Короткі уроки для тих, хто тільки починає: що це за спорт, безпека, рушниці, чоки, патрони, мішені, техніка, змагання, правила й культура. Терміни — англійською, як їх кажуть на стенді, з поясненням українською.",
  lessons:"уроків",min:"хв",soon:"Модуль готується",back:"← Усі модулі",backM:"← До модуля",kp:"Головне",dyk:"Чи знали ви?",terms:"Терміни",rules:"Де це в правилах",check:"Перевірте себе",next:"Наступний урок",done:"Урок пройдено",right:"Правильно!",wrong:"Не зовсім.",badges:"Значки",prog:"пройдено",
  foot:"Академія ClayArena — частина ClayArena. Правила FITASC — у нашому переказі; чинним є лише офіційний текст FITASC. Parcours de Chasse – Sporting™ і Compak® Sporting — торговельні марки FITASC. Закони про зброю й набої в кожній країні різні.",glossary:"Глосарій",rulesLink:"Правила FITASC",trainer:"Тренажер правил"},
 en:{svc:"ClayArena Academy",svcS:"clay shooting from zero",h1:"Clay shooting from zero",lead:"Short lessons for beginners: the sport, safety, shotguns, chokes, cartridges, targets, technique, competitions, rules and culture. Terms in English, as they are said on the stand.",
  lessons:"lessons",min:"min",soon:"Module coming soon",back:"← All modules",backM:"← Back to module",kp:"Key points",dyk:"Did you know?",terms:"Terms",rules:"Where this is in the rules",check:"Check yourself",next:"Next lesson",done:"Lesson completed",right:"Correct!",wrong:"Not quite.",badges:"Badges",prog:"done",
  foot:"ClayArena Academy is part of ClayArena. FITASC rules are our summary; only the official FITASC text applies. Parcours de Chasse – Sporting™ and Compak® Sporting are trademarks of FITASC. Gun and ammunition laws differ by country.",glossary:"Glossary",rulesLink:"FITASC rules",trainer:"Rules trainer"}};
const store={get(){try{return JSON.parse(localStorage.getItem("clayarena-learn")||"{}")}catch(e){return{}}},set(v){try{localStorage.setItem("clayarena-learn",JSON.stringify(v))}catch(e){}}};
let P=Object.assign({lang:"uk",done:{}},store.get());
let S={view:"home",mod:null,les:null,ans:{},pop:null};
const L=()=>P.lang,t=k=>T[L()][k],tx=(o,k)=>o[k+"_"+L()]||o[k+"_en"]||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const allLessons=()=>MODS.flatMap(m=>m.lessons.map(l=>Object.assign({mod:m.module},l)));
function modDone(k){ const m=MODS.find(x=>x.module===k); return !!m&&m.lessons.every(l=>P.done[l.id]!=null); }
function toast(m){ const d=document.createElement("div"); d.className="toast"; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),1500); }
function hdr(){
  document.documentElement.lang=L()==="uk"?"uk":"en";
  document.getElementById("svc").innerHTML=`${t("svc")}<small>${t("svcS")}</small>`;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===L()));
  const all=allLessons().length, d=Object.keys(P.done).length;
  document.getElementById("progTxt").textContent=`${d}/${all} ${t("prog")}`;
  document.getElementById("progBar").style.width=all?Math.round(d/all*100)+"%":"0";
}
function homeView(){
  return `<section class="hero"><div class="eyebrow">ClayArena Academy</div><h1>${t("h1")}</h1><p>${t("lead")}</p>
   <div class="badges">${BADGES.map(b=>`<span class="badge ${b[3](P)?"on":""}">${b[3](P)?"✓ ":""}${L()==="uk"?b[1]:b[2]}</span>`).join("")}</div>
   <div class="chips" style="margin-top:12px"><a href="../glossary/">${t("glossary")}</a><a href="../rules/">${t("rulesLink")}</a><a href="../rules/trainer/">${t("trainer")}</a></div></section>
   <div class="mods">${PLAN.map(([k,n,uk,en])=>{ const m=MODS.find(x=>x.module===k); if(!m) return `<div class="mod soon"><span class="n">${n}</span><h3>${L()==="uk"?uk:en}</h3><p>${t("soon")}</p></div>`;
     const dn=m.lessons.filter(l=>P.done[l.id]!=null).length, mins=m.lessons.reduce((s,l)=>s+(l.minutes||4),0);
     return `<button class="mod" data-mod="${k}"><span class="n">${n}</span><h3>${esc(tx(m,"title"))}</h3><p>${esc(tx(m,"intro"))}</p><div class="pb"><i style="width:${Math.round(dn/m.lessons.length*100)}%"></i></div><span class="meta">${m.lessons.length} ${t("lessons")} · ~${mins} ${t("min")} · ${dn}/${m.lessons.length}</span></button>`; }).join("")}</div>`;
}
function modView(m){
  return `<button class="btn" data-go="home">${t("back")}</button><div class="eyebrow" style="margin-top:14px">${m.order} · ${esc(tx(m,"title"))}</div><h1>${esc(tx(m,"title"))}</h1><p class="muted">${esc(tx(m,"intro"))}</p>
   <div class="lessons">${m.lessons.map((l,i)=>`<button class="les ${P.done[l.id]!=null?"done":""}" data-les="${l.id}"><span class="ck">${P.done[l.id]!=null?"✓":i+1}</span><span style="flex:1"><b>${esc(tx(l,"title"))}</b><span>${esc(tx(l,"summary"))}</span></span><span>${l.minutes||4} ${t("min")}</span></button>`).join("")}</div>`;
}
/* Term chip: glossary page if the canonical term exists, otherwise a small inline popup from new_terms. */
function termChip(l,id){ if(GL[id]) return `<a href="../glossary/${id}/">${esc(GL[id].term)}</a>`; const n=(l.new_terms||[]).find(x=>x.id===id); return n?`<a href="../glossary/${id}/">${esc(n.term)}</a>`:""; }  /* academy terms also get glossary pages (build_seo.mjs) */
/* Country law table (e.g. German federal states' lead-shot rules): data docs/learn/data/laws-<code>.js → window.LAWS[code]. */
function lawTable(code){ const D=(window.LAWS||{})[code]; if(!D) return ""; const u=L()==="uk";
  return `<h2>${u?"Німеччина по землях: свинцевий дріб":"Germany by state: lead shot"}</h2><p class="small muted">${esc(u?D.note_uk:D.note_en)} (${esc(D.as_of)})</p><div style="overflow-x:auto;border:1px solid var(--line);border-radius:12px"><table style="border-collapse:collapse;width:100%;font-size:14px"><thead><tr>${(u?["Земля","Норма","Що заборонено","З"]:["State","Rule","What is banned","Since"]).map(h=>`<th style="text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px">${h}</th>`).join("")}</tr></thead><tbody>${D.states.map(x=>`<tr><td style="padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap"><b>${esc(u?x.state_uk:x.state_en)}</b><br><span class="small muted">${esc(x.state_de)}</span></td><td style="padding:8px 10px;border-bottom:1px solid var(--line)">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="nofollow noopener noreferrer">${esc(x.law)}${x.article?", "+esc(x.article):""} ↗</a>`:esc(x.law)}</td><td style="padding:8px 10px;border-bottom:1px solid var(--line)">${esc(u?x.rule_uk:x.rule_en)}${x.verified===false?` <span class="small" style="color:var(--clay)">${u?"(не підтверджено)":"(unverified)"}</span>`:""}</td><td style="padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap">${esc(x.since||"—")}</td></tr>`).join("")}</tbody></table></div>`; }
function lessonView(m,l){
  const i=m.lessons.findIndex(x=>x.id===l.id), next=m.lessons[i+1]||(MODS[MODS.indexOf(m)+1]||{lessons:[]}).lessons[0];
  const pop=S.pop&&S.pop.les===l.id?(l.new_terms||[]).find(x=>x.id===S.pop.id):null;
  const quiz=(l.quiz||[]).map((q,qi)=>{ const a=S.ans[l.id+":"+qi]; return `<div class="q"><h3>${qi+1}. ${esc(tx(q,"q"))}</h3><div class="opts">${q.options.map((o,oi)=>{ let c=""; if(a!=null){ if(oi===q.answer)c="right"; else if(oi===a)c="wrong"; } return `<button ${a!=null?"disabled":""} class="${c}" data-ans="${l.id}|${qi}|${oi}">${esc(o[L()]||o.en)}</button>`; }).join("")}</div>${a!=null?`<div class="explain"><b>${a===q.answer?t("right"):t("wrong")}</b> ${esc(tx(q,"explain"))}</div>`:""}</div>`; }).join("");
  const refs=(l.rule_refs||[]).map(r=>RULEITEM[r.book+":"+r.id]).filter(Boolean);
  return `<button class="btn" data-mod="${m.module}">${t("backM")}</button>
   <article class="lesson"><div class="eyebrow" style="margin-top:14px">${esc(tx(m,"title"))} · ${i+1}/${m.lessons.length} · ${l.minutes||4} ${t("min")}</div><h1>${esc(tx(l,"title"))}</h1>
   ${(l["body_"+L()]||l.body_en||[]).map(p=>`<p>${esc(p)}</p>`).join("")}
   <div class="kp"><b>${t("kp")}</b><ul>${(l["key_points_"+L()]||[]).map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>
   ${tx(l,"did_you_know")?`<div class="dyk"><b>${t("dyk")}</b> ${esc(tx(l,"did_you_know"))}</div>`:""}
   ${(l.terms||[]).length?`<h2>${t("terms")}</h2><div class="chips">${l.terms.map(id=>termChip(l,id)).join("")}</div>${pop?`<div class="pop"><b>${esc(pop.term)}</b> — ${esc(pop["short_"+L()]||pop.short_en)}</div>`:""}`:""}
   ${refs.length?`<h2>${t("rules")}</h2><div class="chips">${refs.map(it=>`<a href="../rules/${it.book}/#${it.id}">${esc(it.ref)}</a>`).join("")}</div>`:""}
   ${l.law_tables?`<h2>${L()==="uk"?"Закони країн":"Country laws"}</h2>`+lawTablesHtml(l.law_tables,L(),esc,'target="_blank" rel="nofollow noopener noreferrer"'):""}
   ${(l.sources||[]).length?`<h2>${L()==="uk"?"Джерела і закони":"Sources and laws"}</h2><ul class="src-list">${l.sources.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="nofollow noopener noreferrer">${esc(L()==="uk"?x.title:(x.title_en||x.title))} ↗</a></li>`).join("")}</ul><p class="small muted">${L()==="uk"?"Інформація станом на дату уроку, не є юридичною консультацією. Закони змінюються — перевіряйте актуальну редакцію.":"Information as of the lesson date, not legal advice. Laws change — check the current version."}</p>`:""}
   ${quiz?`<h2>${t("check")}</h2>${quiz}`:""}
   <div class="nav">${P.done[l.id]!=null?`<span class="badge on">✓ ${t("done")}</span>`:"<span></span>"}${next?`<button class="btn primary" data-les="${next.id}">${t("next")} →</button>`:""}</div></article>`;
}
function render(){
  hdr(); const app=document.getElementById("app");
  const m=S.mod&&MODS.find(x=>x.module===S.mod), l=m&&S.les&&m.lessons.find(x=>x.id===S.les);
  app.innerHTML=(S.view==="lesson"&&l?lessonView(m,l):S.view==="mod"&&m?modView(m):homeView())+`<footer>${t("foot")}</footer>`;
}
function openLesson(id){ const l=allLessons().find(x=>x.id===id); if(!l) return; S.view="lesson"; S.mod=l.mod; S.les=id; S.pop=null; try{history.replaceState(null,"","#"+id)}catch(_){} render(); scrollTo(0,0);
  /* the project bar (docs/shared/nav.js) offers the way back to this lesson from other ClayArena sections */
  window.ClayNav&&ClayNav.setResume({section:"learn",label:(L()==="uk"?"Академія ClayArena · ":"ClayArena Academy · ")+tx(l,"title"),url:location.href}); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return; const d=b.dataset;
  if(d.lang){ P.lang=d.lang; store.set(P); render(); return; }
  if(d.go){ S.view="home"; S.mod=null; try{history.replaceState(null,"","#")}catch(_){} render(); scrollTo(0,0); return; }
  if(d.mod){ S.view="mod"; S.mod=d.mod; try{history.replaceState(null,"","#"+d.mod)}catch(_){} render(); scrollTo(0,0); return; }
  if(d.les){ openLesson(d.les); return; }
  if(d.pop){ const [les,id]=d.pop.split("|"); S.pop={les,id}; render(); return; }
  if(d.ans){ const [les,qi,oi]=d.ans.split("|"); S.ans[les+":"+qi]=+oi; const l=allLessons().find(x=>x.id===les);
    if((l.quiz||[]).every((q,i)=>S.ans[les+":"+i]!=null)){ const sc=l.quiz.filter((q,i)=>S.ans[les+":"+i]===q.answer).length; const first=P.done[les]==null; P.done[les]=Math.max(P.done[les]||0,sc); store.set(P); if(first) toast(`${t("done")} · ${sc}/${l.quiz.length}`); }
    render(); return; }
});
/* Initial route from the hash (#module or #lesson-id). */
(function(){ const h=decodeURIComponent(location.hash.slice(1)); if(!h) return; if(MODS.find(m=>m.module===h)){ S.view="mod"; S.mod=h; } else if(allLessons().find(l=>l.id===h)){ const l=allLessons().find(x=>x.id===h); S.view="lesson"; S.mod=l.mod; S.les=h; } })();
render();
</script>
</body>
</html>
