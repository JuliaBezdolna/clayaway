html,body{margin:0}

:root{
  color-scheme:dark;
  --paper:#030712; --surface:#0B1120; --surface2:#111827; --ink:#F3F4F6; --muted:#9CA3AF; --line:rgba(255,255,255,.1);
  --field:#34D399; --field-soft:rgba(16,185,129,.15); --on-accent:#022C22; --primary:#059669;
  --clay:#FB923C; --clay-soft:rgba(251,146,60,.14); --cyan:#22D3EE;
  --display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--field)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px}
.brand small{font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--muted)}
.dot{width:13px;height:13px;border-radius:50%;background:var(--clay);box-shadow:inset 0 0 0 3px var(--surface),0 0 0 2px var(--clay);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--field);color:var(--on-accent);font-weight:600}
.seg.tours button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.top .spacer{flex:1}
.proto{font-size:12px;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;color:var(--clay);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 12px}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 6px}
p{margin:0 0 10px;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:13px}
/* gallery */
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:130px 130px;gap:8px;margin-bottom:18px}
.ph{border-radius:10px;display:flex;align-items:flex-end;padding:10px 12px;font-size:12.5px;color:var(--ink);min-width:0;position:relative;overflow:hidden;background:var(--field-soft)}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(46,91,72,.06) 14px 15px)}
.ph span{position:relative;background:var(--surface);padding:2px 8px;border-radius:4px}
.ph.big{grid-row:span 2;background:linear-gradient(160deg,var(--field-soft),var(--clay-soft))}
.ph.video span::before{content:"▶ ";color:var(--clay)}
@media (max-width:640px){.gallery{grid-template-columns:1fr 1fr;grid-template-rows:150px 90px 90px}.ph.big{grid-column:span 2;grid-row:auto}.ph.extra{display:none}}
/* layout */
.page>*{min-width:0}
.page{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:900px){.page{grid-template-columns:1fr}}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin-bottom:10px}
.facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.langbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 14px;font-size:13px;color:var(--muted)}
.langbar .seg button{padding:3px 9px;font-size:12.5px}
.seats{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:8px 0}
.seats i{width:13px;height:13px;border-radius:50%;border:2px solid var(--clay)}
.seats i.t{background:var(--line);border-color:var(--line)}
.seats i.h{background:var(--clay)}
.seats b{margin-left:6px;color:var(--clay);font-size:14px}
.seats b.ok{color:var(--field)}
.seats small{margin-left:8px;color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 18px}
.chips span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--muted)}
section.blk{margin-top:30px;scroll-margin-top:80px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.person .role{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--clay)}
.person h3{margin:0;font-size:19px}
.person ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.person li{margin:2px 0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--field-soft);color:var(--field);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px}
.person .hd{display:flex;gap:12px;align-items:center}
.days{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.day{display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day > div:first-child{padding:10px 12px;background:var(--paper);border-right:1px solid var(--line)}
.day > div:first-child b{font-family:var(--display);font-size:15px;display:block}
.day > div:first-child small{font-size:12px;color:var(--muted)}
.day ul{list-style:none;margin:0;padding:8px 12px;display:grid;gap:4px;font-size:14px}
.day li{display:grid;grid-template-columns:100px 1fr;gap:8px}
.day li time{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.day li.team{opacity:.8}
.day li.now{background:var(--clay-soft);margin:0 -8px;padding:3px 8px;border-radius:6px}
@media (max-width:560px){.day{grid-template-columns:1fr}.day > div:first-child{border-right:0;border-bottom:1px solid var(--line)}.day li{grid-template-columns:86px 1fr}}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:0 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.tag.training{background:var(--clay-soft);color:var(--clay)}
.tag.transfer{background:var(--field-soft);color:var(--field)}
.tag.meal{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tag.activity{background:var(--field);color:var(--on-accent)}
.tag.team{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.tag.free{background:transparent;color:var(--field);border:1px solid var(--field)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.check{list-style:none;padding:0;margin:0;display:grid;gap:5px;font-size:14px}
.check li::before{content:"✓";color:var(--field);font-weight:700;margin-right:8px}
.check.no li::before{content:"–";color:var(--muted)}
.note{background:var(--clay-soft);border-radius:8px;padding:10px 14px;font-size:14px;margin:12px 0}
.note b{color:var(--clay)}
details{border-top:1px solid var(--line);padding:10px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0;color:var(--muted)}
/* Q&A */
.qa{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.ask{display:grid;gap:8px}
.ask textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
.ask-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ask-row .hint{font-size:12.5px;color:var(--muted);flex:1 1 200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.qitem{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px;font-size:14px}
.qitem .who{font-size:12.5px;font-weight:600}
.qitem .who span{font-weight:400;color:var(--muted)}
.qitem .ans{margin-left:14px;padding-left:12px;border-left:2px solid var(--field)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.pill.ok{background:var(--field-soft);color:var(--field)}
.pill.warn{background:var(--clay-soft);color:var(--clay)}
.pill.info{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.flash{background:var(--field-soft);color:var(--field);border-radius:8px;padding:8px 12px;font-size:13.5px}
/* buy box */
.buy{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;box-shadow:0 8px 24px rgba(22,33,28,.07)}
@media (max-width:900px){.buy{position:static}}
.price{display:flex;align-items:baseline;gap:6px}
.price b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:6px;font-size:13.5px}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts label span:last-child{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.opts input{accent-color:var(--clay)}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.total b{font-variant-numeric:tabular-nums}
.held{background:var(--clay-soft);border-radius:8px;padding:8px 10px;font-size:13.5px}
.held b{font-family:var(--mono);color:var(--clay)}
/* group & dashboard */
.ghead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:18px}
.lock{font-size:12.5px;background:var(--clay-soft);color:var(--clay);padding:3px 10px;border-radius:999px;font-weight:600}
.grid3{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid3{grid-template-columns:1fr}}
.now{background:var(--surface);border:2px solid var(--clay);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.now .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--clay)}
.now .item{font-size:16px;font-weight:600}
.now .next{font-size:14px;color:var(--muted)}
.chat{display:grid;gap:8px}
.msg{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:14px;max-width:92%}
.msg.mine{justify-self:end;background:var(--field-soft)}
.msg .who{font-size:12px;font-weight:600}
.msg .tr{font-size:12px;color:var(--field);margin-top:2px}
.ann{border-left:3px solid var(--clay);padding:4px 0 4px 12px;font-size:14px;margin-bottom:10px}
.ann small{display:block;color:var(--muted);font-size:12px}
.tabs-in{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs-in span{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tabs-in span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.docs{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14px}
.docs li{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.docs li > .pill{flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.kpis small{color:var(--muted);font-size:12.5px}
.kpis b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpis span{font-size:12.5px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-family:var(--display);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--paper)}

.todo .pill{margin:0 8px 0 0}
footer{margin-top:48px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}

/* Remaining places: dots (taken / held / free) + label ("3 of 8 places left", "Only 1 place left",
   "Fully booked") + confirmation line ("N more shooters needed" until min is reached).
   Production: places = max_participants − confirmed bookings − active holds, pushed live after each payment/cancel. */
function seatsHTML(t, extraHeld){
  const taken = t.booked + (extraHeld?1:0);
  const left = t.places - taken;
  let dots = "";
  for(let i=0;i<t.places;i++){ dots += `<i class="${i<t.booked?'t':(i<taken?'h':'')}"></i>`; }
  const label = left<=0 ? "Fully booked" : (left<=2 ? `Only ${left} place${left>1?'s':''} left` : `${left} of ${t.places} places left`);
  const need = t.booked < t.min ? `<small>${t.min - t.booked} more shooter${t.min-t.booked>1?'s':''} needed to confirm</small>` : `<small>Tour confirmed · booking closes ${t.closes}</small>`;
  return `<div class="seats" aria-label="${label}">${dots}<b class="${left>2?'ok':''}">${label}</b>${need}</div>`;
}
/* Day-by-day program. mode "public": exact times are replaced by Morning/Afternoon/Evening and
   team-only items are hidden (visibility levels from the spec); mode "group": full times + team items +
   "now" highlight. Production: the server filters items by the viewer's role before sending them. */
function programHTML(t, mode){
  return `<div class="days">${t.program.map((d,di)=>`<div class="day"><div><b>${d.d}</b><small>${d.s}</small></div><ul>${
    d.items.filter(it=> mode==="public" ? it[1]!=="team" : true).map((it,ii)=>{
      const isNow = mode==="group" && ((t===TOURS.t1 && di===1 && ii===1) || (t===TOURS.t2 && di===1 && ii===0));
      const time = mode==="public" ? it[0].split("–")[0].replace(/\d\d:\d\d/, m=> m.slice(0,2)<"12"?"Morning":(m.slice(0,2)<"17"?"Afternoon":"Evening")) : it[0];
      const label = it[1]==="team" ? "team only" : it[1];
      return `<li class="${it[1]==='team'?'team':''} ${isNow?'now':''}"><time>${time}</time><span><span class="tag ${it[1]}">${label}</span>${it[2]}</span></li>`;
    }).join("")}</ul></div>`).join("")}</div>`;
}

  const total = t.price + optTotal;
  const left = t.places - t.booked;
  const held = state.held && state.held.tour===state.tour;
  let remain = "";
  if(held){ const s = Math.max(0, Math.round((state.held.until - Date.now())/1000)); remain = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }

    ? `<div class="ph media ${i===0?'big':''}"><video controls preload="none" playsinline poster="${g.poster}"><source src="${g.src}" type="video/mp4"></video><span class="cap">▶ ${g.cap}</span></div>`
    : g.type==="img"
    ? `<div class="ph media ${i===0?'big':''} ${i===4?'extra':''} ${g.fit==='contain'?'contain':''}"><img src="${g.src}" alt="${g.cap}" loading="lazy" onerror="this.remove()"><span class="cap">${g.cap}</span></div>`
    : g.type==="jump"
    ? `<a class="ph todo insta ${i===4?'extra':''}" href="#videos" data-jump="videos"><span class="cap">${g.cap}</span></a>`
    : `<div class="ph todo ${i===4?'extra':''}"><span class="cap">${g.cap}</span></div>`).join("");
  return `
  <div class="gallery" aria-label="Photo and video gallery">${ph}</div>
  <p class="mcredit"><span lang="uk">Фото й відео: ClayArena</span> · photos and videos from clayarena.com</p>
  <div class="page">
    <div>
      <div class="eyebrow">ClayAway tour · ${t.where} · ${t.disciplines}</div>
      <h1>${t.title}</h1>
      <div class="facts"><span>${t.dates}</span><span><b>${t.days}</b> days</span><span><b>${t.places}</b> shooters max</span><span>${t.targets}</span><span>Focus: <b>${t.focus}</b></span></div>
      ${seatsHTML(t, held)}
      <div class="langbar">Tour languages
        <div class="seg" role="group" aria-label="Tour language">${t.langs.map(l=>`<button data-lang="${l}" lang="${l}" title="${LANG_NAME[l]}" aria-pressed="${state.lang===l}">${LANG_LABEL[l]}</button>`).join("")}</div>
      </div>
      <nav class="chips" id="tabs" aria-label="Sections of this tour">${navItems(t).map(([label,id])=>`<a href="#${id}" data-jump="${id}">${label}</a>`).join("")}</nav>

      <section class="blk" id="about"><h2>About this tour</h2><p lang="${t.about[state.lang]?state.lang:"en"}">${t.about[state.lang]||t.about.en}</p>
        ${state.lang!=="en"?`<p class="small muted">Shown in ${LANG_NAME[state.lang]}. Other blocks have their own ${LANG_NAME[state.lang]} version, written or checked by the organizer.</p>`:""}</section>

      <section class="blk" id="glance"><h2>The tour at a glance</h2>
        <div class="glance">${GLANCE[state.tour].map(c=>`<article class="gl"><div class="gl-img">${mediaHTML(c.img, c.img.cap||c.t)}${c.img2&&c.img2.src?mediaHTML(c.img2, c.img2.cap, "second"):""}</div><div class="gl-body"><span class="gl-k">${c.k}</span><h3>${c.t}</h3><p>${c.d}</p><span class="gl-m">${c.m}</span></div></article>`).join("")}</div></section>

      <section class="blk" id="meals"><h2>Breakfast, lunch and dinner</h2>
        <p class="small muted">What is included, where, and what you eat. Built around the training day.</p>
        <div class="mphotos">${MEALPHOTOS[state.tour].map(p=>`<figure>${mediaHTML(p, p.cap)}<figcaption>${p.cap}</figcaption></figure>`).join("")}</div>
        <div class="msum">${MEALS[state.tour].summary.map(x=>`<span>${x}</span>`).join("")}</div>
        <div class="tbl"><table class="meals"><thead><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead><tbody>${MEALS[state.tour].rows.map(r=>`<tr><td class="md">${r.d}</td>${["b","l","dn"].map(k=>{const m=r[k]; if(!m) return `<td class="mna">—</td>`; return `<td class="${m.inc?'minc':'mown'}"><span class="mst">${m.inc?(m.tog?'Included · together':'Included'):'Not included'}</span><b>${m.where}</b>${m.what?`<span>${m.what}</span>`:""}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>
        <ul class="mnotes">${MEALS[state.tour].notes.map(n=>`<li>${n}</li>`).join("")}</ul>
      </section>

      <section class="blk" id="people"><h2>Who runs it</h2><div class="people">${t.people.map((p,pi)=>`<div class="person" id="person-${pi}"><div class="hd">${MEDIA[state.tour].photos[p.name]?`<img class="avatar" src="${MEDIA[state.tour].photos[p.name]}" alt="" onerror="this.outerHTML='<div class=avatar>${p.init}</div>'">`:`<div class="avatar">${p.init}</div>`}<div><div class="role">${p.role}</div><h3>${p.name}</h3></div></div><ul>${p.lines.map(l=>`<li>${l}</li>`).join("")}</ul><a href="${p.url}" class="small">Profile on ClayArena ↗</a></div>`).join("")}</div>
        <div class="note" id="guests">${t.groundNote}</div></section>

      <section class="blk" id="program"><h2>Program</h2><p class="small muted">Overview. Exact times and meeting points open in the group space after booking. Times in ${t.tz}.</p>${programHTML(t,"public")}</section>

      <section class="blk" id="videos"><h2>Videos</h2><p class="small muted">From ClayArena: competition videos from this ground. The organizer can add their own videos.</p>
        <div class="vids">${MEDIA[state.tour].videos.map(v=>`<figure><video controls preload="none" playsinline poster="${v.poster}"><source src="${v.src}" type="video/mp4"></video><figcaption>${v.cap} · <a href="${v.page}">on ClayArena ↗</a></figcaption></figure>`).join("")}</div>${(ig=>ig?`<p class="iglink">▶ <a href="${ig.url}" target="_blank" rel="nofollow noopener noreferrer">${ig.cap} · ClayArena on Instagram ↗</a><br><span class="small muted">Opens instagram.com in a new tab. The post is not embedded here, so Meta sets no cookies on this page.</span></p>`:"")(MEDIA[state.tour].ig)}</section>

      <section class="blk" id="included"><h2>What's included</h2><div class="cols2"><div class="box"><h3>Included</h3><ul class="check">${t.included.map(i=>`<li>${i}</li>`).join("")}</ul></div><div class="box"><h3>Not included</h3><ul class="check no">${t.excluded.map(i=>`<li>${i}</li>`).join("")}</ul></div></div></section>

      <section class="blk" id="cancel"><h2>Cancellation</h2><p>${t.cancel}</p></section>

      <section class="blk" id="faq"><h2>FAQ</h2>${t.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}</section>

      <section class="blk" id="qa"><h2>Questions about this tour <span class="pill info">sample messages</span></h2>
        <div class="qa">
          <form class="ask" id="askForm">
            <label for="qtext" class="small muted">Ask ${t.organizer} and the team. Any language is fine.</label>
            <textarea id="qtext" placeholder="Type your question…"></textarea>
            <div class="ask-row">
              <div class="seg" role="group" aria-label="Who sees it"><button type="button" data-mode="public" aria-pressed="${state.mode==='public'}">Public</button><button type="button" data-mode="private" aria-pressed="${state.mode==='private'}">Private</button></div>
              <span class="hint">${state.mode==='public'?'Everyone sees the question and the answer.':'Only you and the organizer see it. The reply comes to your ClayArena messages.'}</span>
              <button class="btn primary" type="submit">Send</button>
            </div>
            ${state.flash?`<div class="flash">${state.flash}</div>`:""}
          </form>
          ${extra.map(q=>`<div class="qitem"><div class="who">You <span>· just now</span><span class="pill info">Waiting for an answer</span></div><div>${q}</div></div>`).join("")}
          ${t.qa.map(q=>`<div class="qitem"><div class="who">${q.who} <span>· ${q.from}</span></div><div>${q.q}${q.tq?`<div class="small muted">${q.tq}</div>`:""}</div>
            <div class="ans"><div class="who">${q.by}<span class="pill ok">${q.byRole}</span></div><div>${q.a}${q.ta?`<div class="small muted">${q.ta}</div>`:""}${q.tr?`<div class="small muted">${q.tr}</div>`:""}</div></div></div>`).join("")}
        </div>
      </section>
    </div>

    <aside class="buy" id="buy" aria-label="Booking">
      <div class="price"><span class="muted small">from</span><b>${t.currency}${fmt(t.price)}</b><span class="muted small">per shooter</span></div>
      ${seatsHTML(t, held)}
      <div class="opts">${t.options.map(o=>`<label><input type="checkbox" data-opt="${o[0]}" ${state.opts[o[0]]?'checked':''}><span>${o[1]}</span><span>+${t.currency}${fmt(o[2])}</span></label>`).join("")}</div>
      <div class="total"><span>Total</span><b>${t.currency}${fmt(total)}</b></div>
      <div class="total" style="border:0;padding:0"><span class="muted">Deposit today (${t.deposit}%)</span><b>${t.currency}${fmt(Math.round(total*t.deposit/100))}</b></div>
      ${held?`<div class="held">Place held for you: <b>${remain}</b>. Continue to payment to keep it.</div><button class="btn primary full" data-act="pay">Continue to payment</button><button class="btn full" data-act="release">Release the place</button>`
        : left>0 ? `<button class="btn primary full" data-act="book">Book a place</button>` : `<button class="btn primary full">Join the waitlist</button>`}
      <button class="btn full" data-act="private">Message ${t.organizer} privately</button>
      <p class="small muted" style="margin:0">Secure payment via ClayArena. Places update live.</p>
    </aside>
  </div>`;
}
/* CLOSED GROUP SPACE (only confirmed paid bookings + tour team): "Now & next", full program,
   announcements (organizer/coach only), group chat with "Translated" lines, my documents, participants.
   Production: built on ClayArena messaging; access checked on the server for every request. */
function groupView(t){
  return `
  <div class="ghead"><div><div class="eyebrow">ClayAway · Group space · ${t.dates}</div><h1>${t.title}</h1></div><span class="lock">Only for confirmed bookings</span></div>
  <div class="tabs-in"><span class="on">Today</span><span>Program</span><span>Announcements</span><span>Group chat</span><span>Participants</span><span>Travel</span><span>Documents</span><span>Checklist</span><span>Photos</span><span>My training</span></div>
  <div class="grid3">
    <div style="display:grid;gap:16px">
      <div class="now"><div class="lbl">Now · ${t.now.day}</div><div class="item">${t.now.item}</div><div class="small">${t.now.where}</div><div class="next">Next: ${t.now.next}</div><div><button class="btn">Directions</button></div></div>
      <div><h2>Program</h2><p class="small muted">Full times and meeting points. Times in ${t.tz}. Dashed items are visible to the team only.</p>${programHTML(t,"group")}</div>
    </div>
    <div style="display:grid;gap:16px">
      <div class="box"><h3>Announcements</h3>${t.announcements.map(a=>`<div class="ann"><small>${a[0]}</small>${a[1]}${a[2]?`<div class="small muted">${a[2]}</div>`:""}</div>`).join("")}</div>
      <div class="box"><h3>Group chat</h3><div class="chat">${t.chat.map(m=>`<div class="msg ${m[3]?'mine':''}"><div class="who">${m[0]}</div>${m[1]}${m[2]?`<div class="tr">${m[2]}</div>`:""}</div>`).join("")}</div></div>
      <div class="box"><h3>My documents</h3><ul class="docs">${t.docs.map(d=>`<li><span>${d[0]}</span><span class="pill ${d[2]}">${d[1]}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>Participants</h3><p class="small muted" style="margin:0 0 6px">${t.participants.length} shooters${t.guests?` + ${t.guests} guests`:""}</p><ul class="docs">${t.participants.map(p=>`<li><span>${p[0]}</span><span class="muted small">${p[1]}</span></li>`).join("")}</ul></div>
    </div>
  </div>`;
}
/* ORGANIZER DASHBOARD: KPIs (places, paid, ClayArena fee, payout, booking deadline), needs attention,
   bookings, questions inbox (public + private), team, tour page status. Fee here is a sample 10%;
   in production the % comes from admin settings (global / per organizer / per tour). */
function dashView(t){
  const paid = t.participants.reduce((s,p)=>s+p[4],0);
  const fee = Math.round(paid*0.10);
  return `
  <div class="ghead"><div><div class="eyebrow">ClayAway · Organizer dashboard · ${t.organizer}</div><h1>${t.title}</h1></div><span class="pill ${t.booked>=t.min?'ok':'warn'}" style="font-size:12.5px;padding:4px 12px">${t.booked>=t.min?'Published · Confirmed':'Published · Waiting for minimum'}</span></div>
  <div class="kpis">
    <div><small>Places</small><b>${t.booked} / ${t.places}</b><span>minimum ${t.min}${t.guestsMax?` · guests ${t.guests}/${t.guestsMax}`:""}</span></div>
    <div><small>Paid so far</small><b>${t.currency}${fmt(paid)}</b><span>${(n=>n+' deposit'+(n===1?'':'s')+' open')(t.participants.filter(p=>p[3]==='warn').length)}</span></div>
    <div><small>ClayArena fee 10%</small><b>${t.currency}${fmt(fee)}</b><span>sample rate</span></div>
    <div><small>Your payout so far</small><b>${t.currency}${fmt(paid-fee)}</b><span>paid out after the tour starts</span></div>
    <div><small>Booking closes</small><b>${t.closes.split(" ").slice(0,2).join(" ")}</b><span>${t.closes.split(" ")[2]}</span></div>
  </div>
  <div class="grid3">
    <div style="display:grid;gap:16px">
      <div class="box"><h3>Needs attention</h3><ul class="todo">${t.todo.map(x=>`<li><span class="pill ${x[0]}">${x[1]}</span>${x[2]}</li>`).join("")}</ul></div>
      <div><h3>Bookings</h3><div class="tbl"><table><thead><tr><th>Shooter</th><th>From</th><th>Status</th><th style="text-align:right">Paid</th></tr></thead><tbody>${t.participants.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td><span class="pill ${p[3]}">${p[2]}</span></td><td class="num">${t.currency}${fmt(p[4])}</td></tr>`).join("")}</tbody></table></div></div>
    </div>
    <div style="display:grid;gap:16px">
      <div class="box"><h3>Questions</h3><p class="small muted" style="margin:0 0 6px">Public and private questions in one inbox</p><ul class="docs">${t.inbox.map(q=>`<li><span><span class="pill ${q[0]==='Private'?'warn':'info'}" style="margin:0 6px 0 0">${q[0]}</span>${q[2]}<br><span class="small muted">${q[1]}</span></span><span class="pill ${q[3]==='New'?'warn':'ok'}">${q[3]}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>Team</h3><ul class="docs">${t.people.filter(p=>p.role!=="Shooting ground").map(p=>`<li><span>${p.name}</span><span class="small muted">${p.role}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>Tour page</h3><ul class="docs"><li><span>Languages</span><span class="small">${t.langs.map(l=>LANG_LABEL[l]).join(" · ")}</span></li><li><span>Photos and videos</span><span class="small">${t.gallery.length + 14}</span></li><li><span>Last change</span><span class="small muted">Program, 2 days ago</span></li></ul></div>
    </div>
  </div>`;
}

/* Section tabs under the title: [label, element id]. Coach/Organizer/Shooting ground point to the
   person cards (#person-0..2), Prices to the booking box (#buy). Keep in the same order as the page. */
function navItems(t){
  const items=[["About","about"],["At a glance","glance"],["Meals","meals"],["Coach","person-0"],["Organizer","person-1"],["Shooting ground","person-2"]];
  if(t.chips.includes("For guests")) items.push(["For guests","guests"]);
  items.push(["Program","program"],["Videos","videos"],["What's included","included"],["Prices","buy"],["Cancellation","cancel"],["FAQ","faq"],["Questions","qa"]);
  return items;
}
let tabObserver=null;
function setActiveTab(id){
  document.querySelectorAll("#tabs a").forEach(a=>{ const on=a.dataset.jump===id; a.classList.toggle("on",on); if(on) a.setAttribute("aria-current","true"); else a.removeAttribute("aria-current"); });
  const act=document.querySelector("#tabs a.on"); const bar=document.getElementById("tabs");
  if(act&&bar&&bar.scrollWidth>bar.clientWidth){ bar.scrollTo({left:act.offsetLeft-bar.clientWidth/2+act.offsetWidth/2,behavior:"smooth"}); }
}
function initTabs(){
  if(tabObserver){ tabObserver.disconnect(); tabObserver=null; }
  const bar=document.getElementById("tabs"); if(!bar) return;
  const ids=[...new Set([...bar.querySelectorAll("a")].map(a=>a.dataset.jump))].filter(id=>id!=="buy");
  const els=ids.map(id=>document.getElementById(id)).filter(Boolean);
  const visible=new Map();
  tabObserver=new IntersectionObserver(entries=>{
    entries.forEach(e=>visible.set(e.target.id,e.isIntersecting?e.boundingClientRect.top:null));
    let best=null,bt=Infinity; visible.forEach((top,id)=>{ if(top!==null && Math.abs(top-140)<bt){bt=Math.abs(top-140);best=id;} });
    if(best) setActiveTab(best);
  },{rootMargin:"-130px 0px -55% 0px",threshold:0});
  els.forEach(el=>tabObserver.observe(el));
}
document.addEventListener("click",e=>{
  const a=e.target.closest("a[data-jump]"); if(!a) return;
  e.preventDefault(); const el=document.getElementById(a.dataset.jump); if(!el) return;
  const y=el.getBoundingClientRect().top+window.scrollY-130;
  window.scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  setActiveTab(a.dataset.jump);
  el.classList.remove("flashme"); void el.offsetWidth; el.classList.add("flashme");
});
/* Media credits: every picture and video on the page comes from ClayArena (profile photos, competition videos and
   posters on clayarena.com); tiles with an icon are placeholders. In production each media item keeps its source. */
function creditsHTML(){
  const M = MEDIA[state.tour], seen = new Set(), items = [];
  const add = m => { if(m && m.page && !seen.has(m.page)){ seen.add(m.page); items.push(`<a href="${m.page}">${m.cap}</a>`); } };
  M.gallery.forEach(add); M.videos.forEach(add); GLANCE[state.tour].forEach(c=>{ add(c.img); add(c.img2); }); MEALPHOTOS[state.tour].forEach(add);
  return `<div class="credits"><b lang="uk">Фото й відео: ClayArena.</b> Photos and videos from ClayArena (clayarena.com): ${items.join(" · ")}. Profile photos come from the people's ClayArena profiles. Tiles with an icon are placeholders for the organizer's own photos.</div>`;
}
/* Sample label: shown on every screen (owner decision 06.10.2026), also in og/twitter description (make_og.py). */
const SAMPLE = `<div class="sample" role="note"><b lang="uk">Приклад: дати, ціни й повідомлення умовні.</b><span>Sample tour page: dates, prices, places and messages are made up. Not a real offer: the people named here have not announced this tour.</span></div>`;
/* Re-renders the whole screen from `state` (simple and fine for a demo; in ClayArena use the site's
   front-end framework and components). Keeps the question draft and re-inits the tab observer. */
function render(){
  const t = TOURS[state.tour];
  if(!t.langs.includes(state.lang)) state.lang = "en";
  document.querySelectorAll("[data-tour]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tour===state.tour));
  document.querySelectorAll(".sub [data-view]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===state.view));
  const app = document.getElementById("app");
  const q = document.getElementById("qtext"); const draft = q ? q.value : "";
  app.innerHTML = SAMPLE + (state.view==="page"?pageView(t):state.view==="group"?groupView(t):dashView(t))
    + (state.view==="page"?creditsHTML():"") + `<footer>ClayAway project (to be integrated into ClayArena). Parcours de Chasse – Sporting™ and Compak® Sporting are trademarks of FITASC. Coach, organizer and ground facts come from their ClayArena profiles; roles in the tour, dates, prices, participants and messages are sample data. <span lang="uk">Фото й відео: ClayArena.</span></footer>`;
  const q2 = document.getElementById("qtext"); if(q2 && draft) q2.value = draft;
  if(state.view==="page") initTabs();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.tour){ state.tour=b.dataset.tour; state.opts={}; state.flash=""; try{history.replaceState(null,"","#"+state.tour)}catch(_){}; render(); window.scrollTo({top:0}); }
  else if(b.dataset.view){ if(b.dataset.view!==state.view){ state.view=b.dataset.view; try{history.pushState(null,"","#"+VIEW_HASH[state.view])}catch(_){} } render(); window.scrollTo({top:0}); }
  else if(b.dataset.lang){ state.lang=b.dataset.lang; render(); }
  else if(b.dataset.mode){ state.mode=b.dataset.mode; render(); }
  else if(b.dataset.act==="book"){ state.held={tour:state.tour, until:Date.now()+15*60*1000}; clearInterval(timer); timer=setInterval(()=>{ if(!state.held||Date.now()>state.held.until){state.held=null;clearInterval(timer);} if(state.view==="page") render(); },1000); render(); }
  else if(b.dataset.act==="release"){ state.held=null; clearInterval(timer); render(); }
  else if(b.dataset.act==="pay"){ state.flash=""; b.textContent="Payment step is not part of this project demo"; b.disabled=true; }
  else if(b.dataset.act==="private"){ state.mode="private"; render(); document.getElementById("qa").scrollIntoView(); document.getElementById("qtext").focus(); }
});
document.addEventListener("change", e=>{ if(e.target.dataset.opt){ state.opts[e.target.dataset.opt]=e.target.checked; render(); } });
document.addEventListener("submit", e=>{
  if(e.target.id!=="askForm") return; e.preventDefault();
  const v = document.getElementById("qtext").value.trim(); const t = TOURS[state.tour];
  if(!v){ state.flash="Type a question first."; render(); return; }
  if(state.mode==="public"){ state.extraQ[state.tour].unshift(v.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))); state.flash=`Posted publicly. ${t.organizer} gets a notification and the answer will appear here.`; }
  else { state.flash=`Sent privately to ${t.organizer}. The reply will come to your ClayArena messages.`; }
  document.getElementById("qtext").value=""; render();
});
render();
</script>
</body>
</html>
