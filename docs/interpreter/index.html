<!--
  Old address of the ClayArena Interpreter Academy (single-page app). PROJECT note for the team:
  the course is now the "Перекладач / Interpreter" route of the one Академія ClayArena (/learn/, /<lang>/learn/), and this page
  is a permanent forwarder for old links and bookmarks (keep it at least 12 months; better for ever, it is tiny):
    ?lang=<l>          language of the target page (else the old course language on this device, else the browser, else en)
    #l/<lesson id>     → /<p>learn/<new lesson id>/  (+ #<old id> when the lesson was merged into another one)
    #m/<mission id>    → /<p>learn/topics/<block>/#<section>
    #g/<game id>       → /<p>learn/practice/<game>/ (the final exam → the route's certificate block)
    anything else      → /<p>learn/routes/interpreter/
  <p> = "" for uk, "<lang>/" for the other 10 languages; never to another language. The map is docs/learn/data/id-map.json
  (copy of content/academy/id-map.json; the build keeps it in sync). Without JavaScript: meta refresh to the English route page.
  Progress of the old course (localStorage "clayarena-interpreter") is moved by the Academy itself on its first visit.
  Production (clayarena.com): real 301 from redirects.json for paths; this hash router stays, hashes never reach the server.
-->
<noscript><meta http-equiv="refresh" content="0; url=../en/learn/routes/interpreter/"></noscript>
<script>
(function () {
  "use strict";
  var LANGS = ["en", "uk", "de", "fr", "it", "cs", "pl", "pt", "hu", "fi", "lt"];
  var page = location.href.split(/[?#]/)[0], SITE = page.replace(/interpreter\/(index\.html)?$/, "");
  function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function academyLang() { try { var s = JSON.parse(stored("clayarena-academy") || "null"); return s && s.lang; } catch (e) { return null; } }
  var q = null; try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  var nav = (navigator.language || "").slice(0, 2).toLowerCase(); if (nav === "cz") nav = "cs";
  var lang = [q, stored("clayarena-interpreter-lang"), academyLang(), nav, "en"].filter(function (l) { return LANGS.indexOf(l) >= 0; })[0];
  var base = SITE + (lang === "uk" ? "" : lang + "/") + "learn/", done = false;
  /* "topics/targets#flight" → "topics/targets/#flight"; "practice/lead-lab" → "practice/lead-lab/" */
  function slash(p) { var i = p.indexOf("#"), a = i < 0 ? p : p.slice(0, i), h = i < 0 ? "" : p.slice(i); return a.replace(/\/?$/, "/") + h; }
  function go(path) { if (done) return; done = true; location.replace(base + slash(path || "routes/interpreter")); }
  var m = /^#([lmg])\/([a-z0-9-]+)$/.exec(location.hash);
  if (!m) { go("routes/interpreter"); return; }
  setTimeout(function () { go("routes/interpreter"); }, 4000); // the map did not arrive: the route page is always a good place
  fetch(SITE + "learn/data/id-map.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (map) {
    var id = m[2], p = null;
    if (map && m[1] === "l" && map.interpreter && map.interpreter[id]) { var x = map.interpreter[id]; p = x.to + "/" + (x.anchor ? "#" + x.anchor : ""); }
    if (map && m[1] === "m" && map.missions && map.missions[id]) p = map.missions[id];
    if (map && m[1] === "g" && map.games && map.games[id]) p = map.games[id];
    go(p);
  }).catch(function () { go(null); });
})();
</script>
