<!--
  ClayArena Interpreter Academy — PROJECT (to be moved into ClayArena by the team).
  What it is: a gamified course for interpreters with no shooting background (ClayAway tours, competitions).
  Data (generated by scripts/build_interpreter.py from docs/interpreter/src/):
    data/<lang>.js  -> window.IA = {lang, ui, missions:[{id, icon, title, intro, lessons:[...]}]}   one file per ClayArena language
    data/terms.js   -> window.IA_TERMS = {langs, terms:[{id, en, aka, group, def:{lang}, tr:{lang:{term, alt, note, conf}}, page:{lang:url}}]}
                     built from the ONE ClayArena glossary (docs/glossary/data) — the course keeps no copy of the terms
  In production: content lives in the ClayArena CMS per language; progress/XP/certificate move to the user's ClayArena profile
  (server-side), the exam is graded on the server, the certificate gets a verifiable ID. Here progress is localStorage only.
  Languages: only ClayArena site languages (en, uk, de, fr, it, cs, pl, pt, hu, fi, lt). The app name is in one place: APP_NAME / ui.app_title.
-->
<style>
:root{
  color-scheme:dark;
  --bg:#030712; --surface:rgba(255,255,255,.04); --surface2:#0B1120; --line:rgba(255,255,255,.1);
  --ink:#F3F4F6; --soft:#D1D5DB; --muted:#9CA3AF;
  --em:#34D399; --em-soft:rgba(16,185,129,.15); --primary:#059669; --cyan:#22D3EE;
  --clay:#FB923C; --clay-soft:rgba(251,146,60,.14); --red:#F87171; --red-soft:rgba(248,113,113,.14);
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--body)}
a{color:var(--em)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:rgba(3,7,18,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.logo{display:inline-block;background:#000;border-radius:8px;padding:2px 11px;font-weight:700;font-size:17px;box-shadow:0 0 16px rgba(52,211,153,.25);text-decoration:none}
.logo b{background:linear-gradient(90deg,#34D399,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.svc{font-weight:700;background:none;border:0;padding:0;text-align:left}.svc small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.spacer{flex:1}
.xpbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.xpbox .bar{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.xpbox .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--cyan))}
select{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13.5px}
main{max-width:1040px;margin:0 auto;padding:22px 16px 80px;min-width:0}
main>*{min-width:0}
h1,h2,h3{letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:6px 0 10px}
h2{font-size:21px;margin:26px 0 10px}
h3{font-size:17px;margin:0 0 4px}
p{margin:0 0 12px;max-width:70ch}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--em)}
.hero{padding:24px;border-radius:16px;background:radial-gradient(120% 140% at 0% 0%,rgba(6,78,59,.55),transparent 60%),var(--surface2);border:1px solid var(--line);margin-bottom:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero p{color:var(--soft);font-size:17px}
.hero svg{width:150px;height:150px}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero svg{display:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start;transition:border-color .15s,transform .15s}
.card:hover{border-color:rgba(52,211,153,.5);transform:translateY(-1px)}
.card .n{font-size:12.5px;font-weight:700;color:var(--clay)}
.card p{font-size:14px;color:var(--soft);margin:0}
.card .ic{font-size:26px;line-height:1}
.pb{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.pb i{display:block;height:100%;background:var(--em)}
.meta{font-size:12px;color:var(--muted)}
.card.game{background:linear-gradient(160deg,rgba(251,146,60,.10),transparent 60%),var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;text-decoration:none;color:var(--ink);font-size:14.5px}
.btn:hover{border-color:rgba(52,211,153,.5)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lesson-list{display:grid;gap:8px}
.li{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.li:hover{border-color:rgba(52,211,153,.5)}
.li .ok{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.li.done .ok{background:var(--em);border-color:var(--em);color:#022c22;font-weight:700}
article{max-width:760px}
.kp{background:var(--em-soft);border:1px solid rgba(52,211,153,.35);border-radius:12px;padding:12px 16px;margin:16px 0}
.kp ul{margin:6px 0 0;padding-left:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13.5px}
.chip:hover{border-color:var(--clay);color:var(--clay)}
.say{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--surface2)}
.say .en{font-weight:600;font-size:16.5px}
.say .en::before{content:"“";color:var(--clay)}.say .en::after{content:"”";color:var(--clay)}
.say .hid{display:none;margin-top:8px;color:var(--soft);font-size:14.5px}
.say.open .hid{display:block}
.say .tag{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:var(--surface)}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px}
.opt:hover:not([disabled]){border-color:rgba(52,211,153,.5)}
.opt.right{border-color:var(--em);background:var(--em-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.why{margin-top:8px;font-size:14px;color:var(--soft)}
.sim{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#06101d;margin:16px 0}
.sim canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.sim .ctl{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px}
.sim .ctl label{display:flex;gap:6px;align-items:center;color:var(--soft)}
.sim .ctl input[type=range]{width:110px;accent-color:var(--em)}
.sim .out{padding:0 12px 12px;font-size:14px;color:var(--soft)}
.sim .out b.hit{color:var(--em)}.sim .out b.miss{color:var(--clay)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.modal .box{background:var(--surface2);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.score{font-size:40px;font-weight:800;color:var(--em)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer div{max-width:1040px;margin:0 auto;padding:16px}
.cert{background:#fff;color:#0b1120;border-radius:12px;padding:28px;text-align:center;border:6px double #059669}
.cert h2{margin:6px 0;font-size:30px}.cert .nm{font-size:26px;font-weight:800;margin:10px 0}
@media print{.top,footer,.noprint{display:none!important}body{background:#fff}.cert{border-color:#059669}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <!-- no own ClayArena logo here: the project bar (docs/shared/nav.js) shows the one ClayArena mark of the page -->
  <button class="svc" id="svc" onclick="go('#')"><span id="appTitle">Interpreter Academy</span><small id="tagline"></small></button>
  <span class="spacer"></span>
  <div class="xpbox" id="xpbox"></div>
  <select id="lang" aria-label="Language"></select>
</div></header>
<main id="app"><noscript><h1>ClayArena Interpreter Academy</h1><p>Clay shooting for interpreters — from zero: terminology, target flights, lead and shooting technique, FITASC rules of Parcours de Chasse – Sporting™ and Compak® Sporting, referee calls and etiquette. JavaScript is required for the interactive course.</p></noscript></main>
<footer><div id="foot"></div></footer>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script src="data/terms.js"></script>
<script src="../shared/sims.js"></script>
<script src="../rules/data/quiz-sporting.js"></script>
<script src="../rules/data/quiz-compak.js"></script>
<script>
/* ===== Config ===== */
const APP_NAME = "ClayArena Interpreter Academy"; // display name comes from ui.app_title per language
const LANGS = ["en","uk","de","fr","it","cs","pl","pt","hu","fi","lt"];
const LANG_NAMES = {en:"English",uk:"Українська",de:"Deutsch",fr:"Français",it:"Italiano",cs:"Čeština",pl:"Polski",pt:"Português",hu:"Magyar",fi:"Suomi",lt:"Lietuvių"};
const NF = 'target="_blank" rel="nofollow noopener noreferrer"'; // all external links (FITASC must be nofollow)
const KEY = "clayarena-interpreter";
const XP = {lesson:30, quiz:10, game:5, exam:150};
const LEVELS = [0, 150, 600, 1400, 2600];
// Mission icons by mission id (data may carry a word in "icon"; the app shows these emoji).
const MICON = {sport:"🏆", gear:"🧰", targets:"🎯", flight:"〰️", basics:"🧍", lead:"📐", faults:"🔍", sporting:"🌲", compak:"🔄", referee:"📣", etiquette:"🛡️", interpreter:"🗣️"};
const icon = m => MICON[m.id] || "•";

/* ===== State (localStorage; in production -> ClayArena profile on the server) ===== */
let S = {xp:0, done:{}, quiz:{}, exam:null, name:""};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
const save = () => { try { if (IA) S.total = allLessons().length; localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }; // S.total: read by docs/shared/nav.js
const addXP = n => { S.xp += n; save(); renderXP(); toast(`+${n} XP`); };

let LANG = (() => { const q = new URLSearchParams(location.search).get("lang"); if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem(KEY + "-lang"); if (LANGS.includes(s)) return s; } catch(e) {}
  const n = (navigator.language || "en").slice(0,2).toLowerCase(); return LANGS.includes(n) ? n : (n === "cz" ? "cs" : "en"); })();
let IA = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const U = k => (IA && IA.ui[k]) ?? k;
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1300); }
function closeModal(){ $("modal").classList.remove("on"); }
function modal(html){ $("mbox").innerHTML = html; $("modal").classList.add("on"); }

/* Load one language file (data/<lang>.js); falls back to English if missing. */
function loadLang(l){
  return new Promise(res => { const s = document.createElement("script"); s.src = `data/${l}.js?v=1`;
    s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); });
}
async function setLang(l){
  window.IA = null; let ok = await loadLang(l); if (!ok || !window.IA) { l = "en"; await loadLang("en"); }
  IA = window.IA; LANG = l; document.documentElement.lang = l;
  try { localStorage.setItem(KEY + "-lang", l); } catch(e) {}
  $("lang").value = l; $("appTitle").textContent = U("app_title"); $("tagline").textContent = U("tagline");
  document.title = `${U("app_title")} — ${U("tagline")}`;
  $("foot").innerHTML = `${esc(U("disclaimer"))} <a href="../glossary/">ClayArena Glossary</a> · <a href="../learn/">ClayArena Academy</a>`;
  simConfig(); renderXP(); route();
}

/* ===== Helpers over data ===== */
const allLessons = () => IA.missions.flatMap(m => m.lessons.map(l => Object.assign(l, {_m: m})));
const lessonById = id => allLessons().find(l => l.id === id);
const TERMS = (window.IA_TERMS || {terms: []}).terms;
const termById = id => TERMS.find(t => t.id === id);
const termLocal = (t, l = LANG) => l === "en" ? t.en : (t.tr && t.tr[l] && t.tr[l].term) || t.en;
const level = () => { let i = 0; LEVELS.forEach((v, k) => { if (S.xp >= v) i = k; }); return i; };
function renderXP(){
  if (!IA) return; const i = level(), a = LEVELS[i], b = LEVELS[i + 1] || LEVELS[i] + 1000, pct = Math.min(100, (S.xp - a) / (b - a) * 100);
  $("xpbox").innerHTML = `<span>${esc(U("levels")[i])}</span><span class="bar"><i style="width:${pct}%"></i></span><span>${S.xp} ${esc(U("xp"))}</span>`;
}

/* ===== Router: #, #m/<mission>, #l/<lesson>, #g/<game> ===== */
function go(h){ location.hash = h; }
window.addEventListener("hashchange", route);
function route(){
  if (!IA) return; stopSims(); window.scrollTo(0, 0);
  const h = location.hash.slice(1), [k, id] = h.split("/");
  if (k === "m") return viewMission(id);
  if (k === "l") return viewLesson(id);
  if (k === "g") return viewGame(id);
  viewHome();
}

/* ===== Home ===== */
const ARENA_SVG = `<svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="74" fill="none" stroke="#34D399" stroke-opacity=".35" stroke-width="2"/><circle cx="80" cy="80" r="48" fill="none" stroke="#34D399" stroke-opacity=".25" stroke-width="2" stroke-dasharray="4 6"/><path d="M14 112 Q80 10 146 70" fill="none" stroke="#FB923C" stroke-width="2.5" stroke-dasharray="3 6"/><ellipse cx="118" cy="44" rx="13" ry="5" fill="#FB923C"/><circle cx="96" cy="52" r="4" fill="none" stroke="#22D3EE" stroke-width="2"/><path d="M96 46v12M90 52h12" stroke="#22D3EE" stroke-width="2"/></svg>`;
function viewHome(){
  const ms = IA.missions, total = allLessons().length, done = allLessons().filter(l => S.done[l.id]).length;
  const games = [["coach","🗣️"],["flight","🎯"],["lead","📐"],["call","🧑‍⚖️"],["terms","🃏"],["exam","🎓"]];
  $("app").innerHTML = `
  <section class="hero"><div><div class="eyebrow">ClayArena · FITASC Sporting™ · Compak® Sporting</div><h1>${esc(U("app_title"))}</h1><p>${esc(U("hero_p"))}</p>
  <div class="row"><button class="btn primary" onclick="resume()">${esc(done ? U("continue") : U("start"))}</button><span class="muted small">${done}/${total} ${esc(U("done_of"))} · ${esc(U("saved_local"))}</span></div></div>${ARENA_SVG}</section>
  ${done === total && total ? `<p class="kp">${esc(U("all_missions_done"))}</p>` : ""}
  <h2>${esc(U("missions"))}</h2>
  <div class="grid">${ms.map((m, i) => { const d = m.lessons.filter(l => S.done[l.id]).length;
    return `<button class="card" onclick="go('#m/${m.id}')"><span class="ic">${icon(m)}</span><span class="n">${i + 1}</span><h3>${esc(m.title)}</h3><p>${esc(m.intro)}</p><span class="pb"><i style="width:${d / m.lessons.length * 100}%"></i></span><span class="meta">${d}/${m.lessons.length} · ${m.lessons.reduce((s, l) => s + (l.minutes || 5), 0)} ${esc(U("min"))}</span></button>`; }).join("")}</div>
  <h2>${esc(U("practice"))}</h2>
  <div class="grid">${games.map(([g, ic]) => `<button class="card game" onclick="go('#g/${g}')"><span class="ic">${ic}</span><h3>${esc(U("game_" + g))}</h3><p>${esc(U("game_" + g + "_d"))}</p></button>`).join("")}</div>
  <p class="small muted" style="margin-top:24px"><button class="btn" onclick="resetProgress()">${esc(U("reset"))}</button></p>`;
}
/* Reset: delete progress on this device; works even if the browser blocks storage (then only this page view is reset). */
function resetProgress(){ if (!confirm(U("reset_confirm"))) return;
  try { localStorage.removeItem(KEY); } catch(e) {} finally { window.ClayNav && ClayNav.clearResume("interpreter"); location.reload(); } }
/* when the whole course is done there is nothing to come back to */
function courseDone(){ return allLessons().every(l => S.done[l.id]); }
function resume(){ const l = allLessons().find(x => !S.done[x.id]); go(l ? `#l/${l.id}` : "#g/exam"); }

/* ===== Mission ===== */
function viewMission(id){
  const m = IA.missions.find(x => x.id === id); if (!m) return viewHome();
  $("app").innerHTML = `<p><button class="btn" onclick="go('#')">← ${esc(U("home"))}</button></p>
  <div class="eyebrow">${icon(m)} ${esc(U("missions"))} ${IA.missions.indexOf(m) + 1}</div><h1>${esc(m.title)}</h1><p class="muted">${esc(m.intro)}</p>
  <div class="lesson-list">${m.lessons.map((l, i) => `<button class="li ${S.done[l.id] ? "done" : ""}" onclick="go('#l/${l.id}')"><span class="ok">${S.done[l.id] ? "✓" : i + 1}</span><span><b>${esc(l.title)}</b><br><span class="meta">${l.minutes || 5} ${esc(U("min"))}</span></span></button>`).join("")}</div>`;
}

/* ===== Lesson ===== */
function viewLesson(id){
  const l = lessonById(id); if (!l) return viewHome(); const m = l._m, i = m.lessons.indexOf(l);
  const next = m.lessons[i + 1] || (IA.missions[IA.missions.indexOf(m) + 1] || {lessons: []}).lessons[0];
  const rulesBase = LANG === "uk" ? "../rules/" : "../rules/en/";
  $("app").innerHTML = `<p><button class="btn" onclick="go('#m/${m.id}')">← ${esc(U("back_mission"))}</button></p><article>
  <div class="eyebrow">${icon(m)} ${esc(m.title)} · ${i + 1}/${m.lessons.length} · ${l.minutes || 5} ${esc(U("min"))}</div>
  <h1>${esc(l.title)}</h1>
  ${l.body.map(p => `<p>${esc(p)}</p>`).join("")}
  ${l.sim ? `<div id="simHost"></div>` : ""}
  ${l.key_points && l.key_points.length ? `<div class="kp"><b>${esc(U("key_points"))}</b><ul>${l.key_points.map(k => `<li>${esc(k)}</li>`).join("")}</ul></div>` : ""}
  ${l.coach_says && l.coach_says.length ? `<h2>${esc(U("coach_says"))}</h2>${l.coach_says.map((c, k) => sayCard(c, k)).join("")}` : ""}
  ${l.terms && l.terms.length ? `<h2>${esc(U("terms"))}</h2><div class="chips">${l.terms.map(t => termById(t) ? `<button class="chip" onclick="termCard('${t}')">${esc(termById(t).en)}${LANG !== "en" && termLocal(termById(t)) !== termById(t).en ? ` · ${esc(termLocal(termById(t)))}` : ""}</button>` : "").join("")}</div>` : ""}
  ${l.rule_refs && l.rule_refs.length ? `<h2>${esc(U("rules_refs"))}</h2><ul>${l.rule_refs.map(r => `<li><a href="${rulesBase}${r.book}/#${esc(r.id)}">${r.book === "compak" ? "Compak® Sporting" : r.book === "categories" ? "FITASC" : "Parcours de Chasse – Sporting™"} · ${esc(r.label || r.id)}</a></li>`).join("")}</ul>` : ""}
  <h2>${esc(U("quiz"))}</h2><div id="quiz"></div>
  ${l.sources && l.sources.length ? `<h2>${esc(U("sources"))}</h2><ul class="small">${l.sources.map(s => `<li><a href="${esc(s.url)}" ${NF}>${esc(s.title)} ↗</a></li>`).join("")}</ul>` : ""}
  <div class="row" style="margin-top:22px">${next ? `<button class="btn primary" onclick="go('#l/${next.id}')">${esc(U("next_lesson"))}: ${esc(next.title)} →</button>` : `<button class="btn primary" onclick="go('#g/exam')">${esc(U("game_exam"))} →</button>`}</div>
  </article>`;
  if (l.sim) mountSim($("simHost"), l.sim);
  window.ClayNav && ClayNav.setResume({section: "interpreter", label: `${U("app_title")} · ${l.title}`, url: location.href});
  runQuiz($("quiz"), l.quiz, (score) => {
    if (!S.done[l.id]) { S.done[l.id] = 1; S.quiz[l.id] = score; save(); addXP(XP.lesson + score * XP.quiz); toast(U("finish_lesson")); }
    if (courseDone() && window.ClayNav) ClayNav.clearResume("interpreter");
  });
}
function sayCard(c, k){
  return `<div class="say" id="say${k}"><div class="row"><span class="en">${esc(c.en)}</span><span class="spacer"></span>
  <button class="btn" onclick="speak(${JSON.stringify(c.en).replace(/"/g, "&quot;")})">🔊 ${esc(U("listen"))}</button>
  <button class="btn" onclick="this.closest('.say').classList.toggle('open')">${esc(U("reveal"))}</button></div>
  <div class="hid"><div class="tag">${esc(U("meaning"))}</div>${esc(c.meaning)}${c.say ? `<div class="tag" style="margin-top:6px">${esc(U("say_it"))}</div>${esc(c.say)}` : ""}</div></div>`;
}
/* Coach phrases are spoken in British English (most Sporting coaching vocabulary is British). */
function speak(t){ if (window.ClaySpeak) ClaySpeak(t, {rate: .95}); }

/* Generic quiz: items [{q, options[], answer, why}] -> calls onDone(correctCount) after the last one. */
function runQuiz(host, items, onDone){
  let k = 0, ok = 0; if (!items || !items.length) return;
  const draw = () => { const it = items[k];
    host.innerHTML = `<div class="q"><div class="meta">${esc(U("question"))} ${k + 1} ${esc(U("of"))} ${items.length}</div><b>${esc(it.q)}</b>
    <div class="opts">${it.options.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="why" id="why"></div></div>`;
    host.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const j = +b.dataset.j, right = j === it.answer; if (right) ok++;
      host.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.j === it.answer) x.classList.add("right"); });
      if (!right) b.classList.add("bad");
      $("why").innerHTML = `<b>${esc(right ? U("correct") : U("wrong"))}</b> ${esc(it.why || "")}<div class="row" style="margin-top:8px"><button class="btn primary" id="qn">${esc(U("next"))}</button></div>`;
      $("qn").onclick = () => { k++; if (k < items.length) draw(); else { host.innerHTML = `<div class="q"><span class="score">${ok}/${items.length}</span> <b>${esc(U("finish_lesson"))}</b></div>`; onDone(ok); } };
    });
  };
  draw();
}

/* Term card: English term, local term, definition, all 11 languages. */
function termCard(id){
  const t = termById(id); if (!t) return;
  const loc = t.tr && t.tr[LANG], def = (t.def && (t.def[LANG] || t.def.en)) || "";
  modal(`<div class="eyebrow">${esc(t.group || "")}</div><h2 style="margin-top:4px">${esc(t.en)}</h2>
  ${LANG !== "en" && loc ? `<p><b>${esc(loc.term)}</b>${loc.alt && loc.alt.length ? ` <span class="muted">(${esc(loc.alt.join(", "))})</span>` : ""}${loc.conf === "low" ? ` <span class="small" style="color:var(--clay)">${esc(U("confidence_low"))}</span>` : ""}</p>${loc.note ? `<p class="small muted">${esc(loc.note)}</p>` : ""}` : ""}
  <p>${esc(def)}</p><h3>${esc(U("term_all"))}</h3>
  <table>${LANGS.map(l => `<tr><th>${LANG_NAMES[l]}</th><td>${esc(l === "en" ? t.en : (t.tr && t.tr[l] ? t.tr[l].term : "—"))}${t.tr && t.tr[l] && t.tr[l].alt && t.tr[l].alt.length ? ` <span class="muted small">(${esc(t.tr[l].alt.join(", "))})</span>` : ""}</td></tr>`).join("")}</table>
  <p style="margin-top:12px">${t.page ? `<a class="btn" href="${esc(t.page[LANG] || t.page.en)}">📖 ${esc(U("glossary_page"))}</a> ` : ""}<button class="btn" onclick="speak(${JSON.stringify(t.en).replace(/"/g, "&quot;")})">🔊 ${esc(U("listen"))}</button> <button class="btn" onclick="closeModal()">✕</button></p>`);
}

/* ===== Simulations: shared module docs/shared/sims.js (also used by the rules trainer) ===== */
const FLIGHTS = ClaySims.FLIGHTS;
let SIMS = []; // course-side observers (games); shared animations are stopped by ClaySims
let LAB_XP = {}; // lead-lab methods already rewarded on this view
function stopSims(){ ClaySims.stopSims(); SIMS.forEach(x => x.stop && x.stop()); SIMS = []; LAB_XP = {}; try { speechSynthesis.cancel(); } catch(e) {} }
const mountSim = (host, sim) => ClaySims.mount(host, sim);
const flightSim = (host, preset, opts) => ClaySims.flightSim(host, preset, opts);
const leadLab = (host, method, opts) => ClaySims.leadLab(host, method, opts);
function simConfig(){ ClaySims.config({t: k => IA && IA.ui[k], term: id => { const t = termById(id); return t ? {en: t.en, local: LANG === "en" ? "" : termLocal(t)} : null; },
  onHit: info => { const k = (info && info.method) || "lab"; if (!LAB_XP[k]) { LAB_XP[k] = 1; addXP(XP.game); } }}); }

/* ===== Games ===== */
function viewGame(g){
  const back = `<p><button class="btn" onclick="go('#')">← ${esc(U("home"))}</button></p>`;
  const head = (t, d) => `${back}<div class="eyebrow">${esc(U("practice"))}</div><h1>${esc(t)}</h1><p class="muted">${esc(d)}</p>`;
  const host = () => $("ghost");
  if (g === "lead") { $("app").innerHTML = head(U("game_lead"), U("game_lead_d")) + `<div id="ghost"></div>`; return leadLab(host(), "maintained", {focus: "perceived-vs-actual"}); }
  if (g === "coach") { $("app").innerHTML = head(U("game_coach"), U("game_coach_d")) + `<div id="ghost"></div>`; return gameCoach(host()); }
  if (g === "flight") { $("app").innerHTML = head(U("game_flight"), U("game_flight_d")) + `<div id="ghost"></div>`; return gameFlight(host()); }
  if (g === "call") { $("app").innerHTML = head(U("game_call"), U("game_call_d")) + `<div id="ghost"></div>`; return gameCall(host()); }
  if (g === "terms") { $("app").innerHTML = head(U("game_terms"), U("game_terms_d")) + `<div id="ghost"></div>`; return gameTerms(host()); }
  if (g === "exam") { $("app").innerHTML = head(U("game_exam"), U("game_exam_d")) + `<div id="ghost"></div>`; return gameExam(host()); }
  viewHome();
}
/* Referee's call: the SAME question bank as the FITASC rules trainer (docs/rules/data/quiz-*.js, "decision" questions)
   with its translations (docs/rules/data/i18n/quiz-<lang>.json) — no copy of rules content in the course.
   The trainer's animations (q.sim) are shown here too. */
async function gameCall(host){
  const bank = (window.RULES_QUIZ || []).flatMap(b => b.questions.filter(q => q.type === "decision").map(q => Object.assign({book: b.key}, q)));
  let ov = {questions: {}};
  if (!["uk", "en"].includes(LANG)) { try { const r = await fetch(`../rules/data/i18n/quiz-${LANG}.json`); if (r.ok) ov = await r.json(); } catch(e) {} }
  const tr = (q, k) => q[k + "_" + LANG] || ((ov.questions[q.id] || {})[k === "q" ? "q" : "explain"]) || q[k + "_en"];
  const items = shuffle(bank).slice(0, 10).map(q => ({
    q: `${q.book === "compak" ? "Compak® Sporting" : "Sporting™"} · ${tr(q, "q")}`,
    options: q.options.map((o, i) => o[LANG] || ((ov.questions[q.id] || {}).options || [])[i] || o.en),
    answer: q.answer, why: tr(q, "explain"), sim: q.sim}));
  gameQuiz(host, items, items.length);
  const obs = new MutationObserver(() => { const qd = host.querySelector(".q"); if (!qd || qd.dataset.simDone) return; qd.dataset.simDone = 1;
    const it = items.find(x => qd.textContent.includes(x.q.slice(0, 40))); if (it && it.sim) { const d = document.createElement("div"); qd.prepend(d); mountSim(d, it.sim); } });
  obs.observe(host, {childList: true, subtree: true}); SIMS.push({stop: () => obs.disconnect()});
}
function gameQuiz(host, pool, n, onEnd){
  const items = shuffle(pool).slice(0, n);
  runQuiz(host, items, ok => { addXP(ok * XP.game); host.insertAdjacentHTML("beforeend", `<p><button class="btn primary" onclick="route()">${esc(U("play_again"))}</button></p>`); onEnd && onEnd(ok, items.length); });
}
function gameCoach(host){
  const all = allLessons().flatMap(l => l.coach_says || []).filter(c => c.meaning);
  const items = shuffle(all).slice(0, 10).map(c => { const wrong = shuffle(all.filter(x => x.meaning !== c.meaning)).slice(0, 3).map(x => x.meaning);
    const options = shuffle([c.meaning, ...wrong]); return {q: `🔊 “${c.en}” — ${U("which_meaning")}`, options, answer: options.indexOf(c.meaning), why: c.say || "", en: c.en}; });
  gameQuiz(host, items, items.length);
  // speak each phrase when it appears
  const obs = new MutationObserver(() => { const b = host.querySelector(".q b"); if (b && b.textContent.startsWith("🔊")) { const m = b.textContent.match(/“(.+)”/); if (m && b.dataset.spoken !== "1") { b.dataset.spoken = "1"; speak(m[1]); b.style.cursor = "pointer"; b.onclick = () => speak(m[1]); } } });
  obs.observe(host, {childList: true, subtree: true}); SIMS.push({stop: () => obs.disconnect()});
}
function gameFlight(host){
  const keys = Object.keys(FLIGHTS); let k = 0, ok = 0; const N = 8, order = shuffle(keys).slice(0, N);
  const nameOf = key => { const t = termById(FLIGHTS[key].term); return t ? (LANG === "en" ? t.en : `${t.en} · ${termLocal(t)}`) : (ClaySims.NAMES || {})[key] || key; };
  const draw = () => { const key = order[k], right = nameOf(key);
    const opts = shuffle([right, ...shuffle(keys.filter(x => nameOf(x) !== right).map(nameOf)).filter((v, i, a) => a.indexOf(v) === i).slice(0, 3)]);
    host.innerHTML = `<div class="meta">${esc(U("question"))} ${k + 1} ${esc(U("of"))} ${N}</div><div id="fs"></div><div class="q"><b>${esc(U("which_flight"))}</b><div class="opts">${opts.map(o => `<button class="opt">${esc(o)}</button>`).join("")}</div><div class="why" id="why"></div></div>`;
    flightSim($("fs"), key, {hideName: true});
    host.querySelectorAll(".opt").forEach(b => b.onclick = () => { const good = b.textContent === right; if (good) ok++;
      host.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.textContent === right) x.classList.add("right"); }); if (!good) b.classList.add("bad");
      $("why").innerHTML = `<b>${esc(good ? U("correct") : U("wrong"))}</b> ${termById(FLIGHTS[key].term) ? esc((termById(FLIGHTS[key].term).def || {})[LANG] || (termById(FLIGHTS[key].term).def || {}).en || "") : ""}<div class="row" style="margin-top:8px"><button class="btn primary" id="qn">${esc(U("next"))}</button></div>`;
      $("qn").onclick = () => { stopSims(); k++; if (k < N) draw(); else { host.innerHTML = `<div class="q"><span class="score">${ok}/${N}</span></div><p><button class="btn primary" onclick="route()">${esc(U("play_again"))}</button></p>`; addXP(ok * XP.game); } }; });
  };
  draw();
}
function gameTerms(host){
  const pool = TERMS.filter(t => LANG === "en" ? (t.def && t.def.en) : (t.tr && t.tr[LANG] && t.tr[LANG].term && t.tr[LANG].conf !== "low"));
  const ans = t => LANG === "en" ? t.def.en : t.tr[LANG].term;
  const items = shuffle(pool).slice(0, 12).map(t => { const right = ans(t);
    const opts = shuffle([right, ...shuffle(pool.filter(x => ans(x) !== right && x.group === t.group)).concat(shuffle(pool)).map(ans).filter((v, i, a) => v !== right && a.indexOf(v) === i).slice(0, 3)]);
    return {q: `${t.en} — ${LANG === "en" ? U("which_def") : U("which_term")}`, options: opts, answer: opts.indexOf(right), why: (t.def && (t.def[LANG] || t.def.en)) || ""}; });
  gameQuiz(host, items, items.length);
}
function gameExam(host){
  const pool = allLessons().flatMap(l => l.quiz || []), N = Math.min(30, pool.length);
  const cert = () => `<div class="noprint"><label>${esc(U("cert_name"))}<br><input id="cn" value="${esc(S.name)}" style="padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:min(360px,100%)"></label>
    <button class="btn primary" onclick="S.name=$('cn').value;save();$('cnm').textContent=S.name;window.print()">${esc(U("cert_print"))}</button></div>
    <div class="cert" style="margin-top:16px"><div class="logo" style="font-size:20px"><b>ClayArena</b></div><h2>${esc(U("cert_title"))}</h2><div class="nm" id="cnm">${esc(S.name || "—")}</div>
    <p style="max-width:none">${esc(U("cert_text"))}</p><p><b>${esc(U("app_title"))}</b> · ${S.exam ? esc(S.exam.date) + " · " + S.exam.score + "%" : ""}</p><p class="small">${esc(U("cert_note"))}</p></div>`;
  if (S.exam && S.exam.score >= 80) { host.innerHTML = `<p class="kp">${esc(U("exam_pass"))}</p>${cert()}<p><button class="btn" id="redo">${esc(U("play_again"))}</button></p>`; $("redo").onclick = () => { S.exam = null; save(); route(); }; return; }
  gameQuiz(host, pool, N, (ok, n) => { const score = Math.round(ok / n * 100), pass = score >= 80;
    if (pass) { S.exam = {score, date: new Date().toISOString().slice(0, 10)}; save(); addXP(XP.exam); }
    host.insertAdjacentHTML("beforeend", `<p class="kp">${esc(pass ? U("exam_pass") : U("exam_fail"))} (${score}%)</p>${pass ? cert() : ""}`); });
}

/* ===== Boot ===== */
$("lang").innerHTML = LANGS.map(l => `<option value="${l}">${LANG_NAMES[l]}</option>`).join("");
$("lang").onchange = e => setLang(e.target.value);
setLang(LANG);
</script>
</body>
