.note{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2)}

.held{background:var(--clay-soft)}
.tourlink{padding:6px 12px;font-size:13.5px;color:var(--muted);text-decoration:none;white-space:nowrap}
.tourlink[aria-current="page"]{background:#fff;color:#030712;font-weight:600}

.ph.media{padding:0;background:#000}
.ph.media img,.ph.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph.media.contain img{object-fit:contain;padding:10px;background:#0B1120}
.ph.media::before{display:none}
.ph .cap{position:absolute;left:8px;bottom:8px;right:auto;max-width:calc(100% - 16px);background:rgba(0,0,0,.65);color:#fff;padding:2px 8px;border-radius:4px;font-size:12px;pointer-events:none}
.ph.media video + .cap{bottom:auto;top:8px}
.ph.todo{border:1px dashed rgba(52,211,153,.4);background:rgba(52,211,153,.05)}
.ph.todo .cap{background:transparent;color:var(--field);position:relative;left:0;bottom:0}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.vids figure{margin:0;display:grid;gap:6px}
.vids video{width:100%;aspect-ratio:9/16;max-height:420px;object-fit:cover;background:#000;border-radius:10px;border:1px solid var(--line)}
.vids figcaption{font-size:12.5px;color:var(--muted)}
img.avatar{object-fit:cover;padding:0}
.vids figure.ig{grid-column:span 1}
.vids iframe{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff}
a.ph.insta{text-decoration:none;align-items:center;justify-content:center}
a.ph.insta:hover{background:rgba(52,211,153,.12)}

.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.gl{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.gl-img{position:relative;aspect-ratio:16/10;background:#0B1120}
.gl-img img{width:100%;height:100%;object-fit:cover;display:block}
.gl-img img.second{position:absolute;right:8px;bottom:8px;width:38%;height:42%;border-radius:8px;border:2px solid #030712;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.gl-body{padding:12px 14px;display:grid;gap:4px;align-content:start}
.gl-k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--field)}
.gl-body h3{margin:0;font-size:17px}
.gl-body p{margin:0;font-size:13.5px;color:#D1D5DB}
.gl-m{font-size:12px;color:var(--muted);margin-top:4px}
.credits{max-width:1180px;margin:32px auto 0;padding-inline:0;font-size:11.5px;color:var(--muted);line-height:1.6}
.credits a{color:var(--muted)}

.msum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.msum span{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--field-soft);color:var(--field)}
table.meals td{white-space:normal;vertical-align:top;min-width:170px;font-size:13px}
table.meals td.md{min-width:90px;font-weight:600;white-space:nowrap}
table.meals td b{display:block;font-size:13px}
table.meals td span:not(.mst){display:block;color:#D1D5DB}
.mst{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.minc .mst{color:var(--field)}
.mown .mst{color:var(--clay)}
.mown b,.mown span{opacity:.85}
td.mna{color:var(--muted)}
.mnotes{margin:12px 0 0;padding-left:18px;font-size:13.5px;color:#D1D5DB}
.mnotes li{margin:3px 0}

.mphotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}
.mphotos figure{margin:0;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#0B1120}
.mphotos img{width:100%;height:100%;object-fit:cover;display:block}
.mphotos figcaption{position:absolute;left:6px;bottom:6px;right:6px;font-size:11.5px;background:rgba(0,0,0,.65);color:#fff;padding:2px 7px;border-radius:4px}
@media (max-width:560px){.mphotos{grid-template-columns:1fr 1fr}.mphotos figure:last-child{display:none}}

.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:rgba(3,7,18,.92);backdrop-filter:blur(6px);padding:8px 0;margin:8px 0 18px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.04);color:#D1D5DB;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chips a:hover{border-color:rgba(52,211,153,.5);color:#fff}
.chips a.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.chips a:focus-visible{outline:2px solid var(--field);outline-offset:2px}
@media (min-width:901px){.chips{flex-wrap:wrap}}
.flashme{animation:flashme 1.2s ease-out}
@keyframes flashme{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}100%{box-shadow:0 0 0 14px rgba(52,211,153,0)}}
@media (prefers-reduced-motion:reduce){.flashme{animation:none}.chips a{transition:none}}
.person,.note,.buy{scroll-margin-top:130px}
section.blk{scroll-margin-top:130px}
</style>
</head>

/* UI state (client only): selected tour/screen/language, chosen price options, the 15-minute place hold,
   flash message and locally added questions. In production the hold and questions are server-side. */
let state = {tour:"t1", view:"page", lang:"EN", opts:{}, held:null, flash:"", extraQ:{t1:[],t2:[]}, mode:"public"};
let timer = null;

/* Remaining places: dots (taken / held / free) + label ("3 of 8 places left", "Only 1 place left",
   "Fully booked") + confirmation line ("N more shooters needed" until min is reached).
   Production: places = max_participants − confirmed bookings − active holds, pushed live after each payment/cancel. */
function seatsHTML(t, extraHeld){
  const taken = t.booked + (extraHeld?1:0);
  const left = t.places - taken;
  let dots = "";
  for(let i=0;i<t.places;i++){ dots += `<i class="${i<t.booked?'t':(i<taken?'h':'')}"></i>`; }
  const label = left<=0 ? "Fully booked" : (left<=2 ? `Only ${left} place${left>1?'s':''} left` : `${left} of ${t.places} places left`);
  const need = t.booked < t.min ? `<small>${t.min - t.booked} more shooter${t.min-t.booked>1?'s':''} needed to confirm</small>` : `<small>Tour confirmed · booking closes ${t.closes}</small>`;
  return `<div class="seats" aria-label="${label}">${dots}<b class="${left>2?'ok':''}">${label}</b>${need}</div>`;
}
/* Day-by-day program. mode "public": exact times are replaced by Morning/Afternoon/Evening and
   team-only items are hidden (visibility levels from the spec); mode "group": full times + team items +
   "now" highlight. Production: the server filters items by the viewer's role before sending them. */
function programHTML(t, mode){
  return `<div class="days">${t.program.map((d,di)=>`<div class="day"><div><b>${d.d}</b><small>${d.s}</small></div><ul>${
    d.items.filter(it=> mode==="public" ? it[1]!=="team" : true).map((it,ii)=>{
      const isNow = mode==="group" && ((t===TOURS.t1 && di===1 && ii===1) || (t===TOURS.t2 && di===1 && ii===0));
      const time = mode==="public" ? it[0].split("–")[0].replace(/\d\d:\d\d/, m=> m.slice(0,2)<"12"?"Morning":(m.slice(0,2)<"17"?"Afternoon":"Evening")) : it[0];
      const label = it[1]==="team" ? "team only" : it[1];
      return `<li class="${it[1]==='team'?'team':''} ${isNow?'now':''}"><time>${time}</time><span><span class="tag ${it[1]}">${label}</span>${it[2]}</span></li>`;
    }).join("")}</ul></div>`).join("")}</div>`;
}
/* PUBLIC TOUR PAGE: gallery → title, facts, places, languages → section tabs → About → At a glance →
   Meals → Who runs it → Program → Videos → Included → Cancellation → FAQ → Questions (public/private) +
   sticky booking box (options, total, deposit, 15-min hold, waitlist when full). */
function pageView(t){
  const extra = state.extraQ[state.tour];
  const optTotal = t.options.reduce((s,o)=> s + (state.opts[o[0]]?o[2]:0),0);
  const total = t.price + optTotal;
  const left = t.places - t.booked;
  const held = state.held && state.held.tour===state.tour;
  let remain = "";
  if(held){ const s = Math.max(0, Math.round((state.held.until - Date.now())/1000)); remain = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }
  const M = MEDIA[state.tour];
  const ph = M.gallery.map((g,i)=> g.type==="video"
    ? `<div class="ph media ${i===0?'big':''}"><video controls preload="none" playsinline poster="${g.poster}"><source src="${g.src}" type="video/mp4"></video><span class="cap">▶ ${g.cap}</span></div>`
    : g.type==="img"
    ? `<div class="ph media ${i===0?'big':''} ${i===4?'extra':''} ${g.fit==='contain'?'contain':''}"><img src="${g.src}" alt="${g.cap}" loading="lazy" onerror="this.remove()"><span class="cap">${g.cap}</span></div>`
    : g.type==="insta"
    ? `<a class="ph todo insta ${i===4?'extra':''}" href="#videos"><span class="cap">${g.cap}</span></a>`
    : `<div class="ph todo ${i===4?'extra':''}"><span class="cap">${g.cap}</span></div>`).join("");
  return `
  <div class="gallery" aria-label="Photo and video gallery">${ph}</div>
  <div class="page">
    <div>
      <div class="eyebrow">ClayAway tour · ${t.where} · ${t.disciplines}</div>
      <h1>${t.title}</h1>
      <div class="facts"><span>${t.dates}</span><span><b>${t.days}</b> days</span><span><b>${t.places}</b> shooters max</span><span>${t.targets}</span><span>Focus: <b>${t.focus}</b></span></div>
      ${seatsHTML(t, held)}
      <div class="langbar">Tour languages
        <div class="seg" role="group" aria-label="Tour language">${t.langs.map(l=>`<button data-lang="${l}" aria-pressed="${state.lang===l}">${l}</button>`).join("")}</div>
      </div>
      <nav class="chips" id="tabs" aria-label="Sections of this tour">${navItems(t).map(([label,id])=>`<a href="#${id}" data-jump="${id}">${label}</a>`).join("")}</nav>

      <section class="blk" id="about"><h2>About this tour</h2><p>${t.about[state.lang]||t.about.EN}</p>
        ${state.lang!=="EN"?`<p class="small muted">Shown in ${state.lang}. Other blocks have their own ${state.lang} version, written or checked by the organizer.</p>`:""}</section>

      <section class="blk" id="glance"><h2>The tour at a glance</h2>
        <div class="glance">${GLANCE[state.tour].map(c=>`<article class="gl"><div class="gl-img"><img src="${c.img.src}" alt="${c.t}" loading="lazy">${c.img2?`<img class="second" src="${c.img2.src}" alt="" loading="lazy">`:""}</div><div class="gl-body"><span class="gl-k">${c.k}</span><h3>${c.t}</h3><p>${c.d}</p><span class="gl-m">${c.m}</span></div></article>`).join("")}</div></section>

      <section class="blk" id="meals"><h2>Breakfast, lunch and dinner</h2>
        <p class="small muted">What is included, where, and what you eat. Built around the training day.</p>
        <div class="mphotos">${MEALPHOTOS[state.tour].map(p=>`<figure><img src="${p.src}" alt="${p.cap}" loading="lazy"><figcaption>${p.cap}</figcaption></figure>`).join("")}</div>
        <div class="msum">${MEALS[state.tour].summary.map(x=>`<span>${x}</span>`).join("")}</div>
        <div class="tbl"><table class="meals"><thead><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead><tbody>${MEALS[state.tour].rows.map(r=>`<tr><td class="md">${r.d}</td>${["b","l","dn"].map(k=>{const m=r[k]; if(!m) return `<td class="mna">—</td>`; return `<td class="${m.inc?'minc':'mown'}"><span class="mst">${m.inc?(m.tog?'Included · together':'Included'):'Not included'}</span><b>${m.where}</b>${m.what?`<span>${m.what}</span>`:""}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>
        <ul class="mnotes">${MEALS[state.tour].notes.map(n=>`<li>${n}</li>`).join("")}</ul>
      </section>

      <section class="blk" id="people"><h2>Who runs it</h2><div class="people">${t.people.map((p,pi)=>`<div class="person" id="person-${pi}"><div class="hd">${MEDIA[state.tour].photos[p.name]?`<img class="avatar" src="${MEDIA[state.tour].photos[p.name]}" alt="" onerror="this.outerHTML='<div class=avatar>${p.init}</div>'">`:`<div class="avatar">${p.init}</div>`}<div><div class="role">${p.role}</div><h3>${p.name}</h3></div></div><ul>${p.lines.map(l=>`<li>${l}</li>`).join("")}</ul><a href="${p.url}" class="small">Profile on ClayArena ↗</a></div>`).join("")}</div>
        <div class="note" id="guests">${t.groundNote}</div></section>

      <section class="blk" id="program"><h2>Program</h2><p class="small muted">Overview. Exact times and meeting points open in the group space after booking. Times in ${t.tz}.</p>${programHTML(t,"public")}</section>

      <section class="blk" id="videos"><h2>Videos</h2><p class="small muted">From ClayArena: the coach and the organizer on these grounds. The organizer can add their own videos.</p>
        <div class="vids">${state.tour==="t1"?`<figure class="ig"><iframe src="https://www.instagram.com/p/DcBipJtt_lG/embed/" title="Lena Weigele introduces Dornsberg Shooting Ground" loading="lazy" allowfullscreen></iframe><figcaption>Lena Weigele introduces Dornsberg Shooting Ground · <a href="https://www.instagram.com/p/DcBipJtt_lG/">ClayArena on Instagram ↗</a></figcaption></figure>`:""}${MEDIA[state.tour].videos.map(v=>`<figure><video controls preload="none" playsinline poster="${v.poster}"><source src="${v.src}" type="video/mp4"></video><figcaption>${v.cap} · <a href="${v.link}">on ClayArena ↗</a></figcaption></figure>`).join("")}</div></section>

      <section class="blk" id="included"><h2>What's included</h2><div class="cols2"><div class="box"><h3>Included</h3><ul class="check">${t.included.map(i=>`<li>${i}</li>`).join("")}</ul></div><div class="box"><h3>Not included</h3><ul class="check no">${t.excluded.map(i=>`<li>${i}</li>`).join("")}</ul></div></div></section>

      <section class="blk" id="cancel"><h2>Cancellation</h2><p>${t.cancel}</p></section>

      <section class="blk" id="faq"><h2>FAQ</h2>${t.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}</section>

      <section class="blk" id="qa"><h2>Questions about this tour</h2>
        <div class="qa">
          <form class="ask" id="askForm">
            <label for="qtext" class="small muted">Ask ${t.organizer} and the team. Any language is fine.</label>
            <textarea id="qtext" placeholder="Type your question…"></textarea>
            <div class="ask-row">
              <div class="seg" role="group" aria-label="Who sees it"><button type="button" data-mode="public" aria-pressed="${state.mode==='public'}">Public</button><button type="button" data-mode="private" aria-pressed="${state.mode==='private'}">Private</button></div>
              <span class="hint">${state.mode==='public'?'Everyone sees the question and the answer.':'Only you and the organizer see it. The reply comes to your ClayArena messages.'}</span>
              <button class="btn primary" type="submit">Send</button>
            </div>
            ${state.flash?`<div class="flash">${state.flash}</div>`:""}
          </form>
          ${extra.map(q=>`<div class="qitem"><div class="who">You <span>· just now</span><span class="pill info">Waiting for an answer</span></div><div>${q}</div></div>`).join("")}
          ${t.qa.map(q=>`<div class="qitem"><div class="who">${q.who} <span>· ${q.from}</span></div><div>${q.q}${q.tq?`<div class="small muted">${q.tq}</div>`:""}</div>
            <div class="ans"><div class="who">${q.by}<span class="pill ok">${q.byRole}</span></div><div>${q.a}${q.ta?`<div class="small muted">${q.ta}</div>`:""}${q.tr?`<div class="small muted">${q.tr}</div>`:""}</div></div></div>`).join("")}
        </div>
      </section>
    </div>

    <aside class="buy" id="buy" aria-label="Booking">
      <div class="price"><span class="muted small">from</span><b>${t.currency}${fmt(t.price)}</b><span class="muted small">per shooter</span></div>
      ${seatsHTML(t, held)}
      <div class="opts">${t.options.map(o=>`<label><input type="checkbox" data-opt="${o[0]}" ${state.opts[o[0]]?'checked':''}><span>${o[1]}</span><span>+${t.currency}${fmt(o[2])}</span></label>`).join("")}</div>
      <div class="total"><span>Total</span><b>${t.currency}${fmt(total)}</b></div>
      <div class="total" style="border:0;padding:0"><span class="muted">Deposit today (${t.deposit}%)</span><b>${t.currency}${fmt(Math.round(total*t.deposit/100))}</b></div>
      ${held?`<div class="held">Place held for you: <b>${remain}</b>. Continue to payment to keep it.</div><button class="btn primary full" data-act="pay">Continue to payment</button><button class="btn full" data-act="release">Release the place</button>`
        : left>0 ? `<button class="btn primary full" data-act="book">Book a place</button>` : `<button class="btn primary full">Join the waitlist</button>`}
      <button class="btn full" data-act="private">Message ${t.organizer} privately</button>
      <p class="small muted" style="margin:0">Secure payment via ClayArena. Places update live.</p>
    </aside>
  </div>`;
}
/* CLOSED GROUP SPACE (only confirmed paid bookings + tour team): "Now & next", full program,
   announcements (organizer/coach only), group chat with "Translated" lines, my documents, participants.
   Production: built on ClayArena messaging; access checked on the server for every request. */
function groupView(t){
  return `
  <div class="ghead"><div><div class="eyebrow">ClayAway · Group space · ${t.dates}</div><h1>${t.title}</h1></div><span class="lock">Only for confirmed bookings</span></div>
  <div class="tabs-in"><span class="on">Today</span><span>Program</span><span>Announcements</span><span>Group chat</span><span>Participants</span><span>Travel</span><span>Documents</span><span>Checklist</span><span>Photos</span><span>My training</span></div>
  <div class="grid3">
    <div style="display:grid;gap:16px">
      <div class="now"><div class="lbl">Now · ${t.now.day}</div><div class="item">${t.now.item}</div><div class="small">${t.now.where}</div><div class="next">Next: ${t.now.next}</div><div><button class="btn">Directions</button></div></div>
      <div><h2>Program</h2><p class="small muted">Full times and meeting points. Times in ${t.tz}. Dashed items are visible to the team only.</p>${programHTML(t,"group")}</div>
    </div>
    <div style="display:grid;gap:16px">
      <div class="box"><h3>Announcements</h3>${t.announcements.map(a=>`<div class="ann"><small>${a[0]}</small>${a[1]}${a[2]?`<div class="small muted">${a[2]}</div>`:""}</div>`).join("")}</div>
      <div class="box"><h3>Group chat</h3><div class="chat">${t.chat.map(m=>`<div class="msg ${m[3]?'mine':''}"><div class="who">${m[0]}</div>${m[1]}${m[2]?`<div class="tr">${m[2]}</div>`:""}</div>`).join("")}</div></div>
      <div class="box"><h3>My documents</h3><ul class="docs">${t.docs.map(d=>`<li><span>${d[0]}</span><span class="pill ${d[2]}">${d[1]}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>Participants</h3><p class="small muted" style="margin:0 0 6px">${t.participants.length} shooters${t.guests?` + ${t.guests} guests`:""}</p><ul class="docs">${t.participants.map(p=>`<li><span>${p[0]}</span><span class="muted small">${p[1]}</span></li>`).join("")}</ul></div>
    </div>
  </div>`;
}
/* ORGANIZER DASHBOARD: KPIs (places, paid, ClayArena fee, payout, booking deadline), needs attention,
   bookings, questions inbox (public + private), team, tour page status. Fee here is a sample 10%;
   in production the % comes from admin settings (global / per organizer / per tour). */
function dashView(t){
  const paid = t.participants.reduce((s,p)=>s+p[4],0);
  const fee = Math.round(paid*0.10);
  return `
  <div class="ghead"><div><div class="eyebrow">ClayAway · Organizer dashboard · ${t.organizer}</div><h1>${t.title}</h1></div><span class="pill ${t.booked>=t.min?'ok':'warn'}" style="font-size:12.5px;padding:4px 12px">${t.booked>=t.min?'Published · Confirmed':'Published · Waiting for minimum'}</span></div>
  <div class="kpis">
    <div><small>Places</small><b>${t.booked} / ${t.places}</b><span>minimum ${t.min}${t.guestsMax?` · guests ${t.guests}/${t.guestsMax}`:""}</span></div>
    <div><small>Paid so far</small><b>${t.currency}${fmt(paid)}</b><span>${(n=>n+' deposit'+(n===1?'':'s')+' open')(t.participants.filter(p=>p[3]==='warn').length)}</span></div>
    <div><small>ClayArena fee 10%</small><b>${t.currency}${fmt(fee)}</b><span>sample rate</span></div>
    <div><small>Your payout so far</small><b>${t.currency}${fmt(paid-fee)}</b><span>paid out after the tour starts</span></div>
    <div><small>Booking closes</small><b>${t.closes.split(" ").slice(0,2).join(" ")}</b><span>${t.closes.split(" ")[2]}</span></div>
  </div>
  <div class="grid3">
    <div style="display:grid;gap:16px">
      <div class="box"><h3>Needs attention</h3><ul class="todo">${t.todo.map(x=>`<li><span class="pill ${x[0]}">${x[1]}</span>${x[2]}</li>`).join("")}</ul></div>
      <div><h3>Bookings</h3><div class="tbl"><table><thead><tr><th>Shooter</th><th>From</th><th>Status</th><th style="text-align:right">Paid</th></tr></thead><tbody>${t.participants.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td><span class="pill ${p[3]}">${p[2]}</span></td><td class="num">${t.currency}${fmt(p[4])}</td></tr>`).join("")}</tbody></table></div></div>
    </div>
    <div style="display:grid;gap:16px">
      <div class="box"><h3>Questions</h3><p class="small muted" style="margin:0 0 6px">Public and private questions in one inbox</p><ul class="docs">${t.inbox.map(q=>`<li><span><span class="pill ${q[0]==='Private'?'warn':'info'}" style="margin:0 6px 0 0">${q[0]}</span>${q[2]}<br><span class="small muted">${q[1]}</span></span><span class="pill ${q[3]==='New'?'warn':'ok'}">${q[3]}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>Team</h3><ul class="docs">${t.people.filter(p=>p.role!=="Shooting ground").map(p=>`<li><span>${p.name}</span><span class="small muted">${p.role}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>Tour page</h3><ul class="docs"><li><span>Languages</span><span class="small">${t.langs.join(" · ")}</span></li><li><span>Photos and videos</span><span class="small">${t.gallery.length + 14}</span></li><li><span>Last change</span><span class="small muted">Program, 2 days ago</span></li></ul></div>
    </div>
  </div>`;
}

/* Section tabs under the title: [label, element id]. Coach/Organizer/Shooting ground point to the
   person cards (#person-0..2), Prices to the booking box (#buy). Keep in the same order as the page. */
function navItems(t){
  const items=[["About","about"],["At a glance","glance"],["Meals","meals"],["Coach","person-0"],["Organizer","person-1"],["Shooting ground","person-2"]];
  if(t.chips.includes("For guests")) items.push(["For guests","guests"]);
  items.push(["Program","program"],["Videos","videos"],["What's included","included"],["Prices","buy"],["Cancellation","cancel"],["FAQ","faq"],["Questions","qa"]);
  return items;
}
let tabObserver=null;
function setActiveTab(id){
  document.querySelectorAll("#tabs a").forEach(a=>{ const on=a.dataset.jump===id; a.classList.toggle("on",on); if(on) a.setAttribute("aria-current","true"); else a.removeAttribute("aria-current"); });
  const act=document.querySelector("#tabs a.on"); const bar=document.getElementById("tabs");
  if(act&&bar&&bar.scrollWidth>bar.clientWidth){ bar.scrollTo({left:act.offsetLeft-bar.clientWidth/2+act.offsetWidth/2,behavior:"smooth"}); }
}
function initTabs(){
  if(tabObserver){ tabObserver.disconnect(); tabObserver=null; }
  const bar=document.getElementById("tabs"); if(!bar) return;
  const ids=[...new Set([...bar.querySelectorAll("a")].map(a=>a.dataset.jump))].filter(id=>id!=="buy");
  const els=ids.map(id=>document.getElementById(id)).filter(Boolean);
  const visible=new Map();
  tabObserver=new IntersectionObserver(entries=>{
    entries.forEach(e=>visible.set(e.target.id,e.isIntersecting?e.boundingClientRect.top:null));
    let best=null,bt=Infinity; visible.forEach((top,id)=>{ if(top!==null && Math.abs(top-140)<bt){bt=Math.abs(top-140);best=id;} });
    if(best) setActiveTab(best);
  },{rootMargin:"-130px 0px -55% 0px",threshold:0});
  els.forEach(el=>tabObserver.observe(el));
}
document.addEventListener("click",e=>{
  const a=e.target.closest("a[data-jump]"); if(!a) return;
  e.preventDefault(); const el=document.getElementById(a.dataset.jump); if(!el) return;
  const y=el.getBoundingClientRect().top+window.scrollY-130;
  window.scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  setActiveTab(a.dataset.jump);
  el.classList.remove("flashme"); void el.offsetWidth; el.classList.add("flashme");
});
/* Re-renders the whole screen from `state` (simple and fine for a demo; in ClayArena use the site's
   front-end framework and components). Keeps the question draft and re-inits the tab observer. */
function render(){
  const t = TOURS[state.tour];
  if(!t.langs.includes(state.lang)) state.lang = "EN";
  document.querySelectorAll("[data-tour]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tour===state.tour));
  document.querySelectorAll(".top [data-view]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===state.view));
  const app = document.getElementById("app");
  const q = document.getElementById("qtext"); const draft = q ? q.value : "";
  app.innerHTML = (state.view==="page"?pageView(t):state.view==="group"?groupView(t):dashView(t))
    + (state.view==="page"?`<div class="credits"><b>Photo credits.</b> ${(()=>{const seen=new Set();return GLANCE[state.tour].flatMap(c=>[[c.t,c.img],c.img2?[c.t,c.img2]:null]).concat(MEALPHOTOS[state.tour].map(p=>[p.cap,p])).filter(Boolean).filter(([t,i])=>!seen.has(i.src)&&seen.add(i.src)).map(([t,i])=>`<a href="${i.page}">${t}</a> — ${i.credit}`).join(" · ")})()}. Photos from Wikimedia Commons are used under their licences; photos from the grounds\u2019 websites are shown for this internal project demo only.</div>`:"") + `<footer>ClayAway project (to be integrated into ClayArena). Coach, organizer and ground data come from their ClayArena profiles; dates, prices, participants and messages are sample data.</footer>`;
  const q2 = document.getElementById("qtext"); if(q2 && draft) q2.value = draft;
  if(state.view==="page") initTabs();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.tour){ state.tour=b.dataset.tour; state.opts={}; state.flash=""; try{history.replaceState(null,"","#"+state.tour)}catch(_){}; render(); window.scrollTo({top:0}); }
  else if(b.dataset.view){ state.view=b.dataset.view; render(); window.scrollTo({top:0}); }
  else if(b.dataset.lang){ state.lang=b.dataset.lang; render(); }
  else if(b.dataset.mode){ state.mode=b.dataset.mode; render(); }
  else if(b.dataset.act==="book"){ state.held={tour:state.tour, until:Date.now()+15*60*1000}; clearInterval(timer); timer=setInterval(()=>{ if(!state.held||Date.now()>state.held.until){state.held=null;clearInterval(timer);} if(state.view==="page") render(); },1000); render(); }
  else if(b.dataset.act==="release"){ state.held=null; clearInterval(timer); render(); }
  else if(b.dataset.act==="pay"){ state.flash=""; b.textContent="Payment step is not part of this project demo"; b.disabled=true; }
  else if(b.dataset.act==="private"){ state.mode="private"; render(); document.getElementById("qa").scrollIntoView(); document.getElementById("qtext").focus(); }
});
document.addEventListener("change", e=>{ if(e.target.dataset.opt){ state.opts[e.target.dataset.opt]=e.target.checked; render(); } });
document.addEventListener("submit", e=>{
  if(e.target.id!=="askForm") return; e.preventDefault();
  const v = document.getElementById("qtext").value.trim(); const t = TOURS[state.tour];
  if(!v){ state.flash="Type a question first."; render(); return; }
  if(state.mode==="public"){ state.extraQ[state.tour].unshift(v.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))); state.flash=`Posted publicly. ${t.organizer} gets a notification and the answer will appear here.`; }
  else { state.flash=`Sent privately to ${t.organizer}. The reply will come to your ClayArena messages.`; }
  document.getElementById("qtext").value=""; render();
});
render();
</script>
</body>
</html>
