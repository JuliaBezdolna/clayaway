{ const want=VQ||vlGet()||store.get().lang||(navigator.language||"").slice(0,2).toLowerCase(); S.lang = want==="uk" ? "uk" : "en"; }

function search(book,q){
  const I=idx(book), qt=[...new Set(toks(expand(q)))]; if(!qt.length) return null;
  const base=new Set(toks(q)); const scored=I.docs.map(d=>{ let sc=0, hit=new Set(); qt.forEach(w=>{ const idf=Math.log(1+I.N/(1+(I.df[w]||0))); d.tok.forEach(([ts,wt],fi)=>{ let c=0; ts.forEach(x=>{ if(x===w) c+=1; else if(w.length>=4&&(x.startsWith(w)||w.startsWith(x))) c+=.6; }); if(c){ sc+=wt*idf*(1+Math.log(c)); if(fi===0&&base.has(w)) hit.add(w); } }); }); return {d,sc,cov:base.size?hit.size/base.size:0}; }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  const faq=scored.filter(x=>x.d.type==="faq").slice(0,3), items=scored.filter(x=>x.d.type==="item").slice(0,5);
  return {faq,items,qt};
}
function pdfLink(book,page){ return `<a class="pdf" href="${esc(book.source.url)}#page=${page}" target="_blank" rel="nofollow noopener noreferrer">${t("open")} ${page} ↗</a>`; }
function itemHTML(book,it,open){ return `<details class="item" id="it-${it.id}" ${open?"open":""}><summary><b>${esc(tx(it,"title"))}</b><span class="ref">${esc(it.ref||"")}</span></summary><div class="body"><p>${esc(tx(it,"summary"))}</p>${(it["points_"+L()]||[]).length?`<ul>${it["points_"+L()].map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}${pdfLink(book,it.page)}${it.quick_guide?`<span class="tag">${t("qg")}</span>`:""}</div></details>`; }
/* Show the FAQ answer when it is at least 40% as relevant as the best rule item, or when its question
   contains 60%+ of the user's words (FAQ entries are short, so raw scores favour long rule items),
   otherwise lead with the rule items themselves (the item is the source of truth). */
function answerHTML(book){
  const r=S.res; if(!r) return "";
  if(!r.faq.length&&!r.items.length) return `<div class="answer"><div class="empty">${t("none")}</div></div>`;
  const I=idx(book); let h=`<div class="answer">`;
  const top=r.faq[0], topItem=r.items[0];
  if(top && (!topItem || top.sc>=topItem.sc*0.4||top.cov>=0.6)){ const f=top.d.f; h+=`<div class="ans-main"><div class="q">${t("answer")} · ${esc(tx(f,"q"))}</div><div class="a">${esc(tx(f,"a"))}</div><div class="refs">${(f.refs||[]).map(id=>I.byId[id]?`<button data-jump="${id}">${esc(I.byId[id].ref||tx(I.byId[id],"title"))}</button>`:"").join("")}${(f.refs||[]).map(id=>I.byId[id]).filter(Boolean).slice(0,1).map(it=>`<a href="${esc(book.source.url)}#page=${it.page}" target="_blank" rel="nofollow noopener noreferrer">PDF ${it.page} ↗</a>`).join("")}</div></div>`;
    if(r.faq.length>1) h+=`<div class="also">${t("similar")}: ${r.faq.slice(1).map(x=>`<button class="btn" style="padding:2px 9px;font-size:12.5px" data-q="${esc(tx(x.d.f,"q"))}">${esc(tx(x.d.f,"q"))}</button>`).join(" ")}</div>`; }
  if(r.items.length){ h+=`<h3 style="margin-top:6px">${t("rel")}</h3>`+r.items.slice(0,4).map((x,i)=>itemHTML(book,x.d.it,i===0&&!(top&&(!topItem||top.sc>=topItem.sc*0.4||top.cov>=0.6)))).join(""); }
  return h+`</div>`;
}
/* Tab title and share tags follow the language shown (the static tags in <head> are the Ukrainian ones of scripts/make_og.py). */
function setMeta(sel,v){ const m=document.querySelector(sel); if(m) m.setAttribute("content",v); }
function headLang(){
  document.title=t("page");
  setMeta('meta[name="description"]',t("ogD")); setMeta('meta[property="og:title"]',t("ogT")); setMeta('meta[property="og:description"]',t("ogD"));
  setMeta('meta[property="og:locale"]',t("locale")); setMeta('meta[name="twitter:title"]',t("ogT")); setMeta('meta[name="twitter:description"]',t("ogD"));
}
/* The line of static pages under the app, in the language shown, with the visitor language on the trainer link. */
function staticsHTML(){
  const own=L()==="uk"?["sporting/","compak/"]:["en/sporting/","en/compak/"], oth=L()==="uk"?["en/sporting/","en/compak/"]:["sporting/","compak/"];
  return `${t("full")}: <a href="${own[0]}">Sporting™</a> · <a href="${own[1]}">Compak® Sporting</a> · <span lang="${t("otherL")}">${t("other")}</span>: <a href="${oth[0]}" hreflang="${t("otherL")}">Sporting™</a> · <a href="${oth[1]}" hreflang="${t("otherL")}">Compak® Sporting</a> · <a href="trainer/?lang=${esc(VL())}#${S.disc}">🎯 ${t("trainer")}</a>`;
}
function render(){
  document.documentElement.lang=L()==="uk"?"uk":"en"; headLang();
  document.getElementById("svc").innerHTML=`<span class="ic" aria-hidden="true">📘</span><span>${t("svc")}<small>${t("svcS")}</small></span>`;
  document.getElementById("discG").setAttribute("aria-label",t("discG")); document.getElementById("langG").setAttribute("aria-label",t("langG"));
  const sn=document.getElementById("statics"); sn.setAttribute("aria-label",t("statics")); sn.innerHTML=staticsHTML();
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===L()));
  document.querySelectorAll("[data-disc]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.disc===S.disc));
  const book=BOOKS[S.disc], app=document.getElementById("app");
  const dname=S.disc==="sporting"?"Sporting™":"Compak® Sporting";
  if(!book){ app.innerHTML=`<h1>${t("title").replace("{d}",dname)}</h1><div class="empty">${t("notReady")}</div>`; return; }
  const ex=(book.faq||[]).slice(0,8);
  let parts=[]; book.sections.forEach(s=>{ if(!parts.includes(s.part)) parts.push(s.part); });
  app.innerHTML=`<div class="eyebrow">FITASC · ${esc(dname)}</div><h1>${t("title").replace("{d}",esc(dname))}</h1><p class="muted">${t("lead")}</p>
   <div class="source"><span>${t("src")}: <a href="${esc(book.source.url)}" target="_blank" rel="nofollow noopener noreferrer">${t("off")} ↗</a></span><span>${t("ed")}: ${esc(book.source.edition||"")}</span>${book.source.quick_guide_url?`<span><a href="${esc(book.source.quick_guide_url)}" target="_blank" rel="nofollow noopener noreferrer">${t("guide")} ↗</a></span>`:""}<span>${t("checked")}</span><a class="btn primary" style="padding:6px 14px;font-size:14px;text-decoration:none" href="trainer/?lang=${esc(VL())}#${S.disc}">🎯 ${t("trainer")} →</a><a class="btn" style="padding:4px 12px;font-size:13px;text-decoration:none" href="${L()==="uk"?"categories/":"en/categories/"}">${t("cats")}</a></div>
   <form class="ask" id="askf"><label for="q" class="eyebrow" style="display:block;margin-bottom:8px">${t("askL")}</label><div class="askrow"><input id="q" type="search" autocomplete="off" placeholder="${esc(t("ph"))}" value="${esc(S.q)}"><button class="btn primary" type="submit">${t("ask")}</button></div>
     <div class="chips">${ex.map(f=>`<button type="button" data-q="${esc(tx(f,"q"))}">${esc(tx(f,"q"))}</button>`).join("")}</div></form>
   <div id="ans">${answerHTML(book)}</div>
   <div class="layout"><nav class="toc" aria-label="${t("toc")}">${parts.map(p=>`<div class="part">${t("part")} ${esc(p)}</div>`+book.sections.filter(s=>s.part===p).map(s=>`<button data-sec="${s.id}">${s.chapter?esc(s.chapter)+". ":""}${esc(tx(s,"title"))}</button>`).join("")).join("")}<div class="part">FAQ</div><button data-sec="faq">${t("faq")}</button></nav>
   <div><h2>${t("read")}</h2>${book.sections.map(s=>`<section class="sec" id="sec-${s.id}"><h2><small>${t("part")} ${esc(s.part)}${s.chapter?" · "+t("chapter")+" "+esc(s.chapter):""}</small>${esc(tx(s,"title"))}</h2>${s.items.map(it=>itemHTML(book,it,false)).join("")}</section>`).join("")}
   <section class="sec faqlist" id="sec-faq"><h2>${t("faq")}</h2>${(book.faq||[]).map(f=>`<details><summary>${esc(tx(f,"q"))}</summary><p>${esc(tx(f,"a"))}</p><div class="refs">${(f.refs||[]).map(id=>idx(book).byId[id]?`<button data-jump="${id}">${esc(idx(book).byId[id].ref||id)}</button>`:"").join("")}</div></details>`).join("")}</section>
   <div class="disclaimer">${t("disc")}</div></div></div>`;
}
function ask(q){ S.q=q; S.res=search(BOOKS[S.disc],q); document.getElementById("ans").innerHTML=answerHTML(BOOKS[S.disc]); document.getElementById("q").value=q; document.getElementById("ans").scrollIntoView({behavior:"smooth",block:"nearest"}); }
function jump(id){ const el=document.getElementById(id); if(!el) return; if(el.tagName==="DETAILS") el.open=true; window.scrollTo({top:el.getBoundingClientRect().top+scrollY-80,behavior:"smooth"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  /* the choice becomes the visitor language, unless it is what the visitor language already shows here (a German visitor reads
     the guide in English: pressing "English" keeps "de" for the rest of the site) */
  if(d.lang){ S.lang=d.lang; store.set({lang:S.lang,disc:S.disc}); if((VL()==="uk"?"uk":"en")!==S.lang) vlSet(S.lang);
    try{ const u=new URL(location.href); u.searchParams.set("lang",VL()); history.replaceState(null,"",u.pathname+u.search+u.hash); }catch(_){} // reload / shared link keep it (?lang=de still shows English)
    if(S.q) S.res=search(BOOKS[S.disc]||{sections:[],faq:[],source:{}},S.q); render(); return; }
  if(d.disc){ S.disc=d.disc; S.q=""; S.res=null; store.set({lang:S.lang,disc:S.disc}); try{history.replaceState(null,"","#"+S.disc)}catch(_){} render(); return; }
  if(d.q){ ask(d.q); return; }
  if(d.jump){ jump("it-"+d.jump); return; }
  if(d.sec){ jump("sec-"+d.sec); return; }
});
document.addEventListener("submit",e=>{ if(e.target.id==="askf"){ e.preventDefault(); ask(document.getElementById("q").value); } });
render();
/* The trainer links follow the visitor language: refresh them when the bar reports it (nav.js runs after this script). */
document.addEventListener("claynav:update",()=>{ const sn=document.getElementById("statics"); if(sn) sn.innerHTML=staticsHTML();
  document.querySelectorAll('#app a[href^="trainer/"]').forEach(a=>{ a.href=`trainer/?lang=${encodeURIComponent(VL())}#${S.disc}`; }); });
/* Deep link from the trainer: ?item=<id>#<discipline> opens and highlights that rule item. */
try{ const it=new URLSearchParams(location.search).get("item"); if(it) setTimeout(()=>jump("it-"+it),150); }catch(_){}
</script>
