   <div class="layout"><nav class="toc" aria-label="${t("toc")}">${parts.map(p=>`<div class="part">${t("part")} ${esc(p)}</div>`+book.sections.filter(s=>s.part===p).map(s=>`<button data-sec="${s.id}">${s.chapter?esc(s.chapter)+". ":""}${esc(tx(s,"title"))}</button>`).join("")).join("")}<div class="part">FAQ</div><button data-sec="faq">${t("faq")}</button></nav>
   <div><h2>${t("read")}</h2>${book.sections.map(s=>`<section class="sec" id="sec-${s.id}"><h2><small>${t("part")} ${esc(s.part)}${s.chapter?" · "+t("chapter")+" "+esc(s.chapter):""}</small>${esc(tx(s,"title"))}</h2>${s.items.map(it=>itemHTML(book,it,false)).join("")}${secNav(book,s.id)}</section>`).join("")}
   <section class="sec faqlist" id="sec-faq"><h2>${t("faq")}</h2>${(book.faq||[]).map(f=>`<details><summary>${esc(tx(f,"q"))}</summary><p>${esc(tx(f,"a"))}</p><div class="refs">${(f.refs||[]).map(id=>idx(book).byId[id]?refBtn(idx(book).byId[id]):"").join("")}</div></details>`).join("")}</section>
   <div class="disclaimer">${t("disc")}</div></div></div>`;
  whereBuild(book,parts,dname);
  if(ITEM){ const i=ITEM; ITEM=null; setTimeout(()=>jump("it-"+i),150); }
}
function ask(q){ S.q=q; S.res=search(BOOK(S.disc),q); document.getElementById("ans").innerHTML=answerHTML(BOOK(S.disc)); document.getElementById("q").value=q; document.getElementById("ans").scrollIntoView({behavior:"smooth",block:"nearest"}); }
function jump(id){ const el=document.getElementById(id); if(!el) return; if(el.tagName==="DETAILS") el.open=true; window.scrollTo({top:el.getBoundingClientRect().top+scrollY-80,behavior:"smooth"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  /* the choice becomes the visitor language, unless it is what the visitor language already shows here (a German visitor reads
     the guide in English: pressing "English" keeps "de" for the rest of the site) */
  if(d.lang){ S.lang=d.lang; store.set({lang:S.lang,disc:S.disc}); if((VL()==="uk"?"uk":"en")!==S.lang) vlSet(S.lang);
    try{ const u=new URL(location.href); u.searchParams.set("lang",VL()); history.replaceState(null,"",u.pathname+u.search+u.hash); }catch(_){} // reload / shared link keep it (?lang=de still shows English)
    if(S.q) S.res=search(BOOK(S.disc)||{sections:[],faq:[],source:{}},S.q); render(); return; }
  if(d.disc){ S.disc=d.disc; S.q=""; S.res=null; store.set({lang:S.lang,disc:S.disc}); try{history.replaceState(null,"","#"+S.disc)}catch(_){} render(); return; }
  if(d.q){ ask(d.q); return; }
  if(d.jump){ jump("it-"+d.jump); return; }
  if(d.sec){ whereOpen(false); jump("sec-"+d.sec); return; }
});
/* Phone (≤900 px, see the CSS): "you are here" line #where — shown once the title has scrolled away and the rules are on screen;
   it names the chapter under the top edge and opens #whereList (all chapters + FAQ). The language dropdown closes after a choice. */
let WSECS=[], WCUR=null;
function whereBuild(book,parts,dname){
  WSECS=book.sections.map(s=>({id:s.id,t:(s.chapter?s.chapter+". ":"")+tx(s,"title")})).concat([{id:"faq",t:t("faq")}]);
  document.querySelector("#where .d").textContent=dname.replace(" Sporting","");
  document.getElementById("whereList").innerHTML=parts.map(p=>`<div class="part">${t("part")} ${esc(p)}</div>`+book.sections.filter(s=>s.part===p).map(s=>`<button type="button" data-sec="${s.id}">${s.chapter?esc(s.chapter)+". ":""}${esc(tx(s,"title"))}</button>`).join("")).join("")+`<div class="part">FAQ</div><button type="button" data-sec="faq">${t("faq")}</button>`;
  WCUR=null; whereTick();
}
function whereOpen(on){
  const w=document.getElementById("where"); w.setAttribute("aria-expanded",on?"true":"false");
  document.getElementById("whereList").classList.toggle("open",on); document.getElementById("whereShade").classList.toggle("open",on);
  if(on){ const b=document.querySelector("#whereList button.on"); if(b) b.scrollIntoView({block:"center"}); }
}
function whereTick(){
  const w=document.getElementById("where"), h1=document.querySelector("#app h1"); if(!WSECS.length||!h1) return;
  let c=WSECS[0].id; for(const s of WSECS){ const el=document.getElementById("sec-"+s.id); if(el&&el.getBoundingClientRect().top<90) c=s.id; }
  const first=document.getElementById("sec-"+WSECS[0].id), show=h1.getBoundingClientRect().bottom<0&&!!first&&first.getBoundingClientRect().top<innerHeight;
  if(w.classList.contains("show")!==show){ w.classList.toggle("show",show); if(!show) whereOpen(false); }
  if(c===WCUR) return; WCUR=c;
  document.querySelectorAll("#whereList button").forEach(b=>b.classList.toggle("on",b.dataset.sec===c));
  const s=WSECS.find(x=>x.id===c); w.querySelector(".c").textContent=s?s.t:"";
}
let wRaf=0; addEventListener("scroll",()=>{ if(!wRaf) wRaf=requestAnimationFrame(()=>{ wRaf=0; whereTick(); }); },{passive:true});
document.getElementById("where").addEventListener("click",()=>whereOpen(document.getElementById("where").getAttribute("aria-expanded")!=="true"));
document.getElementById("whereShade").addEventListener("click",()=>whereOpen(false));
document.getElementById("langD").addEventListener("click",e=>{ if(e.target.closest(".menu [data-lang]")) document.getElementById("langD").open=false; });
document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; if(document.getElementById("whereList").classList.contains("open")){ whereOpen(false); document.getElementById("where").focus(); } document.getElementById("langD").open=false; });
document.addEventListener("submit",e=>{ if(e.target.id==="askf"){ e.preventDefault(); ask(document.getElementById("q").value); } });
/* Deep link from the trainer: ?item=<id>#<discipline> opens and highlights that rule item (once the book is drawn, in render()). */
let ITEM=null; try{ ITEM=new URLSearchParams(location.search).get("item"); }catch(_){}
render();
/* The trainer links follow the visitor language: refresh them when the bar reports it (nav.js runs after this script). */
document.addEventListener("claynav:update",()=>{ const sn=document.getElementById("statics"); if(sn) sn.innerHTML=staticsHTML();
  document.querySelectorAll('#app a[href^="trainer/"]').forEach(a=>{ a.href=`trainer/?lang=${encodeURIComponent(VL())}#${S.disc}`; }); });
</script>
</body>
</html>
