<style>
:root{
  color-scheme:dark;
  --bg:#030712; --surface:rgba(255,255,255,.04); --surface2:#0B1120; --line:rgba(255,255,255,.1);

*{box-sizing:border-box}
html,body{margin:0}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 80px}
h1,h2,h3{letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(26px,4.5vw,40px);line-height:1.1;margin:0 0 8px}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 10px;max-width:72ch}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--em)}
/* Top of the guide (wave 2, 10.11.2026, variant D of design-mockups/rules-home.html, put together by the owner from A and B):
   lead → one big search field + "frequently searched" topics → three tiles (trainer, age categories, all questions) → a small

   above the search, the field at 584 px on a 375 px phone and 8 long example questions (434 px) under it. */
.big{display:flex;align-items:center;gap:8px;background:#030712;border:1.5px solid rgba(52,211,153,.55);border-radius:16px;padding:4px 4px 4px 14px;margin:12px 0 10px;min-height:58px}

.big .lo{font-size:18px;color:var(--muted)}

.big button[type=submit]{border:0;border-radius:12px;background:var(--primary);color:#fff;min-width:50px;min-height:50px;font-size:19px;font-weight:700}
/* our own "clear" ✕ instead of the browser's (owner, 10.11.2026): shown while the field has text, lit on hover, no tooltip;

.big input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.big .clr{display:none;flex:none;border:0;border-radius:10px;background:transparent;color:var(--muted);min-width:40px;min-height:40px;font-size:17px;line-height:1;place-items:center;transition:background .15s,color .15s}
.big .clr.on{display:grid}

.item{background:linear-gradient(to bottom right,rgba(255,255,255,.1),rgba(255,255,255,.05));border:1px solid var(--line);border-radius:12px;margin-bottom:10px;scroll-margin-top:80px}

.item summary::-webkit-details-marker{display:none}

/* expand(q) → {syn, phr}: the words added by SYN (they help to reach the right item, so they weigh half of the visitor's own words:

/* Build (once per book) the search index: every rule item and FAQ entry becomes a document
   with weighted fields; df = document frequency per word for IDF weighting. */
function idx(book){
  if(book._idx) return book._idx;
  const items=[]; book.sections.forEach(sec=>sec.items.forEach(it=>items.push(Object.assign({sec},it))));
  const docs=[];
  items.forEach(it=>docs.push({type:"item",it,fields:[[it.title_en+" "+it.title_uk,3],[(it.keywords||[]).join(" ")+" "+(it.terms||[]).join(" ").replace(/-/g," "),3],[(it.points_en||[]).join(" ")+" "+(it.points_uk||[]).join(" "),1.3],[it.summary_en+" "+it.summary_uk,1],[it.sec.title_en+" "+it.sec.title_uk,1.5]]}));
  (book.faq||[]).forEach(f=>docs.push({type:"faq",f,fields:[[f.q_en+" "+f.q_uk,3.2],[f.a_en+" "+f.a_uk,1]]}));
  docs.forEach(d=>{d.tok=d.fields.map(([s,w])=>[toks(s),w]);});
  const df={}; docs.forEach(d=>{new Set(d.tok.flatMap(([ts])=>ts)).forEach(w=>df[w]=(df[w]||0)+1);});

/* Score = sum over query words of field weight x IDF x (1 + log(matches)); prefix matches count 0.6.
   Returns the top FAQ entries and top rule items separately. */
function search(book,q){
  const I=idx(book), ex=expand(q), QW=new Map(); toks(ex.syn).forEach(w=>QW.set(w,.5)); toks(ex.phr).forEach(w=>QW.set(w,1)); toks(q).forEach(w=>QW.set(w,1));
  const qt=[...QW.keys()]; if(!qt.length) return null;
  const base=new Set(toks(q)); const scored=I.docs.map(d=>{ let sc=0, hit=new Set(); qt.forEach(w=>{ const idf=Math.log(1+I.N/(1+(I.df[w]||0)))*QW.get(w); d.tok.forEach(([ts,wt],fi)=>{ let c=0; ts.forEach(x=>{ c+=wmatch(w,x); }); if(c){ sc+=wt*idf*(1+Math.log(c)); if(fi===0&&base.has(w)) hit.add(w); } }); }); return {d,sc,cov:base.size?hit.size/base.size:0}; }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  const faq=scored.filter(x=>x.d.type==="faq").slice(0,3), items=scored.filter(x=>x.d.type==="item").slice(0,5);
  /* lead = the FAQ answer is shown first (answerHTML) only when it agrees with the rule items: it cites the best rule item and is
     either about as relevant (≥ 40% of its score) or its question covers most of the visitor's words (≥ 60%). A FAQ about a
     neighbouring case («рівний результат за 5-те місце» for «нічия за третє місце») cites other items and stays below. Otherwise the rule items lead (the item is the source of truth). Before 10.11.2026 any FAQ at 40% of the
     best item's score led, so a FAQ that shared one word could win. */
  const top=faq[0], ti=items[0];
  const cites=s=>(top.d.f.refs||[]).some(id=>s.has(id));
  const lead=!!top&&(!ti||(cites(new Set([ti.d.it.id]))&&(top.sc>=ti.sc*0.4||top.cov>=0.6)));
  return {faq,items,qt,lead};
}

function ruleNum(ref){ const r=ref||"", rng=[];

  const one=rest.match(/\d+(?:\.\d+)+/g)||[], all=[...one,...rng.flat()];
  const v=[...new Set([...one.filter(x=>!all.some(m=>m!==x&&m.startsWith(x+"."))),...rng.map(x=>x.join("–"))])];
  if(v.length) return {k:"art",v:v.join(" · ")};
  const m=r.match(/^(Chapter|Annex|Appendix) (\d+)/); return m?{k:m[1]==="Chapter"?"ch":"ann",v:m[2]}:null; }
