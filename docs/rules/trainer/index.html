h1,h2,h3{letter-spacing:-.01em;text-wrap:balance}

.muted{color:var(--muted)}.small{font-size:13px}

.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.result{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.result .score{font-size:56px;font-weight:800;line-height:1;margin:10px 0;font-variant-numeric:tabular-nums}

.review{margin-top:18px;display:grid;gap:10px}
.review .qcard{margin:0}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.disclaimer{margin-top:40px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

   be guessed by its place. The trainer never reorders the data: it only maps display order -> option index (run.ord),
   and every comparison uses the data index (q.answer), so the language overlays (same option order as the data) stay valid.
   Languages: all ClayArena site languages. uk/en live in the question files; the others come from

const LANGS=["en","uk","de","fr","it","cs","pl","pt","hu","fi","lt"];
const LANG_NAMES={en:"English",uk:"Українська",de:"Deutsch",fr:"Français",it:"Italiano",cs:"Čeština",pl:"Polski",pt:"Português",hu:"Magyar",fi:"Suomi",lt:"Lietuvių"};

const BOOKS=Object.fromEntries((window.RULES||[]).map(b=>[b.key,b]));
const QUIZ=Object.fromEntries((window.RULES_QUIZ||[]).map(q=>[q.key,q.questions]));
const PASS=0.8;
const T={
 uk:{svc:"Тренажер правил",svcS:"ClayArena · FITASC",title:"Тренажер правил {d}",lead:"Перевірте, як ви знаєте правила: ситуації на стенді, цифри й ліміти, «правда чи ні». Після кожної відповіді — пояснення і посилання на пункт довідника та сторінку офіційного PDF.",
   quick:"Швидкий тест",quickS:"10 випадкових питань, пояснення одразу",exam:"Іспит",examS:"30 питань, результат у кінці, прохідний бал 80%",mist:"Мої помилки",mistS:"питання, на які ви відповіли неправильно",

   res:"Результат",pass:"Іспит складено",fail:"Ще трохи — і складете",again:"Ще раз",home:"До вибору режиму",review:"Розбір відповідей",
   sAns:"Відповідей",sAcc:"Точність",sBest:"Найкращий іспит",sMist:"Помилок для повторення",none:"Питань для цієї дисципліни ще немає.",noMist:"Помилок немає — чудово!",
   back:"← Довідник правил",disc:"Тренажер побудований на нашому переказі регламенту FITASC. Чинним є лише офіційний текст FITASC. Parcours de Chasse – Sporting™ і Compak® Sporting — торговельні марки FITASC.",count:"питань у банку"},
 en:{svc:"Rules trainer",svcS:"ClayArena · FITASC",title:"{d} rules trainer",lead:"Test your knowledge of the rules: situations on the stand, numbers and limits, true or false. After every answer you get an explanation and a link to the rule in the guide and to the official PDF page.",
   quick:"Quick test",quickS:"10 random questions, explanation straight away",exam:"Exam",examS:"30 questions, result at the end, pass mark 80%",mist:"My mistakes",mistS:"questions you answered wrong",
   level:"Level",all:"all",l1:"basic",l2:"organizer",l3:"referee",q:"Question",of:"of",next:"Next",finish:"Finish",right:"Correct!",wrong:"Wrong.",
   decision:"Referee's decision",number:"Numbers",truefalse:"True or false",choice:"Choice",open:"Rule in the guide",pdf:"PDF, p.",
   res:"Result",pass:"Exam passed",fail:"Almost there",again:"Try again",home:"Back to modes",review:"Answer review",
   sAns:"Answers",sAcc:"Accuracy",sBest:"Best exam",sMist:"Mistakes to repeat",none:"No questions for this discipline yet.",noMist:"No mistakes — well done!",

};
/* Storage keys follow the ClayArena naming: this trainer is a ClayArena tool. OLD = legacy keys of builds before 10.2026.
   One-time migration: when the new key is still empty, the legacy value is copied over.
   - progress: the legacy key is kept and read as a fallback (store.get), so nothing is lost if the copy fails;
     the project bar (docs/shared/nav.js) also reads "clayarena-trainer" first, then the legacy key.
   - test in progress: copied, then the legacy key is removed (a finished test must not come back from it).
   In production the progress lives in the ClayArena user profile and none of this is needed. */
const KEY="clayarena-trainer", RUNKEY="clayarena-trainer-run", OLD={progress:"clayaway-trainer",run:"clayaway-trainer-run"};
(function migrate(){ try{
  const p=localStorage.getItem(OLD.progress); if(p!=null&&localStorage.getItem(KEY)==null) localStorage.setItem(KEY,p);
  const r=localStorage.getItem(OLD.run); if(r!=null){ if(localStorage.getItem(RUNKEY)==null) localStorage.setItem(RUNKEY,r); localStorage.removeItem(OLD.run); }
}catch(e){} })();
const store={get(){try{return JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD.progress)||"{}")}catch(e){return{}}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};
let P=Object.assign({lang:(()=>{const q=new URLSearchParams(location.search).get("lang");if(LANGS.includes(q))return q;const n=(navigator.language||"en").slice(0,2);return LANGS.includes(n)?n:"en";})(),disc:"sporting",stats:{}},store.get());
{const q=new URLSearchParams(location.search).get("lang");if(LANGS.includes(q))P.lang=q;}
let S={view:"home",level:0,run:null};
/* A test in progress survives leaving the page (saved per browser for 24 h) and the project bar offers the way back.
   The saved run keeps the display order of the options (ord); a run saved before option shuffling existed gets a new order. */
try{ const sv=JSON.parse(localStorage.getItem(RUNKEY)||"null"); if(sv&&Date.now()-sv.ts<864e5&&sv.disc){ P.disc=sv.disc; const byId=Object.fromEntries((QUIZ[sv.disc]||[]).map(q=>[q.id,q])); const qs=sv.ids.map(id=>byId[id]).filter(Boolean); if(qs.length===sv.ids.length){ const ord=qs.map((q,i)=>sv.ord&&validOrd(sv.ord[i],q)?sv.ord[i]:optOrder(q)); S={view:"run",level:sv.level||0,run:{mode:sv.mode,qs,ord,i:sv.i,ans:sv.ans,picked:sv.picked}}; } } }catch(e){}
function saveRun(){ try{ if(S.view==="run"&&S.run){ const r=S.run; localStorage.setItem(RUNKEY,JSON.stringify({ts:Date.now(),disc:P.disc,level:S.level,mode:r.mode,ids:r.qs.map(q=>q.id),ord:r.ord,i:r.i,ans:r.ans,picked:r.picked}));
    window.ClayNav&&ClayNav.setResume({section:"trainer",label:`${t("svc")} ${P.disc==="sporting"?"Sporting™":"Compak® Sporting"} · ${t("q")} ${r.i+1} ${t("of")} ${r.qs.length}`,url:location.href.replace(/#.*$/,"")+"#"+P.disc}); }
  else { localStorage.removeItem(RUNKEY); window.ClayNav&&ClayNav.clearResume("trainer"); } }catch(e){} }
if(location.hash==="#compak")P.disc="compak"; if(location.hash==="#sporting")P.disc="sporting";
const L=()=>P.lang;
const t=k=>(T[L()]&&T[L()][k])||(OV.ui&&OV.ui[k])||T.en[k];
/* tx(obj, field): question text / explanation / rule title in the current language (overlay for languages beyond uk/en) */
const tx=(o,k)=>{ if(o[k+"_"+L()]) return o[k+"_"+L()]; const v=o.id&&OV.questions[o.id]; if(v){ if(k==="q"&&v.q) return v.q; if(k==="explain"&&v.explain) return v.explain; } return o[k+"_en"]||""; };
const optText=(q,o,i)=>o[L()]||((OV.questions[q.id]||{}).options||[])[i]||o.en;
async function loadLang(l){ OV={ui:{},questions:{}}; if(l==="uk"||l==="en") return; try{ const r=await fetch(`../data/i18n/quiz-${l}.json`); if(r.ok) OV=await r.json(); }catch(e){} }
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st=()=>{ const s=P.stats[P.disc]=P.stats[P.disc]||{ans:0,ok:0,best:0,wrong:[]}; return s; };
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function itemById(id){ const b=BOOKS[P.disc]; if(!b) return null; for(const s of b.sections) for(const it of s.items) if(it.id===id) return it; return null; }
function pool(){ const qs=QUIZ[P.disc]||[]; return S.level?qs.filter(q=>q.level===S.level):qs; }
/* Display order of the options: a random permutation of option indices; true/false keeps True, False.
   (Function declarations, so the saved-run restore above can use them before this point.) */
function optOrder(q){ const a=q.options.map((_,i)=>i); if(q.type==="truefalse") return a; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function validOrd(o,q){ return Array.isArray(o)&&o.length===q.options.length&&o.slice().sort((x,y)=>x-y).every((v,i)=>v===i); }
function start(mode){
  let qs = mode==="mistakes" ? (QUIZ[P.disc]||[]).filter(q=>st().wrong.includes(q.id)) : pool();
  qs = shuffle(qs).slice(0, mode==="exam"?30:mode==="quick"?10:qs.length);
  if(!qs.length) return;
  S.run={mode,qs,ord:qs.map(optOrder),i:0,ans:[],picked:null}; S.view="run"; render(); scrollTo(0,0);
}
function refsHTML(q){
  const b=BOOKS[P.disc]; return `<div class="refs">${(q.refs||[]).map(id=>{ const it=itemById(id); if(!it) return ""; return `<a href="../?item=${encodeURIComponent(id)}#${P.disc}">${esc(it.ref||tx(it,"title"))}</a><a href="${esc(b.source.url)}#page=${it.page}" target="_blank" rel="nofollow noopener noreferrer">${t("pdf")} ${it.page} ↗</a>`; }).join("")}</div>`;
}
/* ord = display order (array of option indices); data-opt always carries the ORIGINAL index. */
function qCard(q,picked,reveal,idx,total,ord){
  const order=validOrd(ord,q)?ord:q.options.map((_,i)=>i);
  return `<div class="qcard"><div class="qhead"><span class="type ${q.type}">${t(q.type)||q.type}</span><span>${idx!=null?`${t("q")} ${idx+1} ${t("of")} ${total}`:""} · ${esc(q.topic||"")} · ${t("l"+q.level)||""}</span></div>
    ${q.sim?`<div class="qsim" data-clay-sim='${JSON.stringify(q.sim)}'></div>`:""}<h2>${esc(tx(q,"q"))}</h2><div class="opts">${order.map(i=>{ const o=q.options[i]; let c=""; if(reveal){ if(i===q.answer)c="right"; else if(i===picked)c="wrong"; } else if(i===picked)c="chosen"; return `<button ${reveal||picked!=null?"disabled":""} class="${c}" data-opt="${i}">${esc(optText(q,o,i))}</button>`; }).join("")}</div>
    ${reveal?`<div class="explain ${picked===q.answer?"":"bad"}"><b>${picked===q.answer?t("right"):t("wrong")}</b> ${esc(tx(q,"explain"))}${refsHTML(q)}</div>`:""}</div>`;
}
function homeView(){
  const d=P.disc==="sporting"?"Sporting™":"Compak® Sporting", qs=QUIZ[P.disc]||[], s=st();
  if(!qs.length) return `<h1>${t("title").replace("{d}",d)}</h1><div class="empty">${t("none")}</div>`;
  const acc=s.ans?Math.round(s.ok/s.ans*100):0;
  return `<a class="small" href="../#${P.disc}">${t("back")}</a><div class="eyebrow" style="margin-top:12px">FITASC · ${d}</div><h1>${t("title").replace("{d}",d)}</h1><p class="muted">${t("lead")}</p>
   <div class="stats"><div><small>${t("sAns")}</small><b>${s.ans}</b></div><div><small>${t("sAcc")}</small><b>${acc}%</b></div><div><small>${t("sBest")}</small><b>${s.best}%</b></div><div><small>${t("sMist")}</small><b>${s.wrong.length}</b></div></div>
   <div class="filters">${t("level")}: ${[0,1,2,3].map(l=>`<button class="chip" data-level="${l}" aria-pressed="${S.level===l}">${l?t("l"+l):t("all")}</button>`).join("")}<span>· ${pool().length} ${t("count")}</span></div>
   <div class="modes"><button class="mode" data-start="quick"><b>${t("quick")}</b><span>${t("quickS")}</span></button><button class="mode" data-start="exam"><b>${t("exam")}</b><span>${t("examS")}</span></button><button class="mode" data-start="mistakes" ${s.wrong.length?"":"disabled"}><b>${t("mist")}</b><span>${s.wrong.length?t("mistS"):t("noMist")}</span><small>${s.wrong.length||""}</small></button></div>
   <div class="disclaimer">${t("disc")}</div>`;
}
function runView(){
  const r=S.run, q=r.qs[r.i], exam=r.mode==="exam", answered=r.picked!=null;
  return `<div class="bar"><i style="width:${(r.i/r.qs.length)*100}%"></i></div>${qCard(q,r.picked,answered&&!exam,r.i,r.qs.length,(r.ord||[])[r.i])}
    <div class="qfoot"><button class="btn" data-home="1">${t("home")}</button>${answered?`<button class="btn primary" data-next="1">${r.i+1<r.qs.length?t("next"):t("finish")}</button>`:""}</div>`;
}
function resultView(){
  const r=S.run, ok=r.ans.filter((a,i)=>a===r.qs[i].answer).length, pct=Math.round(ok/r.qs.length*100), exam=r.mode==="exam";
  return `<div class="result"><div class="eyebrow">${t("res")} · ${t(r.mode==="mistakes"?"mist":r.mode)}</div><div class="score ${!exam||pct>=PASS*100?"pass":"fail"}">${ok} / ${r.qs.length}</div><p class="muted" style="margin:0 auto 14px">${pct}%${exam?" · "+(pct>=PASS*100?t("pass"):t("fail")):""}</p>
    <button class="btn primary" data-start="${r.mode}">${t("again")}</button> <button class="btn" data-home="1">${t("home")}</button></div>
    ${exam||r.ans.some((a,i)=>a!==r.qs[i].answer)?`<h2 style="margin-top:24px">${t("review")}</h2><div class="review">${r.qs.map((q,i)=>exam||r.ans[i]!==q.answer?qCard(q,r.ans[i],true,i,r.qs.length,(r.ord||[])[i]):"").join("")}</div>`:""}`;
}
function render(){
  document.documentElement.lang=L();
  document.getElementById("svc").innerHTML=`${t("svc")}<small>ClayArena · FITASC</small>`; document.title=`${t("svc")} FITASC · ClayArena`;
  const sel=document.getElementById("tlang"); if(!sel.options.length) sel.innerHTML=LANGS.map(l=>`<option value="${l}">${LANG_NAMES[l]}</option>`).join(""); sel.value=L();
  document.querySelectorAll("[data-disc]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.disc===P.disc));
  ClaySims.stopSims();
  document.getElementById("app").innerHTML = S.view==="run"?runView():S.view==="result"?resultView():homeView();
  if(S.view==="run") ClaySims.auto();
  saveRun();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return; const d=b.dataset;

  if(d.disc){ P.disc=d.disc; S={view:"home",level:0,run:null}; store.set(P); try{history.replaceState(null,"","#"+P.disc)}catch(_){} render(); return; }
  if(d.level!==undefined){ S.level=+d.level; render(); return; }
  if(d.start){ start(d.start); return; }
  if(d.home){ S.view="home"; S.run=null; render(); scrollTo(0,0); return; }
  if(d.opt!==undefined && S.run && S.run.picked==null){
    const r=S.run, q=r.qs[r.i], pick=+d.opt, s=st(); r.picked=pick; r.ans[r.i]=pick; s.ans++;
    if(pick===q.answer){ s.ok++; s.wrong=s.wrong.filter(id=>id!==q.id); } else if(!s.wrong.includes(q.id)) s.wrong.push(q.id);
    store.set(P); render(); return; }
  if(d.next){ const r=S.run; r.i++; r.picked=null; if(r.i>=r.qs.length){ const ok=r.ans.filter((a,i)=>a===r.qs[i].answer).length; if(r.mode==="exam"){ st().best=Math.max(st().best,Math.round(ok/r.qs.length*100)); store.set(P);} S.view="result"; } render(); scrollTo(0,0); return; }
});
document.getElementById("tlang").addEventListener("change",async e=>{ P.lang=e.target.value; store.set(P); await loadLang(P.lang); render(); });
loadLang(P.lang).then(render);
</script>
</body>
