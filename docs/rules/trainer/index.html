<style>
:root{
  color-scheme:dark;
  --bg:#030712; --surface:rgba(255,255,255,.04); --surface2:#0B1120; --line:rgba(255,255,255,.1);
  --ink:#F3F4F6; --soft:#D1D5DB; --muted:#9CA3AF;
  --em:#34D399; --em-soft:rgba(16,185,129,.15); --primary:#059669; --cyan:#22D3EE;
  --clay:#FB923C; --clay-soft:rgba(251,146,60,.14); --red:#F87171; --red-soft:rgba(248,113,113,.14);
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--body)}
a{color:var(--em)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(3,7,18,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:9px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.logo{display:inline-block;background:#000;border-radius:8px;padding:2px 11px;font-weight:700;font-size:17px;box-shadow:0 0 16px rgba(52,211,153,.25);text-decoration:none}
.logo b{background:linear-gradient(90deg,#34D399,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.svc{font-weight:700}.svc small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;font-weight:600}
.seg.disc button[aria-pressed="true"]{background:#fff;color:#030712}
main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:22px 80px}
h1,h2,h3{letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(26px,4.5vw,40px);line-height:1.1;margin:0 0 8px}
h2{font-size:20px;margin:0 0 10px}
p{margin:0 0 10px;max-width:70ch}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--em)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start;transition:border-color .15s}
.mode:hover{border-color:rgba(52,211,153,.5)}
.mode b{font-size:17px}
.mode span{font-size:13.5px;color:var(--soft)}
.mode small{font-size:12px;color:var(--muted)}
.mode[disabled]{opacity:.45;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 4px;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--em-soft);border-color:rgba(52,211,153,.5);color:var(--em);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.stats small{font-size:12.5px;color:var(--muted)}
.stats b{font-size:24px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--cyan));transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.type{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px}
.type.decision{background:var(--clay-soft);color:var(--clay)}
.type.number{background:rgba(34,211,238,.14);color:var(--cyan)}
.type.truefalse{background:var(--em-soft);color:var(--em)}
.type.choice{background:rgba(255,255,255,.08);color:var(--soft)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:10px}
.qcard h2{font-size:19px;font-weight:600;line-height:1.45;margin:8px 0 16px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:12px 14px;font-size:15px}
.opts button:hover:not([disabled]){border-color:rgba(52,211,153,.5)}
.opts button.right{border-color:var(--em);background:var(--em-soft)}
.opts button.wrong{border-color:var(--red);background:var(--red-soft)}
.opts button.chosen{border-color:var(--cyan);background:rgba(34,211,238,.1)}
.opts button[disabled]{cursor:default}
.explain{margin-top:14px;border-left:3px solid var(--em);padding-left:12px;color:var(--soft)}
.explain.bad{border-left-color:var(--red)}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.refs a{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--em);text-decoration:none}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.result{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.result .score{font-size:56px;font-weight:800;line-height:1;margin:10px 0;font-variant-numeric:tabular-nums}
.result .pass{color:var(--em)} .result .fail{color:var(--red)}
.review{margin-top:18px;display:grid;gap:10px}
.review .qcard{margin:0}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.disclaimer{margin-top:40px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="../../"><b>ClayArena</b></a>
  <span class="svc" id="svc"></span>
  <span class="spacer"></span>
  <div class="seg disc" role="group" aria-label="Discipline"><button data-disc="sporting">Sporting™</button><button data-disc="compak">Compak® Sporting</button></div>
  <div class="seg" role="group" aria-label="Language"><button data-lang="uk">UA</button><button data-lang="en">EN</button></div>
</div></header>
<main id="app"></main>
<script src="../data/sporting.js"></script>
<script src="../data/compak.js"></script>
<script src="../data/quiz-sporting.js"></script>
<script src="../data/quiz-compak.js"></script>
<script>
/* ClayAway · FITASC rules trainer.
   Questions: docs/rules/data/quiz-<key>.js (format QUIZ_SCHEMA.md); every question cites rule item ids (refs)
   from docs/rules/data/<key>.js, so each explanation links to the item in the rules guide and to the FITASC PDF page.
   Modes: quick (10 random), exam (30 random, results only at the end, pass mark 80%), mistakes (questions answered
   wrong before). Progress is stored per browser in localStorage "clayaway-trainer". */
const BOOKS=Object.fromEntries((window.RULES||[]).map(b=>[b.key,b]));
const QUIZ=Object.fromEntries((window.RULES_QUIZ||[]).map(q=>[q.key,q.questions]));
const PASS=0.8;
const T={
 uk:{svc:"Тренажер правил",svcS:"ClayAway · FITASC",title:"Тренажер правил {d}",lead:"Перевірте, як ви знаєте правила: ситуації на стенді, цифри й ліміти, «правда чи ні». Після кожної відповіді — пояснення і посилання на пункт довідника та сторінку офіційного PDF.",
   quick:"Швидкий тест",quickS:"10 випадкових питань, пояснення одразу",exam:"Іспит",examS:"30 питань, результат у кінці, прохідний бал 80%",mist:"Мої помилки",mistS:"питання, на які ви відповіли неправильно",
   level:"Рівень",all:"усі",l1:"базовий",l2:"організатор",l3:"суддя",q:"Питання",of:"з",next:"Далі",finish:"Завершити",right:"Правильно!",wrong:"Неправильно.",
   decision:"Рішення судді",number:"Цифри",truefalse:"Правда чи ні",choice:"Вибір",open:"Пункт у довіднику",pdf:"PDF, стор.",
   res:"Результат",pass:"Іспит складено",fail:"Ще трохи — і складете",again:"Ще раз",home:"До вибору режиму",review:"Розбір відповідей",
   sAns:"Відповідей",sAcc:"Точність",sBest:"Найкращий іспит",sMist:"Помилок для повторення",none:"Питань для цієї дисципліни ще немає.",noMist:"Помилок немає — чудово!",
   back:"← Довідник правил",disc:"Тренажер побудований на нашому переказі регламенту FITASC. Чинним є лише офіційний текст FITASC. Parcours de Chasse – Sporting™ і Compak® Sporting — торговельні марки FITASC.",count:"питань у банку"},
 en:{svc:"Rules trainer",svcS:"ClayAway · FITASC",title:"{d} rules trainer",lead:"Test your knowledge of the rules: situations on the stand, numbers and limits, true or false. After every answer you get an explanation and a link to the rule in the guide and to the official PDF page.",
   quick:"Quick test",quickS:"10 random questions, explanation straight away",exam:"Exam",examS:"30 questions, result at the end, pass mark 80%",mist:"My mistakes",mistS:"questions you answered wrong",
   level:"Level",all:"all",l1:"basic",l2:"organizer",l3:"referee",q:"Question",of:"of",next:"Next",finish:"Finish",right:"Correct!",wrong:"Wrong.",
   decision:"Referee's decision",number:"Numbers",truefalse:"True or false",choice:"Choice",open:"Rule in the guide",pdf:"PDF, p.",
   res:"Result",pass:"Exam passed",fail:"Almost there",again:"Try again",home:"Back to modes",review:"Answer review",
   sAns:"Answers",sAcc:"Accuracy",sBest:"Best exam",sMist:"Mistakes to repeat",none:"No questions for this discipline yet.",noMist:"No mistakes — well done!",
   back:"← Rules guide",disc:"The trainer is based on our summary of the FITASC rulebook. Only the official FITASC text applies. Parcours de Chasse – Sporting™ and Compak® Sporting are trademarks of FITASC.",count:"questions in the bank"}
};
const store={get(){try{return JSON.parse(localStorage.getItem("clayaway-trainer")||"{}")}catch(e){return{}}},set(v){try{localStorage.setItem("clayaway-trainer",JSON.stringify(v))}catch(e){}}};
let P=Object.assign({lang:"uk",disc:"sporting",stats:{}},store.get());
let S={view:"home",level:0,run:null};
if(location.hash==="#compak")P.disc="compak"; if(location.hash==="#sporting")P.disc="sporting";
const L=()=>P.lang,t=k=>T[L()][k],tx=(o,k)=>o[k+"_"+L()]||o[k+"_en"]||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st=()=>{ const s=P.stats[P.disc]=P.stats[P.disc]||{ans:0,ok:0,best:0,wrong:[]}; return s; };
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function itemById(id){ const b=BOOKS[P.disc]; if(!b) return null; for(const s of b.sections) for(const it of s.items) if(it.id===id) return it; return null; }
function pool(){ const qs=QUIZ[P.disc]||[]; return S.level?qs.filter(q=>q.level===S.level):qs; }
function start(mode){
  let qs = mode==="mistakes" ? (QUIZ[P.disc]||[]).filter(q=>st().wrong.includes(q.id)) : pool();
  qs = shuffle(qs).slice(0, mode==="exam"?30:mode==="quick"?10:qs.length);
  if(!qs.length) return;
  S.run={mode,qs,i:0,ans:[],picked:null}; S.view="run"; render(); scrollTo(0,0);
}
function refsHTML(q){
  const b=BOOKS[P.disc]; return `<div class="refs">${(q.refs||[]).map(id=>{ const it=itemById(id); if(!it) return ""; return `<a href="../?item=${encodeURIComponent(id)}#${P.disc}">${esc(it.ref||tx(it,"title"))}</a><a href="${esc(b.source.url)}#page=${it.page}" target="_blank" rel="nofollow noopener noreferrer">${t("pdf")} ${it.page} ↗</a>`; }).join("")}</div>`;
}
function qCard(q,picked,reveal,idx,total){
  return `<div class="qcard"><div class="qhead"><span class="type ${q.type}">${t(q.type)||q.type}</span><span>${idx!=null?`${t("q")} ${idx+1} ${t("of")} ${total}`:""} · ${esc(q.topic||"")} · ${t("l"+q.level)||""}</span></div>
    <h2>${esc(tx(q,"q"))}</h2><div class="opts">${q.options.map((o,i)=>{ let c=""; if(reveal){ if(i===q.answer)c="right"; else if(i===picked)c="wrong"; } else if(i===picked)c="chosen"; return `<button ${reveal||picked!=null?"disabled":""} class="${c}" data-opt="${i}">${esc(o[L()]||o.en)}</button>`; }).join("")}</div>
    ${reveal?`<div class="explain ${picked===q.answer?"":"bad"}"><b>${picked===q.answer?t("right"):t("wrong")}</b> ${esc(tx(q,"explain"))}${refsHTML(q)}</div>`:""}</div>`;
}
function homeView(){
  const d=P.disc==="sporting"?"Sporting™":"Compak® Sporting", qs=QUIZ[P.disc]||[], s=st();
  if(!qs.length) return `<h1>${t("title").replace("{d}",d)}</h1><div class="empty">${t("none")}</div>`;
  const acc=s.ans?Math.round(s.ok/s.ans*100):0;
  return `<a class="small" href="../#${P.disc}">${t("back")}</a><div class="eyebrow" style="margin-top:12px">FITASC · ${d}</div><h1>${t("title").replace("{d}",d)}</h1><p class="muted">${t("lead")}</p>
   <div class="stats"><div><small>${t("sAns")}</small><b>${s.ans}</b></div><div><small>${t("sAcc")}</small><b>${acc}%</b></div><div><small>${t("sBest")}</small><b>${s.best}%</b></div><div><small>${t("sMist")}</small><b>${s.wrong.length}</b></div></div>
   <div class="filters">${t("level")}: ${[0,1,2,3].map(l=>`<button class="chip" data-level="${l}" aria-pressed="${S.level===l}">${l?t("l"+l):t("all")}</button>`).join("")}<span>· ${pool().length} ${t("count")}</span></div>
   <div class="modes"><button class="mode" data-start="quick"><b>${t("quick")}</b><span>${t("quickS")}</span></button><button class="mode" data-start="exam"><b>${t("exam")}</b><span>${t("examS")}</span></button><button class="mode" data-start="mistakes" ${s.wrong.length?"":"disabled"}><b>${t("mist")}</b><span>${s.wrong.length?t("mistS"):t("noMist")}</span><small>${s.wrong.length||""}</small></button></div>
   <div class="disclaimer">${t("disc")}</div>`;
}
function runView(){
  const r=S.run, q=r.qs[r.i], exam=r.mode==="exam", answered=r.picked!=null;
  return `<div class="bar"><i style="width:${(r.i/r.qs.length)*100}%"></i></div>${qCard(q,r.picked,answered&&!exam,r.i,r.qs.length)}
    <div class="qfoot"><button class="btn" data-home="1">${t("home")}</button>${answered?`<button class="btn primary" data-next="1">${r.i+1<r.qs.length?t("next"):t("finish")}</button>`:""}</div>`;
}
function resultView(){
  const r=S.run, ok=r.ans.filter((a,i)=>a===r.qs[i].answer).length, pct=Math.round(ok/r.qs.length*100), exam=r.mode==="exam";
  return `<div class="result"><div class="eyebrow">${t("res")} · ${t(r.mode==="mistakes"?"mist":r.mode)}</div><div class="score ${!exam||pct>=PASS*100?"pass":"fail"}">${ok} / ${r.qs.length}</div><p class="muted" style="margin:0 auto 14px">${pct}%${exam?" · "+(pct>=PASS*100?t("pass"):t("fail")):""}</p>
    <button class="btn primary" data-start="${r.mode}">${t("again")}</button> <button class="btn" data-home="1">${t("home")}</button></div>
    ${exam||r.ans.some((a,i)=>a!==r.qs[i].answer)?`<h2 style="margin-top:24px">${t("review")}</h2><div class="review">${r.qs.map((q,i)=>exam||r.ans[i]!==q.answer?qCard(q,r.ans[i],true,i,r.qs.length):"").join("")}</div>`:""}`;
}
function render(){
  document.documentElement.lang=L()==="uk"?"uk":"en";
  document.getElementById("svc").innerHTML=`${t("svc")}<small>${t("svcS")}</small>`;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===L()));
  document.querySelectorAll("[data-disc]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.disc===P.disc));
  document.getElementById("app").innerHTML = S.view==="run"?runView():S.view==="result"?resultView():homeView();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return; const d=b.dataset;
  if(d.lang){ P.lang=d.lang; store.set(P); render(); return; }
  if(d.disc){ P.disc=d.disc; S={view:"home",level:0,run:null}; store.set(P); try{history.replaceState(null,"","#"+P.disc)}catch(_){} render(); return; }
  if(d.level!==undefined){ S.level=+d.level; render(); return; }
  if(d.start){ start(d.start); return; }
  if(d.home){ S.view="home"; S.run=null; render(); scrollTo(0,0); return; }
  if(d.opt!==undefined && S.run && S.run.picked==null){
    const r=S.run, q=r.qs[r.i], pick=+d.opt, s=st(); r.picked=pick; r.ans[r.i]=pick; s.ans++;
    if(pick===q.answer){ s.ok++; s.wrong=s.wrong.filter(id=>id!==q.id); } else if(!s.wrong.includes(q.id)) s.wrong.push(q.id);
    store.set(P); render(); return; }
  if(d.next){ const r=S.run; r.i++; r.picked=null; if(r.i>=r.qs.length){ const ok=r.ans.filter((a,i)=>a===r.qs[i].answer).length; if(r.mode==="exam"){ st().best=Math.max(st().best,Math.round(ok/r.qs.length*100)); store.set(P);} S.view="result"; } render(); scrollTo(0,0); return; }
});
render();
</script>
