<style>
:root{
  color-scheme:dark;
  --bg:#030712; --surface:rgba(255,255,255,.04); --surface2:#0B1120; --line:rgba(255,255,255,.1);
  --ink:#F3F4F6; --soft:#D1D5DB; --muted:#9CA3AF;
  --em:#34D399; --em-soft:rgba(16,185,129,.15); --primary:#05845D; --cyan:#22D3EE;
  --clay:#FB923C; --clay-soft:rgba(251,146,60,.14); --red:#F87171; --red-soft:rgba(248,113,113,.14);

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--body)}
a{color:var(--em)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--em);outline-offset:2px}
/* Header (wave 2, 10.11.2026, design-mockups/rules-trainer.html variant C): not sticky; on a phone the breadcrumb is one row and
   Sporting / Compak + the language share the second (the tabs say "Compak®" there, .lg hidden). During a test the sticky line is .run. */
.top{background:rgba(3,7,18,.9);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:9px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
@media(max-width:760px){
 .top-in{padding-block:8px;gap:8px}
 .crumbs{flex-basis:100%;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;font-size:13.5px}

 #discG{flex:1}#discG button{flex:1;padding:6px 8px}
 #tlang{width:auto;max-width:130px}
}
@media(max-width:420px){#discG .lg{display:none}}
/* Breadcrumb «🎓 Академія › Практика › Тренажер правил» instead of a second logo: the trainer belongs to the Academy Practice
   (owner decision 07.10.2026; the ONE ClayArena logo is in the bar, docs/shared/nav.js, which highlights «Академія» here). */
.crumbs{display:flex;align-items:center;gap:4px 7px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumbs a{color:var(--soft);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}

.confirm p{margin:0 0 4px;flex-basis:100%}
.resume b{margin-right:4px}
/* "→" next to the language select: shown only after a keyboard choice (arrows move in the list, Enter or this button applies it) */
.langgo{background:var(--surface2,#0B1120);border:1px solid rgba(52,211,153,.45);border-radius:8px;padding:6px 12px;font-size:13.5px;min-height:36px;color:var(--em)}
@media (pointer:coarse){.btn,.seg button,.opts button,.langgo{min-height:44px}}

h1,h2,h3{letter-spacing:-.01em;text-wrap:balance}

.acc .ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--em) calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center;flex:none}

.list{display:grid;gap:8px;margin:12px 0}
.list button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:60px;transition:border-color .15s}
.list button:hover:not([disabled]){border-color:rgba(52,211,153,.5)}

.lvbars{flex:none;display:inline-flex;gap:2px;align-items:flex-end}.lvbars i{display:block;width:4px;border-radius:1px;background:rgba(255,255,255,.18)}

.run .r1{display:flex;align-items:center;gap:8px 10px;font-size:14px;color:var(--soft)}
.run .r1 b{color:#fff}.run .r1 .sp{flex:1}.run .r1>span{white-space:nowrap}.run .r1 .saved{color:var(--em);font-size:13px}
.run .x{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;min-width:40px;min-height:40px;font-size:15px;color:var(--soft)}
@media(max-width:360px){.run .r1 .saved{display:none}}
.track{display:flex;gap:3px;margin:8px 0 0}
.track.many{gap:1px}

.type{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px}

.type.truefalse{background:var(--em-soft);color:var(--em)}
.type.choice{background:rgba(255,255,255,.08);color:var(--soft)}

.qcard{background:linear-gradient(to bottom right,rgba(255,255,255,.1),rgba(255,255,255,.05));border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:10px}
.qcard h2{font-size:19px;font-weight:600;line-height:1.45;margin:8px 0 16px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:12px 14px;font-size:15px}
.opts button:hover:not([disabled]){border-color:rgba(52,211,153,.5)}
.opts button.right{border-color:var(--em);background:var(--em-soft)}
.opts button.wrong{border-color:var(--red);background:var(--red-soft)}
.opts button.chosen{border-color:var(--cyan);background:rgba(34,211,238,.1)}
.opts button[disabled]{cursor:default}
/* options carry letters (А/Б/В; ✓/✕ for true or false), so the verdict can name the right one */
.opts button{display:flex;gap:12px;align-items:flex-start}
.opts .lt{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:-1px}
.opts button.right .lt{background:var(--em);border-color:var(--em);color:#030712}
.opts button.wrong .lt{background:var(--red);border-color:var(--red);color:#030712}
.verdict{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-top:14px;font-size:15px}
.verdict.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.45)}
.verdict.no{background:var(--red-soft);border:1px solid rgba(248,113,113,.5)}
.verdict i{font-style:normal;font-weight:800;width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;margin-top:1px;color:#030712}
.verdict.ok i{background:var(--em)}.verdict.no i{background:var(--red)}
.verdict b{color:#fff}
.expl{color:var(--soft);margin-top:10px}
.qsim.after{margin-top:14px}
/* the rule under an answer, as on the rules pages: number badge (FITASC reference in its tooltip), title, PDF page */
.qrefs{display:grid;gap:6px;margin-top:12px}
.qrefs .rr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.inum{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#6ee7b7;font-size:12px;line-height:1.5;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.qrefs a.t{color:var(--soft);text-decoration:none;font-size:14px}.qrefs a.t:hover{color:#fff;text-decoration:underline}
.qrefs a.p{font-size:13px;white-space:nowrap}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
/* «Перервати тест» and «Далі →» are the same size (owner, 10.11.2026) */
.qfoot .btn{min-width:min(180px,calc(50% - 5px));min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
/* the answer (verdict, explanation, rule) is set off from the options by a line */
.ans{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.ans .verdict{margin-top:0}
.btn{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.result{background:linear-gradient(to bottom right,rgba(255,255,255,.1),rgba(255,255,255,.05));border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center}
.result .score{font-size:56px;font-weight:800;line-height:1;margin:10px 0;font-variant-numeric:tabular-nums}
/* colour of the score: green from 80 % (the pass mark), amber 50–79 %, red below 50 % */
.score.good{color:var(--em)}.score.mid{color:#FCD34D}.score.low{color:var(--red)}
.result .track{max-width:360px;margin:12px auto 0}
.result .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 0}
.bych{display:grid;gap:6px;margin:14px 0 0;text-align:left}
.bych .h{font-size:13px;color:var(--muted)}
.bych .row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px;color:var(--soft)}
.bych .row i{grid-column:1/3;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bych .row i u{display:block;height:100%;background:var(--em)}

.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

<script>
/* ClayArena · FITASC rules trainer.
   Questions: docs/rules/data/quiz-<key>.js (format rules/QUIZ_SCHEMA.md in the repository, outside docs/); every question cites rule item ids (refs)
   from docs/rules/data/<key>.js, so each explanation links to the item in the rules guide and to the FITASC PDF page.
   Modes: quick (10 random), short (10 random, results only at the end, pass mark 80%: the short rules test of the
   Academy route "Перші змагання"), exam (30 random, results only at the end, pass mark 80%), mistakes (questions answered
   wrong before). Progress is stored per browser in localStorage "clayarena-trainer" (builds before 10.2026 used a
   legacy key, see OLD and migrate() below: copied over once and still read as a fallback). In production: the ClayArena
   user profile. The ClayArena Academy READS this key (docs/shared/progress.js, ClayProgress.trainerPass): stats[disc].best =
   best exam in %, stats[disc].short_best / short_at = best short test in % and its date. Only this page writes them.
   Opened from the Academy (?lang=<l>&from=learn[&mode=short]): a "← Академія" link back (the Academy page the reader came from,
   else the Academy home of the language; docs/shared/nav.js knows which Academy languages are published), the short test is
   offered first, and changing the language keeps ?lang in the address (history.replaceState), so a reload or a shared link
   stays in that language.
   NAVIGATION (owner decision 07.10.2026, DEVELOPERS.md §4): the trainer is part of the Academy Practice. Header = breadcrumb
   «🎓 Академія › Практика › Тренажер правил» (names from the ONE naming table of docs/shared/nav.js, ClayNav.link/name).
   Language: ?lang=<l> > visitor language (localStorage "clayarena-lang", every switcher of the site writes it) > last choice here
   > browser; the language select writes the visitor language too. A mouse/touch pick applies at once; with the keyboard the arrows
   only move in the list and Enter or the "→" button (#tlangGo) applies the language (audit ia-code-22, like the Academy select).
   Header not sticky (wave 2, 10.11.2026). During a test: a sticky line «mode · n of N · ✓ прогрес збережено · ✕» with the progress
   track (variant C, see the comment above ruleNum); the way back is ✕ / «Перервати тест», then the mode screen with «← Академія»
   (from=learn) or «← Правила FITASC». «Перервати тест» asks «Зберегти й вийти» (the run stays saved for 24 h, the mode screen offers «Продовжити») or «Скинути».
   A saved run is resumed automatically only when the link asks for nothing else: a different ?mode or #discipline opens the mode
   screen with the unfinished test and the requested mode side by side (the visitor chooses). ?mode=mistakes (the bar's hint
   "mistakes to repeat") starts the mistakes test of that discipline. Switching the discipline during a test pauses it. ClayArena naming only (audit R-02): no other service name in texts, JSON-LD or storage keys.
   Answer order: the options of a question are shuffled for every run (except true/false), so the right answer cannot
   be guessed by its place. The trainer never reorders the data: it only maps display order -> option index (run.ord),
   and every comparison uses the data index (q.answer), so the language overlays (same option order as the data) stay valid.
   Languages: all ClayArena site languages. uk/en live in the question files; the others come from
   docs/rules/data/i18n/quiz-<lang>.json ({ui, questions: {id: {q, options[], explain}}}), fetched on demand, English fallback per field.
   Animations: a question may carry "sim" ({type:"pair", kind} | {type:"flight", preset}) — drawn by the shared module
   docs/shared/sims.js (the same one the Interpreter Academy and the glossary use). */
const LANGS=["en","uk","de","fr","it","cs","pl","pt","hu","fi","lt"];

  if(d.start){ start(d.start); return; }
  if(d.home){ S.view="home"; S.run=null; S.paused=false; render(); scrollTo(0,0); return; }
  /* «Перервати тест»: nothing answered yet → back to the modes; else ask «Зберегти й вийти» / «Скинути» / «Продовжити тест». */
  if(d.stop){ const r=S.run; if(r&&r.i===0&&r.picked==null){ S.view="home"; S.run=null; render(); scrollTo(0,0); return; }
    S.ask=true; render(); const f=document.querySelector("[data-pause]"); if(f) f.focus(); return; }
  if(d.pause){ S.ask=false; S.paused=true; S.view="home"; render(); scrollTo(0,0); const f=document.querySelector("[data-resume]"); if(f) f.focus(); return; }
  if(d.reset){ S.ask=false; S.paused=false; S.run=null; S.view="home"; render(); return; }
  if(d.cancel){ S.ask=false; render(); const f=document.querySelector("[data-stop]"); if(f) f.focus(); return; }
  if(d.resume){ if(S.run){ P.disc=S.run.disc; store.set(P); try{history.replaceState(null,"",runUrl(S.run))}catch(_){} S.view="run"; S.paused=false; render(); scrollTo(0,0); } return; }
  if(d.opt!==undefined && S.run && S.run.picked==null){
    const r=S.run, q=r.qs[r.i], pick=+d.opt, s=st(); r.picked=pick; r.ans[r.i]=pick; s.ans++;
    if(pick===q.answer){ s.ok++; s.wrong=s.wrong.filter(id=>id!==q.id); } else if(!s.wrong.includes(q.id)) s.wrong.push(q.id);
    store.set(P); render(); return; }
  if(d.next){ const r=S.run; r.i++; r.picked=null; if(r.i>=r.qs.length){ const ok=r.ans.filter((a,i)=>a===r.qs[i].answer).length, pct=Math.round(ok/r.qs.length*100);
      if(r.mode==="exam"){ st().best=Math.max(st().best,pct); store.set(P);}
      if(r.mode==="short"){ const s=st(); if(s.short_best==null||pct>=s.short_best){ s.short_best=pct; s.short_at=today(); } store.set(P);} // read by the Academy (progress.js)
      stat("trainer_test",P.disc+":"+r.mode+":"+pct);
      S.view="result"; } render(); scrollTo(0,0); return; }
});
/* Language select (audit ia-code-22, the same rule as the Academy header select, docs/learn/app/academy.js langSelKey/langSelChange):
   a pick with the mouse or finger applies at once; with the keyboard the arrows only move in the list (a closed native select
   fires "change" on every arrow step), and Enter or the "→" button that appears applies the language. So the test page does not
   flash through other languages (and fetch their files) while a keyboard user browses the list. */
const tSel=document.getElementById("tlang"), tGo=document.getElementById("tlangGo");
async function setLang(l){ tGo.style.display="none"; delete tSel.dataset.kbd; if(!LANGS.includes(l)||l===P.lang){ tSel.value=L(); return; }
  P.lang=l; store.set(P); stat("lang",P.lang); vlSet(P.lang);
  try{ const u=new URL(location.href); u.searchParams.set("lang",P.lang); history.replaceState(null,"",u.pathname+u.search+u.hash); }catch(_){} // keep ?lang (and from/mode)
  await loadLang(P.lang); render(); }
tSel.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); setLang(tSel.value); return; }
  if(e.key.length===1||/^(Arrow|Page|Home|End)/.test(e.key)) tSel.dataset.kbd="1"; });
tSel.addEventListener("pointerdown",()=>{ delete tSel.dataset.kbd; });
tSel.addEventListener("change",()=>{ if(tSel.value===L()){ tGo.style.display="none"; return; } if(tSel.dataset.kbd){ tGo.style.display=""; return; } setLang(tSel.value); });
tGo.addEventListener("click",()=>{ setLang(tSel.value); const f=document.getElementById("tlang"); if(f) f.focus(); });
/* ?mode=mistakes (the bar's hint "mistakes to repeat", per discipline): start the mistakes test at once, unless a saved test waits. */
loadLang(P.lang).then(()=>{ if(WANT_MODE==="mistakes"&&!S.run&&st().wrong.length) start("mistakes"); else render(); });
</script>
