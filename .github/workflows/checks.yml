# Project checks on every pull request (handover 09.10.2026; the weekly FITASC check is fitasc-check.yml).
# Commands and what each one checks: DEVELOPERS.md section 2 and tools/checks/README.md.
# Windows runner: scripts/make_og.py needs Segoe UI and the pixel limits of check_safety.py were measured on Windows.
# Nothing here writes into docs/ or publishes anything.
name: Project checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r tools/checks/requirements.txt
          python -m playwright install chromium
      - name: Academy checks (no writing)
        run: bun scripts/build_academy.mjs --check --quiet
      - name: Rules guide and trainer data
        run: bun scripts/check_rules_data.mjs
      - name: Statistics tracker and collector
        run: |
          bun tools/stats/checks/check_tracker.mjs
          bun tools/stats/checks/check_collector.mjs
      - name: Animation safety
        run: python tools/checks/check_safety.py
      - name: Lesson quizzes (uk + en; the full run is 15-20 min)
        run: python tools/checks/check_quiz.py --langs uk,en
