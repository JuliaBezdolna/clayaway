name: FITASC rules check

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare with rules/sources.json
        id: check
        run: |
          set +e
          python scripts/fitasc_check.py
          code=$?
          if [ $code -eq 10 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Open an issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Оновився регламент FITASC ($(date -u +%Y-%m-%d))"
          if gh issue list --state open --search "Оновився регламент FITASC in:title" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --title "$title" --body-file rules/update_report.md
          else
            echo "An open update issue already exists"
          fi
